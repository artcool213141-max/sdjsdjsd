<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PandaGift - Мини игры</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root {
            --bg-dark: #07173f;
            --blue: #2f6bff;
            --blue-light: #8fc2ff;
            --blue-deep: #1d4ed8;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-line: rgba(255, 255, 255, 0.18);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background:
                radial-gradient(circle at 50% 10%, #4a86ff 0%, rgba(47,107,255,0.35) 26%, transparent 60%),
                linear-gradient(180deg, #1f55d6 0%, #133ea6 42%, #08205f 100%);
            background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        /* Пузырьки на фоне */
        #sparks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .spark {
            position: absolute; bottom: -10px; border-radius: 50%;
            background: #bcd8ff; opacity: 0;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            15%  { opacity: 0.7; }
            100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
        }

        .header-panel {
            position: relative; z-index: 2;
            padding: 12px 20px; background: rgba(8, 28, 92, 0.55);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-line);
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }

        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--glass-line);
            transition: transform 0.15s;
        }
        .back-btn:active { transform: scale(0.9); }

        .balance-pill {
            display: flex; align-items: center; gap: 8px;
            background: var(--glass); padding: 6px 12px; backdrop-filter: blur(10px);
            border-radius: 999px; border: 1px solid #000;
        }

        .games-container {
            position: relative; z-index: 2;
            flex-grow: 1; overflow-y: auto; padding: 20px 16px;
        }

        .games-title {
            font-size: 12px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: #cfe0ff; margin: 0 0 16px 4px;
        }

        /* Горизонтальная карточка игры (в стиле карточек с главной) */
        .game-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.06) 100%);
            border: 1px solid var(--glass-line);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }
        .game-card:active { transform: scale(0.97); border-color: #fff; background: rgba(255, 255, 255, 0.24); }
        .game-card img { width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 20, 90, 0.4)); }
        .card-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 16px; line-height: 1; letter-spacing: -0.3px; }
        .card-desc { font-size: 10px; font-weight: 700; color: #cfe0ff; text-transform: uppercase; opacity: 0.95; margin-top: 5px; }

        ::-webkit-scrollbar { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .spark { animation: none; }
        }
    </style>
</head>
<body>

    <div id="sparks"></div>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="back-btn">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">Panda<span style="color:#8fc2ff">Gift</span></div>
        </div>
        <div class="flex items-center gap-2">
            <div class="balance-pill">
                <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
                <span id="val-stars" class="font-black text-sm">0.00</span>
            </div>
            <div class="balance-pill">
                <img src="img/ton.png" class="w-4 h-4" alt="TON">
                <span id="val-ton" class="font-black text-sm">0.00</span>
            </div>
        </div>
    </header>

    <main class="games-container">
        <h1 class="games-title">Мини игры</h1>

        <!-- МИНЫ -->
        <div onclick="openMines()" class="game-card">
            <img src="img/bomb.png" alt="Мины">
            <div>
                <div class="card-title">Мины</div>
                <div class="card-desc">Открывай звёзды, обходи мины и забирай выигрыш</div>
            </div>
            <div class="ml-auto opacity-50">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                </svg>
            </div>
        </div>
    </main>

    <script src="music.js"></script>
    <script>
        const SB_URL = "https://xbklrdpguqsuvqndcujb.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhia2xyZHBndXFzdXZxbmRjdWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ0NzUsImV4cCI6MjEwNzIxMDQ3NX0.IeK3NGOTu_J1jDOd_XjHQUOySnkbFh4uThGCPeu-Wu4";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;

        tg.expand();
        try {
            tg.headerColor = '#1f55d6';
            tg.backgroundColor = '#08205f';
        } catch (_) {}

        let user = null;

        function goHome() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'index.html';
        }

        function openMines() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'mines.html?v=' + Date.now();
        }

        async function loadBalance() {
            const userId = tg.initDataUnsafe?.user?.id || 8015661230;
            try {
                const { data, error } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (error) throw error;
                if (data) {
                    user = data;
                    document.getElementById('val-stars').innerText = Number(user.balance || 0).toFixed(2);
                    document.getElementById('val-ton').innerText = Number(user.ton_balance || 0).toFixed(2);
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса:", e);
            }
        }

        loadBalance();

        // Поднимающиеся пузырьки (только оформление)
        (function makeSparks() {
            const box = document.getElementById('sparks');
            for (let i = 0; i < 22; i++) {
                const s = document.createElement('div');
                const size = 2 + Math.random() * 3;
                s.className = 'spark';
                s.style.width = s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.animationDuration = (6 + Math.random() * 8) + 's';
                s.style.animationDelay = (-Math.random() * 12) + 's';
                s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
                box.appendChild(s);
            }
        })();
    </script>
</body>
</html>
