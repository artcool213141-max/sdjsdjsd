<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PandaGift - Мини игры</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root {
            --bg-dark: #07173f;
            --blue: #2f6bff;
            --blue-light: #8fc2ff;
            --blue-deep: #1d4ed8;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-line: rgba(255, 255, 255, 0.18);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background:
                radial-gradient(circle at 50% 10%, #4a86ff 0%, rgba(47,107,255,0.35) 26%, transparent 60%),
                linear-gradient(180deg, #1f55d6 0%, #133ea6 42%, #08205f 100%);
            background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        /* Пузырьки на фоне */
        #sparks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .spark {
            position: absolute; bottom: -10px; border-radius: 50%;
            background: #bcd8ff; opacity: 0;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            15%  { opacity: 0.7; }
            100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
        }

        .header-panel {
            position: relative; z-index: 2;
            padding: 12px 20px; background: rgba(8, 28, 92, 0.55);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-line);
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }

        .back-btn {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 12px;
            background: var(--glass); border: 1px solid var(--glass-line);
            transition: transform 0.15s;
        }
        .back-btn:active { transform: scale(0.9); }

        .balance-pill {
            display: flex; align-items: center; gap: 8px;
            background: var(--glass); padding: 6px 16px; backdrop-filter: blur(10px);
            border-radius: 999px; border: 1px solid #000;
        }

        .games-container {
            position: relative; z-index: 2;
            flex-grow: 1; overflow-y: auto; padding: 20px 16px;
        }

        .games-title {
            font-size: 12px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.15em; color: #cfe0ff; margin: 0 0 16px 4px;
        }

        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }

        .game-card { display: flex; flex-direction: column; align-items: center; gap: 8px; }

        .game-btn {
            position: relative; overflow: hidden;
            width: 100%; aspect-ratio: 1 / 1; border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.08) 100%);
            border: 1px solid var(--glass-line);
            backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; transition: transform 0.15s;
            box-shadow: 0 8px 20px rgba(0, 20, 90, 0.35);
        }
        .game-btn:active {
            transform: scale(0.95);
            border-color: #fff;
        }

        .game-name {
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.1em; color: #cfe0ff;
        }

        #toast {
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
            background: #0a2468; border: 1px solid var(--blue-light); color: #fff;
            font-size: 11px; font-weight: 700; padding: 10px 18px; border-radius: 999px;
            opacity: 0; pointer-events: none; transition: 0.25s; z-index: 10;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        ::-webkit-scrollbar { display: none; }

        @media (prefers-reduced-motion: reduce) {
            .spark { animation: none; }
        }
    </style>
</head>
<body>

    <div id="sparks"></div>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="back-btn">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">Panda<span style="color:#8fc2ff">Gift</span></div>
        </div>
        <div class="balance-pill">
            <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <main class="games-container">
        <h1 class="games-title">Мини игры</h1>

        <div class="games-grid">
            <div class="game-card" onclick="window.location.href='basket.html?v=' + Date.now()">
                <button class="game-btn">🏀</button>
                <span class="game-name">Баскет</span>
            </div>
            <div class="game-card" onclick="window.location.href='football.html?v=' + Date.now()">
                <button class="game-btn">⚽</button>
                <span class="game-name">Футбол</span>
            </div>
            <div class="game-card" onclick="window.location.href='darts.html?v=' + Date.now()">
                <button class="game-btn">🎯</button>
                <span class="game-name">Дартс</span>
            </div>
        </div>
    </main>

    <div id="toast">Скоро будет доступно</div>

    <script src="music.js"></script>
    <script>
        const SB_URL = "https://xbklrdpguqsuvqndcujb.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhia2xyZHBndXFzdXZxbmRjdWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ0NzUsImV4cCI6MjEwNzIxMDQ3NX0.IeK3NGOTu_J1jDOd_XjHQUOySnkbFh4uThGCPeu-Wu4";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;

        tg.expand();
        try {
            tg.headerColor = '#1f55d6';
            tg.backgroundColor = '#08205f';
        } catch (_) {}

        // Страницы игр. Когда сделаешь файл игры — поставь ready: true
        const GAMES = {
            basket:   { url: 'basket.html',   ready: false },
            football: { url: 'football.html', ready: false },
            darts:    { url: 'darts.html',    ready: false }
        };

        let user = null;

        function goHome() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'index.html';
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1800);
        }

        function openGame(name) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            const game = GAMES[name];
            if (game && game.ready) {
                window.location.href = game.url;
            } else {
                showToast('Скоро будет доступно');
            }
        }

        async function loadBalance() {
            const userId = tg.initDataUnsafe?.user?.id || 8015661230;
            try {
                const { data, error } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (error) throw error;
                if (data) {
                    user = data;
                    document.getElementById('val-stars').innerText = Number(user.balance || 0).toFixed(2);
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса:", e);
            }
        }

        loadBalance();

        // Поднимающиеся пузырьки (только оформление)
        (function makeSparks() {
            const box = document.getElementById('sparks');
            for (let i = 0; i < 22; i++) {
                const s = document.createElement('div');
                const size = 2 + Math.random() * 3;
                s.className = 'spark';
                s.style.width = s.style.height = size + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.animationDuration = (6 + Math.random() * 8) + 's';
                s.style.animationDelay = (-Math.random() * 12) + 's';
                s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
                box.appendChild(s);
            }
        })();
    </script>
</body>
</html>
