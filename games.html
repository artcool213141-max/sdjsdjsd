<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FixStars - Мини игры</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #22c55e; }

        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background: #050505; color: white; font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        .header-panel {
            padding: 12px 20px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a;
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }

        .games-container {
            flex-grow: 1; overflow-y: auto; padding: 20px 16px;
        }

        .games-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
        }

        .game-card { display: flex; flex-direction: column; align-items: center; gap: 8px; }

        .game-btn {
            width: 100%; aspect-ratio: 1 / 1; border-radius: 22px;
            background: linear-gradient(160deg, #141414, #0a0a0a);
            border: 1px solid #222;
            display: flex; align-items: center; justify-content: center;
            font-size: 44px; transition: 0.2s;
            box-shadow: 0 0 0 rgba(34, 197, 94, 0);
        }
        .game-btn:active {
            transform: scale(0.94);
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.25);
        }

        .game-name {
            font-size: 10px; font-weight: 900; text-transform: uppercase;
            letter-spacing: 0.1em; color: #6b7280;
        }

        #toast {
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
            background: #111; border: 1px solid #222; color: #9ca3af;
            font-size: 11px; font-weight: 700; padding: 10px 18px; border-radius: 14px;
            opacity: 0; pointer-events: none; transition: 0.25s;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="flex items-center justify-center w-8 h-8 rounded-xl bg-[#111] border border-[#222] active:scale-90 transition-transform">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">FIX<span class="text-[#22c55e]">STARS</span></div>
        </div>
        <div class="flex items-center gap-2 bg-[#111] px-4 py-1.5 rounded-full border border-[#222]">
            <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

<main class="games-container">
        <h1 class="text-xs uppercase font-black tracking-widest text-gray-500 mb-4 px-1">Мини игры</h1>

        <div class="games-grid">
            <div class="game-card" onclick="window.location.href='basket.html?v=' + Date.now()">
                <button class="game-btn">🏀</button>
                <span class="game-name">Баскет</span>
            </div>
            <div class="game-card" onclick="window.location.href='football.html?v=' + Date.now()">
                <button class="game-btn">⚽</button>
                <span class="game-name">Футбол</span>
            </div>
            <div class="game-card" onclick="window.location.href='darts.html?v=' + Date.now()">
                <button class="game-btn">🎯</button>
                <span class="game-name">Дартс</span>
            </div>
            <div class="game-card" onclick="window.location.href='crash.html?v=' + Date.now()">
                <button class="game-btn">🚀</button>
                <span class="game-name">Краш</span>
            </div>
            <div class="game-card" onclick="window.location.href='rolls.html?v=' + Date.now()">
                <button class="game-btn">🔄</button>
                <div class="flex flex-col items-center">
                    <span class="game-name">Рандомайзер</span>
                    <span class="text-[9px] text-green-500 font-bold uppercase opacity-80 mt-0.5">онлайн</span>
                </div>
            </div>
        </div>
    </main>

    <div id="toast">Скоро будет доступно</div>

    <script>
        const SB_URL = "https://xbklrdpguqsuvqndcujb.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhia2xyZHBndXFzdXZxbmRjdWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ0NzUsImV4cCI6MjEwNzIxMDQ3NX0.IeK3NGOTu_J1jDOd_XjHQUOySnkbFh4uThGCPeu-Wu4";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;

        tg.expand();

        // Страницы игр. Когда сделаешь файл игры — поставь ready: true
        const GAMES = {
            basket:   { url: 'basket.html',   ready: false },
            football: { url: 'football.html', ready: false },
            darts:    { url: 'darts.html',    ready: false }
        };

        let user = null;

        function goHome() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'index.html';
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.innerText = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1800);
        }

        function openGame(name) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            const game = GAMES[name];
            if (game && game.ready) {
                window.location.href = game.url;
            } else {
                showToast('Скоро будет доступно');
            }
        }

        async function loadBalance() {
            const userId = tg.initDataUnsafe?.user?.id || 8015661230;
            try {
                const { data, error } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (error) throw error;
                if (data) {
                    user = data;
                    document.getElementById('val-stars').innerText = Number(user.balance || 0).toFixed(2);
                }
            } catch (e) {
                console.error("Ошибка загрузки баланса:", e);
            }
        }

        loadBalance();
    </script>
</body>
</html>
