<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PandaGift - Crash Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Подключаем Lottie для анимации crach.tgs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

        :root {
            --bg-dark: #07173f;
            --blue: #2f6bff;
            --blue-light: #8fc2ff;
            --soft: #cfe0ff;
            --gold: #ffd24a;
            --accent: #2f6bff;
            --accent-glow: rgba(47, 107, 255, 0.45);
            --panel: #1f1f21;
            --panel2: #173278;
            --panel-line: rgba(255, 255, 255, 0.1);
            --danger: #ff5a5a;
            --success: #43d9a3;
            --muted: #8d8e93;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(180deg, #173f9c 0%, #1c4cc0 45%, #173f9c 100%);
        }

        .num { font-variant-numeric: tabular-nums; }

        header {
            padding-top: calc(12px + var(--safe-top));
            padding-bottom: 12px;
            padding-left: 16px;
            padding-right: 16px;
            background: rgba(10, 24, 70, 0.6);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            position: relative;
            z-index: 110;
            flex: 0 0 auto;
        }

        .back-btn {
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1);
            color: #fff;
            transition: background 0.15s, transform 0.15s;
        }
        .back-btn:active { transform: scale(0.92); }

        .brand {
            font-weight: 900; font-style: italic; letter-spacing: -0.03em;
            font-size: 1.25rem; text-transform: uppercase; color: #fff;
        }
        .brand span { color: var(--blue-light); }

        .balance-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(10,24,70,.45);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 6px 10px 6px 8px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.85rem;
            color: #fff;
        }
        .currency-logo { width: 18px; height: 18px; object-fit: contain; }

        .game-container {
            position: relative;
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            overflow: hidden;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .grid-moving { animation: scrollGrid 3s linear infinite; }
        @keyframes scrollGrid {
            from { background-position: 0 0; }
            to { background-position: -80px 80px; }
        }

        .status-strip {
            position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 30;
            font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--soft);
            background: rgba(7, 23, 63, 0.75);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 5px 14px;
            border-radius: 999px;
            backdrop-filter: blur(6px);
        }
        .status-strip.is-live { color: var(--success); border-color: rgba(67,217,163,0.4); }
        .status-strip.is-crash { color: var(--danger); border-color: rgba(255,90,90,0.4); }

        /* Четкое отображение контейнера анимации crach.tgs */
        #rocket-wrap {
            position: absolute;
            left: 50%;
            bottom: 20%;
            transform: translate(-50%, 50%);
            z-index: 10;
            width: 180px;
            height: 180px;
            pointer-events: none;
            transition: transform 0.2s ease-out;
        }
        .flying { animation: floatRocket 2s ease-in-out infinite alternate; }
        @keyframes floatRocket {
            from { transform: translate(-50%, 50%) scale(1); }
            to { transform: translate(-50%, 45%) scale(1.05); }
        }

        #multiplier {
            position: absolute; left: 50%;
            top: calc(38% - 30px);
            transform: translate(-50%, -50%);
            font-size: clamp(3rem, 14vw, 4.2rem);
            font-weight: 900; z-index: 20;
            text-shadow: 0 0 30px var(--accent-glow);
            color: #fff;
            letter-spacing: -0.02em;
        }
        #multiplier.crashed { color: var(--danger); text-shadow: 0 0 40px rgba(255,90,90,0.5); }

        .live-drop {
            position: absolute; left: 12px; top: 48px; z-index: 25;
            display: flex; flex-direction: column; gap: 5px;
            max-width: 70px;
        }
        .drop-item {
            background: rgba(7, 23, 63, 0.85);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 4px 6px; border-radius: 6px; text-align: center;
            font-weight: 800; font-size: 11px;
        }

        .players-list {
            position: absolute; right: 12px; top: 48px; z-index: 25;
            display: flex; flex-direction: column; gap: 4px;
            max-width: 130px; width: 100%;
            max-height: 160px; overflow-y: auto;
            scrollbar-width: none;
        }
        .players-list::-webkit-scrollbar { display: none; }
        .player-bet-pill {
            background: rgba(7, 23, 63, 0.8);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 4px 8px; border-radius: 8px;
            font-size: 10px; font-weight: 700;
            display: flex; justify-content: space-between; align-items: center;
        }
        .player-bet-pill.cashed { border-color: var(--success); color: var(--success); }

        .ui-panel {
            flex: 0 0 auto;
            width: 100%;
            background: #112557;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 12px 16px calc(12px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }

        .mode-row { display: flex; gap: 8px; }
        .currency-btn {
            flex: 1;
            background: rgba(10,24,70,0.6);
            padding: 8px 0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.15s;
        }
        .currency-btn img { width: 14px; height: 14px; }
        .currency-btn.active {
            border-color: var(--blue-light);
            background: var(--blue);
            color: #fff;
            box-shadow: 0 0 12px rgba(47,107,255,0.4);
        }

        .bet-row { display: flex; gap: 8px; align-items: stretch; }

        .bet-input-wrap {
            flex: 1;
            background: rgba(7, 23, 63, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 6px 12px;
            display: flex; flex-direction: column; justify-content: center;
        }
        .bet-input-wrap .label {
            font-size: 9px; font-weight: 700; text-transform: uppercase;
            color: var(--muted); margin-bottom: 1px;
        }
        input#input-bet {
            background: transparent; border: none; outline: none;
            color: var(--blue-light); font-weight: 900; font-size: 1.25rem;
            width: 100%; padding: 0;
        }
        .bet-input-wrap.locked { opacity: 0.45; pointer-events: none; }

        .gift-bet-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; padding: 0 12px;
            font-size: 11px; font-weight: 800; color: var(--soft);
            display: flex; align-items: center; gap: 6px; cursor: pointer;
        }

        .quick-bets { display: flex; gap: 6px; }
        .quick-btn {
            flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; color: var(--soft); font-size: 11px; font-weight: 700; padding: 5px 0;
            text-align: center;
        }
        .quick-btn:active { background: rgba(255,255,255,0.15); }

        .btn-main {
            background: var(--blue);
            color: #fff;
            font-weight: 950;
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 6px 18px rgba(47, 107, 255, 0.4);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { filter: grayscale(0.7); opacity: 0.4; box-shadow: none; }
        .btn-main.is-live-cashout { background: var(--success); box-shadow: 0 6px 18px rgba(67, 217, 163, 0.4); color: #07173f; }
        .btn-main.is-bet-placed { background: #223875; color: var(--blue-light); border: 1px solid rgba(47,107,255,0.5); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #112557; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px; width: 100%; max-width: 360px; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden; padding: 16px;
        }
        .inventory-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
            overflow-y: auto; padding: 4px; margin-top: 10px;
        }
        .inv-item {
            background: rgba(7, 23, 63, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 8px; display: flex; flex-direction: column;
            align-items: center; cursor: pointer; text-align: center;
        }
        .inv-item img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 6px; }
        .inv-item span { font-size: 10px; font-weight: 700; color: var(--soft); }
    </style>
</head>
<body>

    <header>
        <div class="flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div onclick="location.href='index.html'" class="back-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                    </svg>
                </div>
                <div class="brand">Panda<span>Gift</span></div>
            </div>
            <div class="flex gap-2">
                <div class="balance-pill">
                    <span id="val-stars" class="num">0</span>
                    <img src="img/star.png" class="currency-logo" alt="star">
                </div>
                <div class="balance-pill">
                    <span id="val-ton" class="num">0.00</span>
                    <img src="img/ton.png" class="currency-logo" alt="ton">
                </div>
            </div>
        </div>
    </header>

    <div id="main-scene" class="game-container">
        <div id="live-drop" class="live-drop"></div>
        <div id="players-list" class="players-list"></div>
        <div id="status-strip" class="status-strip">Взлёт через 10с</div>
        <div id="multiplier" class="num">0.00x</div>
        <!-- Контейнер для анимации crach.tgs -->
        <div id="rocket-wrap">
            <div id="lottie-rocket" style="width:100%;height:100%;"></div>
        </div>
    </div>

    <div class="ui-panel">
        <div class="mode-row">
            <div id="mode-stars" onclick="switchMode('stars')" class="currency-btn active">
                <img src="img/star.png" alt=""> STARS
            </div>
            <div id="mode-ton" onclick="switchMode('ton')" class="currency-btn">
                <img src="img/ton.png" alt=""> TON
            </div>
        </div>

        <div class="bet-row">
            <div class="bet-input-wrap" id="bet-input-wrap">
                <span class="label">Ставка</span>
                <input type="number" id="input-bet" class="num" value="10">
            </div>
            <div class="gift-bet-btn" onclick="openInventoryModal()">
                🎁 Подарок
            </div>
        </div>

        <div class="quick-bets" id="quick-bets">
            <div class="quick-btn" onclick="setBet(10)">10</div>
            <div class="quick-btn" onclick="setBet(50)">50</div>
            <div class="quick-btn" onclick="setBet(100)">100</div>
            <div class="quick-btn" onclick="setBet(500)">500</div>
            <div class="quick-btn" onclick="halveBet()">½</div>
            <div class="quick-btn" onclick="doubleBet()">2×</div>
        </div>

        <button id="btn-main" onclick="onAction()" class="btn-main">Сделать ставку</button>
    </div>

    <!-- Модальное окно выбора подарка из инвентаря-строки -->
    <div id="inventory-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="flex justify-between items-center mb-2">
                <span class="font-extrabold text-sm">Выберите подарок для ставки</span>
                <button onclick="closeInventoryModal()" class="text-xs text-gray-400 font-bold">Закрыть</button>
            </div>
            <div id="inventory-list" class="inventory-grid"></div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    const SB_URL = "https://xjucalpaoqlrtmofmden.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhqdWNhbHBhb3FscnRtb2ZtZGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NDIzODcsImV4cCI6MjA5MjAxODM4N30.3jfEF1lSa1YTBYgc4O8ZtJVpfkJN9SBGmqYn8-Sn7Zo";
    const SB = supabase.createClient(SB_URL, SB_KEY);

    const BET_WINDOW_MS = 10000;
    const CRASH_DISPLAY_MS = 3000;

    let currentUser = null, cur = 'stars', state = 'wait', mult = 0.00;
    let betQueued = false, betVal = 0, isCashedOut = false;
    let crashPoint = 2.00;
    let currentRoundId = Math.floor(Date.now() / 1000);
    let historyLogged = false;
    let selectedGift = null;

    let phaseStart = Date.now();
    let roundTimer = null;
    let realtimeChannel = null;

    const el = {
        mult: document.getElementById('multiplier'),
        rocketWrap: document.getElementById('rocket-wrap'),
        scene: document.getElementById('main-scene'),
        btn: document.getElementById('btn-main'),
        strip: document.getElementById('status-strip'),
        betWrap: document.getElementById('bet-input-wrap'),
        quickBets: document.getElementById('quick-bets'),
        playersList: document.getElementById('players-list')
    };

    // Загрузка анимации crach.tgs через Lottie
    let lottieAnim = null;
    try {
        lottieAnim = lottie.loadAnimation({
            container: document.getElementById('lottie-rocket'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'crach.tgs'
        });
    } catch(e) { console.log('Lottie load error:', e); }

    async function checkAuth() {
        if (tg.initDataUnsafe?.user) {
            currentUser = { user_id: String(tg.initDataUnsafe.user.id), username: tg.initDataUnsafe.user.first_name || 'Игрок' };
        } else {
            currentUser = { user_id: '12345', username: 'Тестовый игрок' };
        }
        syncBalances();
        fetchHistory();
        initRealtimeBets();
    }

    async function syncBalances() {
        try {
            const { data } = await SB.from('users').select('*').eq('id', currentUser.user_id).single();
            if (data) {
                document.getElementById('val-stars').innerText = Math.floor(Number(data.stars || 0));
                document.getElementById('val-ton').innerText = Number(data.ton_balance || 0).toFixed(2);
            }
        } catch(e) {}
    }

    async function adjustBalance(delta) {
        const col = cur === 'stars' ? 'stars' : 'ton_balance';
        try {
            const { data } = await SB.from('users').select(col).eq('id', currentUser.user_id).single();
            const currentVal = Number(data?.[col] || 0);
            const newVal = currentVal + delta;
            if (newVal < 0) return false;

            await SB.from('users').update({ [col]: newVal }).eq('id', currentUser.user_id);
            syncBalances();
            return true;
        } catch(e) { return false; }
    }

    async function logCrashHistory(value) {
        try {
            await SB.from('crash_history').insert({ multiplier: Number(value) });
            fetchHistory();
        } catch(e) {}
    }

    function seededRandom(seed) {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }

    function generateCrashPoint(roundId) {
        const r = seededRandom(roundId);
        const r2 = seededRandom(roundId + 1);
        return r > 0.93 ? (2 + r2 * 10).toFixed(2) : (1.01 + r2 * 1.5).toFixed(2);
    }

    function startWaitPhase() {
        clearTimeout(roundTimer);
        state = 'wait';
        isCashedOut = false;
        betQueued = false;
        selectedGift = null;
        currentRoundId += 1;
        crashPoint = generateCrashPoint(currentRoundId);
        historyLogged = false;
        phaseStart = Date.now();
        mult = 0.00;

        el.rocketWrap.classList.remove('flying');
        el.rocketWrap.style.opacity = "0.2";
        el.scene.classList.remove('grid-moving');
        el.mult.classList.remove('crashed');
        el.mult.innerText = "0.00x";
        el.strip.classList.remove('is-live', 'is-crash');
        el.btn.classList.remove('is-live-cashout', 'is-bet-placed');
        el.btn.innerHTML = "Сделать ставку";
        el.btn.disabled = false;
        el.betWrap.classList.remove('locked');
        el.quickBets.classList.remove('locked');

        fetchHistory();
        syncBalances();
        clearOldRoundBets();

        roundTimer = setTimeout(startFlightPhase, BET_WINDOW_MS);
    }

    function startFlightPhase() {
        clearTimeout(roundTimer);
        state = 'fly';
        phaseStart = Date.now();

        el.rocketWrap.classList.add('flying');
        el.rocketWrap.style.opacity = "1";
        el.scene.classList.add('grid-moving');
        el.strip.innerText = 'В полёте';
        el.strip.classList.add('is-live');
        el.betWrap.classList.add('locked');
        el.quickBets.classList.add('locked');

        const flightSeconds = Math.log(crashPoint) / Math.log(1.10);
        roundTimer = setTimeout(() => doCrash(crashPoint), flightSeconds * 1000);
    }

    function doCrash(val) {
        clearTimeout(roundTimer);
        state = 'crash';
        phaseStart = Date.now();

        el.scene.classList.remove('grid-moving');
        el.mult.innerText = val + "x";
        el.mult.classList.add('crashed');
        el.strip.innerText = 'Крах';
        el.strip.classList.remove('is-live');
        el.strip.classList.add('is-crash');
        el.btn.classList.remove('is-live-cashout', 'is-bet-placed');
        el.btn.innerText = "Крах!";
        el.btn.disabled = true;
        betQueued = false;

        if (!historyLogged) {
            historyLogged = true;
            logCrashHistory(val);
        }

        roundTimer = setTimeout(startWaitPhase, CRASH_DISPLAY_MS);
    }

    function tick() {
        const elapsed = Date.now() - phaseStart;

        if (state === 'wait') {
            const secs = Math.max(0, Math.ceil((BET_WINDOW_MS - elapsed) / 1000));
            el.strip.innerText = `Взлёт через ${secs}с`;
        } else if (state === 'fly') {
            const flightTime = elapsed / 1000;
            // Множитель стартует с 0.00 и плавно растет
            mult = Math.max(0, Math.pow(1.10, flightTime) - 1);
            el.mult.innerText = mult.toFixed(2) + "x";
            if (betQueued && !isCashedOut) {
                el.btn.innerText = `Забрать ${(betVal * (1 + mult)).toFixed(1)}`;
                el.btn.classList.add('is-live-cashout');
            }
        }
    }

    async function onAction() {
        if (state === 'wait' && !betQueued) {
            const amount = Number(document.getElementById('input-bet').value);
            if (!amount || amount <= 0) return;

            el.btn.disabled = true;
            el.btn.innerText = "...";

            let ok = false;
            if (selectedGift) {
                ok = await removeUserGift(selectedGift.index);
                if (ok && selectedGift.price_stars > amount) {
                    const diff = selectedGift.price_stars - amount;
                    await adjustBalance(diff);
                }
            } else {
                ok = await adjustBalance(-amount);
            }

            if (!ok) {
                el.btn.disabled = false;
                el.btn.innerText = "Сделать ставку";
                alert('Недостаточно средств или подарка');
                return;
            }

            betVal = amount;
            betQueued = true;
            el.btn.disabled = false;
            el.btn.classList.add('is-bet-placed');
            el.btn.innerHTML = `Ставка принята (${betVal})`;

            el.betWrap.classList.add('locked');
            el.quickBets.classList.add('locked');

            await SB.from('crash_bets').insert({
                user_id: currentUser.user_id,
                username: currentUser.username,
                amount: betVal,
                currency: cur,
                round_id: currentRoundId,
                cashed_out: false
            });

            tg.HapticFeedback?.impactOccurred('medium');
        } else if (state === 'fly' && betQueued && !isCashedOut) {
            isCashedOut = true;
            betQueued = false;
            const currentMultiplier = 1 + mult;
            const win = betVal * currentMultiplier;

            el.btn.classList.remove('is-live-cashout');
            el.btn.innerText = "Взято!";
            el.btn.disabled = true;
            tg.HapticFeedback?.notificationOccurred('success');

            await adjustBalance(win);

            await SB.from('crash_bets')
                .update({ cashed_out: true, multiplier: Number(currentMultiplier.toFixed(2)), profit: Number(win.toFixed(2)) })
                .eq('user_id', currentUser.user_id)
                .eq('round_id', currentRoundId);
        }
    }

    function initRealtimeBets() {
        if (realtimeChannel) SB.removeChannel(realtimeChannel);

        realtimeChannel = SB.channel('public:crash_bets')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'crash_bets' }, payload => {
                fetchActiveBets();
            })
            .subscribe();
        fetchActiveBets();
    }

    async function fetchActiveBets() {
        const { data } = await SB.from('crash_bets').select('*').eq('round_id', currentRoundId);
        if (data) {
            el.playersList.innerHTML = '';
            data.forEach(b => {
                const pill = document.createElement('div');
                pill.className = `player-bet-pill ${b.cashed_out ? 'cashed' : ''}`;
                pill.innerHTML = `<span>${b.username}</span><span>${b.cashed_out ? b.multiplier + 'x' : b.amount + ' ⭐️'}</span>`;
                el.playersList.appendChild(pill);
            });
        }
    }

    function clearOldRoundBets() {
        el.playersList.innerHTML = '';
    }

    // --- Интеграция с инвентарем из колонки inventory (текст / JSON) ---
    async function openInventoryModal() {
        if (state !== 'wait' || betQueued) return;
        const modal = document.getElementById('inventory-modal');
        const listContainer = document.getElementById('inventory-list');
        listContainer.innerHTML = 'Загрузка...';
        modal.classList.add('show');

        try {
            const { data } = await SB.from('users').select('inventory').eq('id', currentUser.user_id).single();
            listContainer.innerHTML = '';
            
            if (!data || !data.inventory) {
                listContainer.innerHTML = '<div class="col-span-3 text-center text-xs text-gray-400 py-4">Инвентарь пуст</div>';
                return;
            }

            // Парсим содержимое инвентаря (поддерживает массив или JSON-строку)
            let items = [];
            try {
                items = typeof data.inventory === 'string' ? JSON.parse(data.inventory) : data.inventory;
            } catch(err) {
                items = data.inventory.split(',').map(i => ({ name: i.trim(), price_stars: 100 }));
            }

            if (!Array.isArray(items) || items.length === 0) {
                listContainer.innerHTML = '<div class="col-span-3 text-center text-xs text-gray-400 py-4">Нет подарков</div>';
                return;
            }

            items.forEach((item, index) => {
                const itemName = item.name || item.title || `Подарок #${index + 1}`;
                const itemPrice = Number(item.price_stars || item.price || 50);
                const itemImg = item.image_url || item.img || 'img/star.png';

                const elDiv = document.createElement('div');
                elDiv.className = 'inv-item';
                elDiv.innerHTML = `
                    <img src="${itemImg}" alt="" onerror="this.src='img/star.png'">
                    <span>${itemName}</span>
                    <span class="text-xs text-yellow-400 font-bold">${itemPrice} ⭐️</span>
                `;
                elDiv.onclick = () => {
                    selectedGift = { index: index, price_stars: itemPrice };
                    document.getElementById('input-bet').value = itemPrice;
                    closeInventoryModal();
                    tg.HapticFeedback?.selectionChanged();
                };
                listContainer.appendChild(elDiv);
            });
        } catch(e) {
            listContainer.innerHTML = '<div class="col-span-3 text-center text-xs text-red-400">Ошибка загрузки</div>';
        }
    }

    function closeInventoryModal() {
        document.getElementById('inventory-modal').classList.remove('show');
    }

    async function removeUserGift(itemIndex) {
        try {
            const { data } = await SB.from('users').select('inventory').eq('id', currentUser.user_id).single();
            if (!data || !data.inventory) return false;
            
            let items = typeof data.inventory === 'string' ? JSON.parse(data.inventory) : data.inventory;
            items.splice(itemIndex, 1);

            await SB.from('users').update({ inventory: JSON.stringify(items) }).eq('id', currentUser.user_id);
            return true;
        } catch(e) { return false; }
    }

    async function fetchHistory() {
        const { data } = await SB.from('crash_history').select('multiplier').order('created_at', { ascending: false }).limit(5);
        if (data) {
            const container = document.getElementById('live-drop');
            container.innerHTML = '';
            data.forEach(item => {
                const item_el = document.createElement('div');
                item_el.className = 'drop-item num';
                item_el.style.color = item.multiplier > 1.5 ? 'var(--success)' : 'var(--danger)';
                item_el.innerText = item.multiplier + 'x';
                container.appendChild(item_el);
            });
        }
    }

    function switchMode(m) {
        if (state === 'wait' && !betQueued) {
            cur = m;
            selectedGift = null;
            document.querySelectorAll('.currency-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('mode-' + m).classList.add('active');
        }
    }

    function setBet(v) { if (state === 'wait' && !betQueued) { selectedGift = null; document.getElementById('input-bet').value = v; } }
    function stepBet(dir) { if (state === 'wait' && !betQueued) { selectedGift = null; const i = document.getElementById('input-bet'); i.value = Math.max(1, Number(i.value || 0) + dir); } }
    function doubleBet() { if (state === 'wait' && !betQueued) { selectedGift = null; const i = document.getElementById('input-bet'); i.value = Math.max(1, Number(i.value || 0) * 2); } }
    function halveBet() { if (state === 'wait' && !betQueued) { selectedGift = null; const i = document.getElementById('input-bet'); i.value = Math.max(1, Math.floor(Number(i.value || 0) / 2)); } }

    checkAuth();
    startWaitPhase();
    setInterval(tick, 100);
</script>
</body>
</html>
