<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PandaGift - Crash Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

:root{
  --bg:#07173f; --blue:#2f6bff; --blue-light:#8fc2ff; --soft:#cfe0ff;
  --gold:#ffd24a; --danger:#ff5a5a; --success:#43d9a3; --muted:#8d9bc4;
  --panel:#0f2354; --line:rgba(255,255,255,.1);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:#fff;font-family:'Montserrat',sans-serif}
body{min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#112a6e 0%,#0b1d52 100%)}
.num{font-variant-numeric:tabular-nums}

/* header */
header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + var(--safe-top)) 14px 10px;background:rgba(7,18,55,.75);border-bottom:1px solid var(--line);z-index:50}
.left{display:flex;align-items:center;gap:10px;min-width:0}
.back-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);cursor:pointer;flex:0 0 auto}
.back-btn:active{transform:scale(.92)}
.brand{font-weight:900;font-style:italic;letter-spacing:-.03em;font-size:1.15rem;text-transform:uppercase}
.brand span{color:var(--blue-light)}
.tag{margin-left:6px;font-size:.6rem;font-weight:900;letter-spacing:.08em;padding:2px 7px;border-radius:6px;background:var(--blue);color:#fff;vertical-align:2px}
.ic-inline{width:14px;height:14px;object-fit:contain;vertical-align:-2px}
.gift-btn svg{width:14px;height:14px;flex-shrink:0}
.balances{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-weight:800;font-size:.82rem}
.pill img{width:16px;height:16px;object-fit:contain}

/* history */
.history{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;background:rgba(7,18,55,.4);border-bottom:1px solid var(--line);min-height:38px}
.history::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.chip.hi{color:var(--success);border-color:rgba(67,217,163,.35)}
.chip.lo{color:var(--danger);border-color:rgba(255,90,90,.3)}
.chip.top{color:var(--gold);border-color:rgba(255,210,74,.4)}

/* scene */
.scene{position:relative;height:clamp(240px,38dvh,380px);overflow:hidden;
  background:
   radial-gradient(ellipse at 50% 110%,rgba(47,107,255,.35),transparent 60%),
   linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
   linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:auto,40px 40px,40px 40px}
.scene.moving{animation:grid 2.4s linear infinite}
@keyframes grid{to{background-position:0 0,-80px 80px,-80px 80px}}
#trail{position:absolute;inset:0;width:100%;height:100%;z-index:3}
.status{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:20;white-space:nowrap;
  font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);
  background:rgba(7,23,63,.8);border:1px solid rgba(255,255,255,.15);padding:5px 14px;border-radius:999px;backdrop-filter:blur(6px)}
.status.live{color:var(--success);border-color:rgba(67,217,163,.4)}
.status.crash{color:var(--danger);border-color:rgba(255,90,90,.4)}
.status.err{color:var(--danger)}
#multiplier{position:absolute;left:50%;top:24%;transform:translate(-50%,-50%);z-index:20;pointer-events:none;
  font-size:clamp(2rem,10vw,3.1rem);font-weight:900;letter-spacing:-.02em;text-shadow:0 0 26px rgba(47,107,255,.6)}
#multiplier.idle{color:rgba(255,255,255,.35);text-shadow:none}
#multiplier.crashed{color:var(--danger);text-shadow:0 0 34px rgba(255,90,90,.55)}
/* ракета: скрыта, пока не закончилось окно ставок; появляется только в полёте */
#rocket{position:absolute;z-index:10;width:104px;height:104px;pointer-events:none;left:0;top:0;opacity:0;transition:opacity .12s;will-change:transform}
#rocket.on{opacity:1}
#rocket.hidden{opacity:0}
#fallback-rocket{display:none;width:100%;height:100%;align-items:center;justify-content:center;font-size:60px;transform:rotate(-45deg)}
#boom{position:absolute;z-index:11;font-size:72px;pointer-events:none;display:none;animation:boom .5s ease-out}
@keyframes boom{from{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}to{transform:scale(1);opacity:.9}}

/* bets feed */
.bets{background:#1b2132;border-top:1px solid var(--line);padding:14px 12px calc(24px + var(--safe-bottom));min-height:45dvh}
.bets-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--muted);padding:0 6px 6px}
#bets-list{display:flex;flex-direction:column;gap:6px}
.bets-empty{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:4px 0 6px}
.brow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:rgba(255,255,255,.045);animation:slideUp .38s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slideUp{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.brow.me{box-shadow:inset 0 0 0 1px var(--blue-light)}
.brow.lost{opacity:.5}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:0 0 auto;color:#fff}
.mid{flex:1;min-width:0}
.nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.am{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--gold)}
.am img{width:13px;height:13px;object-fit:contain}
.am i{font-style:normal;font-weight:800;color:var(--muted)}
.am i.live{color:#fff}.am i.win{color:var(--success)}.am i.lose{color:var(--danger)}
.prize{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end}
.prize img.coin{width:30px;height:30px;object-fit:contain}
.gcard{display:flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:11px;max-width:120px;
  background:linear-gradient(135deg,rgba(255,210,74,.2),rgba(47,107,255,.25));border:1px solid rgba(255,210,74,.5)}
.gcard img{width:32px;height:32px;border-radius:8px;object-fit:cover;background:rgba(7,23,63,.6);flex:0 0 auto}
.gcard span{font-size:10px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* panel */
.panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(10px + var(--safe-bottom));display:flex;flex-direction:column;gap:8px;z-index:60}
.modes{display:flex;gap:8px}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.05);border:1px solid var(--line);cursor:pointer;transition:.15s}
.mode img{width:14px;height:14px}
.mode.active{background:var(--blue);color:#fff;border-color:var(--blue-light);box-shadow:0 0 12px rgba(47,107,255,.4)}
.row{display:flex;gap:8px;align-items:stretch}
.field{flex:1;background:rgba(7,23,63,.7);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.field label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:1px}
.field input{background:transparent;border:0;outline:0;color:var(--blue-light);font:900 1.1rem 'Montserrat',sans-serif;width:100%;padding:0}
.field.auto{flex:0 0 32%}
.field.auto input{color:var(--gold)}
.locked{opacity:.45;pointer-events:none}
.gift-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);font-size:11px;font-weight:800;color:var(--soft);cursor:pointer;max-width:38%}
.gift-btn.sel{border-color:var(--gold);color:var(--gold)}
.gift-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:flex;gap:6px}
.quick div{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:11px;font-weight:700;color:var(--soft);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);cursor:pointer}
.quick div:active{background:rgba(255,255,255,.18)}
.btn-main{width:100%;padding:14px 0;border:0;border-radius:14px;background:var(--blue);color:#fff;font:900 1rem 'Montserrat',sans-serif;text-transform:uppercase;box-shadow:0 6px 18px rgba(47,107,255,.4);cursor:pointer;transition:transform .1s}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{filter:grayscale(.6);opacity:.45;box-shadow:none;cursor:default}
.btn-main.cash{background:var(--success);color:#07173f;box-shadow:0 6px 18px rgba(67,217,163,.45)}
.btn-main.placed{background:#223875;color:var(--blue-light);border:1px solid rgba(47,107,255,.5);box-shadow:none}

/* modal / toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#112557;border:1px solid rgba(255,255,255,.15);border-radius:20px;width:100%;max-width:380px;max-height:78vh;display:flex;flex-direction:column;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px}
.modal-head button{background:none;border:0;color:var(--muted);font:700 12px 'Montserrat',sans-serif;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;padding:4px;margin-top:12px}
.inv .p img {
  width: 12px;
  height: 12px;
  vertical-align: -1px;
}
.inv{background:rgba(7,23,63,.6);border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer}
.inv:active{transform:scale(.96)}
.inv.off{opacity:.4;pointer-events:none}
.inv img{width:52px;height:52px;object-fit:contain;border-radius:10px}
.inv .n{font-size:10px;font-weight:700;color:var(--soft);line-height:1.15;word-break:break-word}
.inv .p{font-size:11px;font-weight:800;color:var(--gold)}
.empty{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);padding:18px 0}
#toast{position:fixed;left:50%;top:calc(70px + var(--safe-top));transform:translate(-50%,-20px);z-index:2000;opacity:0;pointer-events:none;
  background:#0b1d52;border:1px solid var(--blue-light);padding:10px 18px;border-radius:12px;font-weight:800;font-size:13px;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.win{border-color:var(--success);color:var(--success)}
#toast.lose{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>

<header>
  <div class="left">
    <div class="back-btn" onclick="location.href='index.html'">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    </div>
    <div class="brand">Panda<span>Gift</span><span class="tag">CRASH</span></div>
  </div>
  <div class="balances">
    <div class="pill"><span id="val-stars" class="num">0</span><img src="img/star.png" alt=""></div>
    <div class="pill"><span id="val-ton" class="num">0.00</span><img src="img/ton.png" alt=""></div>
  </div>
</header>

<div id="history" class="history"></div>

<div id="scene" class="scene">
  <canvas id="trail"></canvas>
  <div id="status" class="status">Подключение…</div>
  <div id="multiplier" class="num idle">1.00x</div>
  <div id="rocket">
    <div id="lottie" style="width:100%;height:100%"></div>
    <div id="fallback-rocket">🚀</div>
  </div>
  <div id="boom">💥</div>
</div>

<div class="panel">
  <div class="modes">
    <div id="mode-stars" class="mode active" onclick="switchMode('stars')"><img src="img/star.png" alt=""> STARS</div>
    <div id="mode-ton" class="mode" onclick="switchMode('ton')"><img src="img/ton.png" alt=""> TON</div>
  </div>
  <div class="row">
    <div class="field" id="bet-wrap">
      <label>Ставка</label>
      <input type="number" id="input-bet" class="num" value="10" min="0" step="any" inputmode="decimal">
    </div>
    <div class="field auto" id="auto-wrap">
      <label>Авто-вывод</label>
      <input type="number" id="input-auto" class="num" placeholder="—" min="1.01" step="0.1" inputmode="decimal">
    </div>
    <div class="gift-btn" id="gift-btn" onclick="openInventory()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg><span id="gift-label">Подарок</span></div>
  </div>
  <div class="quick" id="quick"></div>
  <button id="btn-main" class="btn-main" onclick="onAction()" disabled>Подключение…</button>
</div>

<section class="bets">
  <div class="bets-head"><span>Ставки раунда</span><span>Возможн. приз</span></div>
  <div id="bets-list"></div>
  <div id="bets-empty" class="bets-empty">Ставок пока нет — будь первым</div>
</section>

<div id="inv-modal" class="overlay" onclick="if(event.target===this)closeInventory()">
  <div class="modal">
    <div class="modal-head"><span>Выберите подарок для ставки</span><button onclick="closeInventory()">Закрыть</button></div>
    <div id="inv-grid" class="grid"></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ================= КОНФИГ ================= */
// Если API лежит на другом домене, чем эта страница — впиши его: 'https://xxx.vercel.app'
const API_BASE = '';

const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); } catch(e){}

const BET_WINDOW = 5000;       // 5 секунд между полётами (должно совпадать с crash.py)
const GROWTH = 0.25;           // должно совпадать с crash.py

const tgUser = tg.initDataUnsafe?.user;
const UID = tgUser ? String(tgUser.id) : '12345';
const UNAME = tgUser ? (tgUser.first_name || tgUser.username || 'Игрок') : 'Тестовый игрок';

/* ================= СОСТОЯНИЕ ================= */
let S = null;                    // последний ответ /crash/state
let offset = 0;                  // серверное время - локальное
let myBet = null;
let busy = false;
let apiDown = false;
let cur = 'stars';
let selectedGift = null;         // { key, name, price_stars, image_url }
let me = { balance: 0, ton: 0 };
let lastKey = '';
let lastLossRound = null;
let pollTimer = null;
let lastHistory = '';
let lottieAnim = null;

const $ = id => document.getElementById(id);
const el = {
  scene: $('scene'), mult: $('multiplier'), rocket: $('rocket'), boom: $('boom'), status: $('status'),
  btn: $('btn-main'), bet: $('input-bet'), auto: $('input-auto'), betWrap: $('bet-wrap'), autoWrap: $('auto-wrap'),
  quick: $('quick'), history: $('history'), giftBtn: $('gift-btn'), giftLabel: $('gift-label'),
  trail: $('trail'), betsList: $('bets-list'), betsEmpty: $('bets-empty')
};

/* ================= УТИЛИТЫ ================= */
const srvNow = () => Date.now() + offset;
const round2 = n => Math.round(n * 100) / 100;
function setText(node, v){ if (node.textContent !== v) node.textContent = v; }
function haptic(kind, type){ try { tg.HapticFeedback?.[kind]?.(type); } catch(e){} }
const STAR_IMG = '<img class="ic-inline" src="img/star.png" alt="">';
const GIFT_SVG = '<svg class="ic-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>';
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function setHTML(node, v){ if (node._h !== v) { node._h = v; node.innerHTML = v; } }
function toast(msg, kind='', html=false){
  if (/^HTTP \d+|Failed to fetch|NetworkError|Load failed|нет ответа/i.test(msg)) msg = 'Мини-игра временно недоступна, попробуйте позже';
  const t = $('toast'); t.className = kind; if (html) t.innerHTML = msg; else t.textContent = msg; void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function fmtAmt(v, c){ v = Number(v); return c === 'ton' ? v.toFixed(2) : String(+v.toFixed(2)); }

const DEBUG = /[?&]debug=1/.test(location.search);   // страница?debug=1 покажет техническую ошибку
const BASES = API_BASE ? [API_BASE] : ['', '/api', 'https://sdjsdjsd.vercel.app'];
let baseIdx = 0, lastApiError = '';
async function api(path, opts = {}){
  let lastErr = null;
  for (let k = 0; k < BASES.length; k++) {
    const i = (baseIdx + k) % BASES.length;
    const url = BASES[i] + path;
    try {
      const res = await fetch(url, {
        method: opts.method || 'GET',
        headers: { 'Content-Type': 'application/json', 'x-init-data': tg.initData || '' },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
      let data = null; try { data = await res.json(); } catch(e){}
      const notFound = res.status === 404 && !(data && data.detail && data.detail !== 'Not Found');
      if (notFound || (data === null && !res.ok)) { lastErr = new Error('HTTP ' + res.status + ' ' + url); continue; }
      if (!res.ok) {
        let d = data && (data.detail ?? data.error);
        if (d && typeof d !== 'string') d = JSON.stringify(d);
        const err = new Error(d || ('HTTP ' + res.status)); err.server = true; throw err;
      }
      baseIdx = i; return data;
    } catch(e){
      if (e.server) throw e;
      lastErr = e;
    }
  }
  throw lastErr || new Error('нет ответа');
}

/* ================= ФАЗА (по серверным часам) ================= */
function phase(){
  if (!S) return { state: 'load' };
  const n = srvNow();
  if (n < S.fly_start) return { state: 'wait', round: S.round_id, left: S.fly_start - n, mult: 1 };
  if (S.finished && S.crash_point != null) {
    if (n < S.end_at) return { state: 'crash', round: S.round_id, cp: S.crash_point, mult: S.crash_point };
    // раунд закончился — следующий начинается ровно в end_at, окно ставок BET_WINDOW
    const left = S.end_at + BET_WINDOW - n;
    if (left > 0) return { state: 'wait', round: S.round_id + 1, left, mult: 1, predicted: true };
    return { state: 'load' };
  }
  const t = (n - S.fly_start) / 1000;
  return { state: 'fly', round: S.round_id, mult: Math.exp(GROWTH * t) };
}

/* ================= ОПРОС СЕРВЕРА ================= */
async function poll(){
  clearTimeout(pollTimer);
  const t0 = Date.now();
  try {
    const r = await api(`/crash/state?user_id=${encodeURIComponent(UID)}`);
    offset = r.server_time - (t0 + Date.now()) / 2;
    const prev = myBet;
    S = r; apiDown = false;

    let nb = r.my_bet;
    if (!nb && prev && prev.local && prev.round_id === r.round_id && Date.now() - prev.ts < 3500) nb = prev;
    if (!busy && prev && !prev.cashed_out && nb && nb.cashed_out) {      // авто-вывод сработал на сервере
      toast(`Авто-вывод x${nb.multiplier.toFixed(2)}`, 'win'); refreshMe();
    }
    myBet = nb;
    renderBets(r.bets || [], r.round_id);
    renderHistory(r.history || []);
  } catch(e){
    apiDown = true; lastApiError = String(e.message || e).slice(0, 60); console.error('poll:', e);
  }
  const ph = phase();
  let delay = 1000;
  if (ph.state === 'fly') delay = 250;
  else if (ph.state === 'crash') delay = Math.max(150, S.end_at - srvNow() + 60);
  else if (ph.state === 'wait') delay = Math.max(150, Math.min(1500, ph.left + 40));
  if (apiDown) delay = 2000;
  pollTimer = setTimeout(poll, delay);
}

async function refreshMe(){
  try {
    const r = await api(`/crash/me/${encodeURIComponent(UID)}`);
    me.balance = r.balance; me.ton = r.ton_balance;
    paintBalances();
    return r;
  } catch(e){ console.error('me:', e); }
}
function paintBalances(){
  setText($('val-stars'), String(Math.floor(me.balance)));
  setText($('val-ton'), Number(me.ton).toFixed(2));
}

/* ================= ROCKET (crach.tgs) ================= */
async function loadRocket(){
  const fallback = () => { $('lottie').style.display = 'none'; $('fallback-rocket').style.display = 'flex'; };
  try {
    const res = await fetch('crach.tgs');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buf = await res.arrayBuffer();
    const u8 = new Uint8Array(buf);
    let json;
    if (u8[0] === 0x1f && u8[1] === 0x8b) {
      if (window.pako) json = JSON.parse(pako.ungzip(u8, { to: 'string' }));
      else json = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
    } else json = JSON.parse(new TextDecoder().decode(u8));
    lottieAnim = lottie.loadAnimation({ container: $('lottie'), renderer: 'svg', loop: true, autoplay: true, animationData: json });
    lottieAnim.addEventListener('data_failed', fallback);
  } catch(e){ console.error('crach.tgs:', e); fallback(); }
}

/* ================= ТРАЕКТОРИЯ ================= */
const ctx = el.trail.getContext('2d');
let W = 0, H = 0;
function resize(){
  const r = el.scene.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = r.width; H = r.height;
  el.trail.width = W * dpr; el.trail.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
const progressOf = m => 1 - Math.exp(-Math.log(Math.max(1, m)) * 1.05);
const pathPoint = p => ({ x: W * (0.16 + 0.66 * p), y: H * (0.80 - 0.46 * Math.pow(p, 0.8)) });

function drawTrail(m){
  ctx.clearRect(0, 0, W, H);
  if (m <= 1) return;
  const p = progressOf(m), steps = 48, pts = [];
  for (let i = 0; i <= steps; i++) pts.push(pathPoint(p * i / steps));
  const g = ctx.createLinearGradient(0, H, 0, 0);
  g.addColorStop(0, 'rgba(47,107,255,0)'); g.addColorStop(1, 'rgba(47,107,255,.30)');
  ctx.beginPath(); ctx.moveTo(pts[0].x, H); pts.forEach(q => ctx.lineTo(q.x, q.y));
  ctx.lineTo(pts[pts.length - 1].x, H); ctx.closePath(); ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y));
  ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.strokeStyle = '#8fc2ff';
  ctx.shadowColor = 'rgba(47,107,255,.9)'; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
}
function placeRocket(m){
  const q = pathPoint(m > 1 ? progressOf(m) : 0);
  const s = el.rocket.offsetWidth || 104;
  el.rocket.style.transform = `translate(${q.x - s/2}px, ${q.y - s/2}px)`;
  return q;
}

/* ================= ИСТОРИЯ ================= */
function renderHistory(list){
  const key = list.join(',');
  if (key === lastHistory) return;
  lastHistory = key;
  el.history.innerHTML = '';
  list.forEach(v => {
    const c = document.createElement('div');
    c.className = 'chip num ' + (v >= 5 ? 'top' : v >= 2 ? 'hi' : 'lo');
    c.textContent = v.toFixed(2) + 'x';
    el.history.appendChild(c);
  });
}

/* ================= СТАВКИ ИГРОКОВ (лента снизу) ================= */
const rows = new Map();

function gcard(name, img){
  const d = document.createElement('div'); d.className = 'gcard';
  const i = document.createElement('img'); i.src = img || 'img/star.png'; i.onerror = () => { i.onerror = null; i.src = 'img/star.png'; };
  const s = document.createElement('span'); s.textContent = name || 'Подарок';
  d.append(i, s); return d;
}
function coin(src){ const i = document.createElement('img'); i.className = 'coin'; i.src = src; return i; }

// Star — это не подарок, а обычные звёзды: показываем монетку, а не карточку подарка
const isStarName = n => String(n || '').trim().toLowerCase() === 'star';

function paintPrize(r){
  const b = r.b; r.prize.innerHTML = '';
  if (b.payout_gift_name && !isStarName(b.payout_gift_name)) r.prize.appendChild(gcard(b.payout_gift_name, b.payout_gift_image));
  else if (b.currency === 'gift' && !isStarName(b.gift_name)) r.prize.appendChild(gcard(b.gift_name, b.gift_image));
  else r.prize.appendChild(coin(b.currency === 'ton' ? 'img/ton.png' : 'img/star.png'));
}
function makeRow(b){
  const d = document.createElement('div'); d.className = 'brow';
  const name = b.username || '?';
  const av = document.createElement('div'); av.className = 'av';
  av.textContent = (name.trim().charAt(0) || '?').toUpperCase();
  const hue = [...name].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  av.style.background = `linear-gradient(135deg,hsl(${hue} 80% 62%),hsl(${(hue + 50) % 360} 75% 52%))`;
  const mid = document.createElement('div'); mid.className = 'mid';
  const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = name;
  const am = document.createElement('div'); am.className = 'am';
  const ico = document.createElement('img'); ico.src = b.currency === 'ton' ? 'img/ton.png' : 'img/star.png';
  const amt = document.createElement('b'); amt.className = 'num'; amt.textContent = fmtAmt(b.amount, b.currency);
  const bm = document.createElement('i'); bm.className = 'num live'; bm.textContent = 'x1.00';
  am.append(ico, amt, bm); mid.append(nm, am);
  const prize = document.createElement('div'); prize.className = 'prize';
  d.append(av, mid, prize);
  const r = { el: d, bm, prize, b, prizeKey: '' };
  return r;
}
function renderBets(list){
  const ids = new Set(list.map(b => b.id));
  rows.forEach((r, id) => { if (!ids.has(id)) { r.el.remove(); rows.delete(id); } });
  [...list].reverse().forEach(b => {
    let r = rows.get(b.id);
    if (!r) { r = makeRow(b); rows.set(b.id, r); el.betsList.prepend(r.el); }
    r.b = b;
    r.el.classList.toggle('me', !!b.mine);
    const pk = (b.payout_gift_name || '') + '|' + (b.payout_gift_image || '') + '|' + (b.gift_image || '') + '|' + b.currency;
    if (r.prizeKey !== pk) { r.prizeKey = pk; paintPrize(r); }
  });
  el.betsEmpty.style.display = rows.size ? 'none' : 'block';
}
function tickRows(st){
  const finished = (S && S.finished) || (S && st.round !== S.round_id);
  rows.forEach(r => {
    const b = r.b; let txt, cls, lost = false;
    if (b.cashed_out) { txt = 'x' + Number(b.multiplier).toFixed(2); cls = 'win'; }
    else if (st.state === 'fly' && !finished) { txt = 'x' + st.mult.toFixed(2); cls = 'live'; }
    else if (st.state === 'crash' || finished) { txt = 'x0.00'; cls = 'lose'; lost = true; }
    else { txt = 'x1.00'; cls = 'live'; }
    setText(r.bm, txt);
    if (r.bm.className !== 'num ' + cls) r.bm.className = 'num ' + cls;
    r.el.classList.toggle('lost', lost);
  });
}

/* ================= РЕЖИМЫ / СТАВКА ================= */
function hasBetNow(st){ return !!myBet && myBet.round_id === st.round; }
function canEdit(){ const st = phase(); return st.state === 'wait' && !hasBetNow(st) && !busy; }

function renderQuick(){
  const vals = cur === 'ton' ? [0.1, 0.5, 1, 5] : [10, 50, 100, 500];
  el.quick.innerHTML = '';
  vals.forEach(v => { const d = document.createElement('div'); d.textContent = v; d.onclick = () => setBet(v); el.quick.appendChild(d); });
  [['½', halveBet], ['2×', doubleBet], ['MAX', maxBet]].forEach(([t, f]) => {
    const d = document.createElement('div'); d.textContent = t; d.onclick = f; el.quick.appendChild(d);
  });
}
function refreshMode(){
  $('mode-stars').classList.toggle('active', cur === 'stars');
  $('mode-ton').classList.toggle('active', cur === 'ton');
  renderQuick();
}
function refreshGiftUI(){
  el.giftBtn.classList.toggle('sel', !!selectedGift);
  setText(el.giftLabel, selectedGift ? selectedGift.name : 'Подарок');
  el.bet.readOnly = !!selectedGift;
}
function clearGift(){ selectedGift = null; refreshGiftUI(); }
function switchMode(m){ if (!canEdit()) return; cur = m; clearGift(); el.bet.value = m === 'ton' ? 0.5 : 10; refreshMode(); }
function setBet(v){ if (!canEdit()) return; clearGift(); el.bet.value = v; }
function doubleBet(){ if (!canEdit()) return; clearGift(); el.bet.value = round2(Number(el.bet.value || 0) * 2) || 1; }
function halveBet(){ if (!canEdit()) return; clearGift(); el.bet.value = Math.max(cur === 'ton' ? 0.01 : 1, round2(Number(el.bet.value || 0) / 2)); }
function maxBet(){ if (!canEdit()) return; clearGift(); el.bet.value = cur === 'ton' ? Number(me.ton).toFixed(2) : Math.floor(me.balance); }

/* ================= ПОДАРКИ ================= */
async function openInventory(){
  if (!canEdit()) return toast('Подарок можно выбрать в окне ставок');
  const grid = $('inv-grid');
  grid.innerHTML = '<div class="empty">Загрузка…</div>';
  $('inv-modal').classList.add('show');
  try {
    const r = await api(`/crash/me/${encodeURIComponent(UID)}`);
    me.balance = r.balance; me.ton = r.ton_balance; paintBalances();
    grid.innerHTML = '';
    // Star — это просто звёзды, в выборе подарков для ставки их не показываем
    const gifts = (r.gifts || []).filter(g => !isStarName(g.name));
    if (!gifts.length) { grid.innerHTML = '<div class="empty">В инвентаре пока нет подарков</div>'; return; }
    gifts.forEach(g => {
      const d = document.createElement('div');
      d.className = 'inv' + (g.price_stars > 0 ? '' : ' off');
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = g.image_url || 'img/star.png';
      img.onerror = () => { img.onerror = null; img.src = 'img/star.png'; };
      const n = document.createElement('div'); n.className = 'n'; n.textContent = g.name;
      const p = document.createElement('div'); p.className = 'p'; if (g.price_stars > 0) p.innerHTML = g.price_stars + ' ' + STAR_IMG; else p.textContent = 'нет цены';
      d.append(img, n, p);
      d.onclick = () => {
        selectedGift = g; cur = 'stars'; refreshMode();
        el.bet.value = g.price_stars; refreshGiftUI();
        closeInventory(); haptic('selectionChanged');
      };
      grid.appendChild(d);
    });
  } catch(e){
    grid.innerHTML = '';
    const d = document.createElement('div'); d.className = 'empty'; d.style.color = 'var(--danger)';
    d.textContent = 'Ошибка: ' + e.message; grid.appendChild(d);
  }
}
function closeInventory(){ $('inv-modal').classList.remove('show'); }

/* ================= ДЕЙСТВИЯ ================= */
async function onAction(){
  if (busy) return;
  const st = phase();
  if (st.state === 'wait' && !hasBetNow(st)) return placeBet(st);
  if (st.state === 'fly' && hasBetNow(st) && !myBet.cashed_out) return doCashout();
}

async function placeBet(st){
  if (st.left < 500) return toast('Раунд вот-вот стартует');
  const amount = Number(el.bet.value);
  if (!selectedGift && (!amount || amount <= 0)) return toast('Введите ставку', 'lose');
  busy = true; el.btn.disabled = true; setText(el.btn, '…');
  const auto = Number(el.auto.value);
  try {
    const r = await api('/crash/bet', { method: 'POST', body: {
      user_id: UID, username: UNAME,
      currency: selectedGift ? 'gift' : cur, amount,
      gift_key: selectedGift ? selectedGift.key : null,
      auto_cashout: auto >= 1.01 ? auto : null
    }});
    me.balance = r.balance; me.ton = r.ton_balance; paintBalances();
    myBet = { round_id: r.round_id, currency: r.currency, amount: r.amount, cashed_out: false, local: true, ts: Date.now() };
    haptic('impactOccurred', 'medium');
  } catch(e){
    toast(e.message, 'lose');
  }
  busy = false;
  poll();
}

async function doCashout(){
  busy = true; el.btn.disabled = true; setText(el.btn, '…');
  try {
    const r = await api('/crash/cashout', { method: 'POST', body: { user_id: UID } });
    myBet = { ...myBet, cashed_out: true, multiplier: r.multiplier };
    me.balance = r.balance; me.ton = r.ton_balance; paintBalances();
    haptic('notificationOccurred', 'success');
    if (r.gift) toast(`${GIFT_SVG} ${esc(r.gift.name)}` + (r.stars > 0 ? ` + ${fmtAmt(r.stars, 'stars')} ${STAR_IMG}` : '') + ` (x${r.multiplier.toFixed(2)})`, 'win', true);
    else toast(`+${fmtAmt(r.value, r.currency)} ${r.currency === 'ton' ? 'TON' : STAR_IMG} (x${r.multiplier.toFixed(2)})`, 'win', true);
  } catch(e){
    toast(e.message, 'lose');
  }
  busy = false;
  poll();
}

/* ================= ГЛАВНЫЙ ЦИКЛ ================= */
function onPhaseChange(st){
  if (st.state === 'wait') {
    el.boom.style.display = 'none';
    el.rocket.classList.remove('hidden', 'on');
    clearGift();
    refreshMe();
  }
  if (st.state === 'fly') el.boom.style.display = 'none';
  if (st.state === 'crash') {
    const q = placeRocket(st.mult);
    el.boom.style.left = (q.x - 36) + 'px'; el.boom.style.top = (q.y - 44) + 'px';
    el.boom.style.display = 'block'; el.boom.style.animation = 'none'; void el.boom.offsetWidth; el.boom.style.animation = '';
    haptic('notificationOccurred', 'error');
    if (myBet && myBet.round_id === st.round && !myBet.cashed_out && lastLossRound !== st.round) {
      lastLossRound = st.round;
      toast(`Крах на ${st.cp.toFixed(2)}x — ставка проиграна`, 'lose');
    }
    refreshMe();
  }
}

function frame(){
  const st = phase();
  const key = st.state + ':' + (st.round ?? '');
  if (key !== lastKey) { lastKey = key; if (st.state !== 'load') onPhaseChange(st); }

  const bet = hasBetNow(st);
  const lock = st.state !== 'wait' || bet || busy;
  el.betWrap.classList.toggle('locked', lock);
  el.autoWrap.classList.toggle('locked', lock);
  el.quick.classList.toggle('locked', lock);
  el.giftBtn.classList.toggle('locked', lock);
  el.scene.classList.toggle('moving', st.state === 'fly');
  el.status.classList.toggle('live', st.state === 'fly');
  el.status.classList.toggle('crash', st.state === 'crash');
  el.status.classList.toggle('err', apiDown);

  if (st.state === 'load') {
    setText(el.status, apiDown ? (DEBUG ? ('Ошибка: ' + lastApiError) : 'Мини-игра временно недоступна') : 'Подключение…');
    el.mult.className = 'num idle'; setText(el.mult, '1.00x');
    el.rocket.classList.remove('on'); drawTrail(1); placeRocket(1);
    if (!busy) { setText(el.btn, apiDown ? 'Недоступно, попробуйте позже' : 'Подключение…'); el.btn.className = 'btn-main'; el.btn.disabled = true; }
  }
  else if (st.state === 'wait') {
    setText(el.status, `Взлёт через ${Math.max(0, Math.ceil(st.left / 1000))}с`);
    setText(el.mult, '1.00x'); el.mult.className = 'num idle';
    el.rocket.classList.remove('on'); drawTrail(1); placeRocket(1);   // ракеты не видно, пока идёт окно ставок
    if (!busy) {
      if (bet) { setText(el.btn, `Ставка принята · ${fmtAmt(myBet.amount, myBet.currency)}`); el.btn.className = 'btn-main placed'; el.btn.disabled = true; }
      else { setText(el.btn, 'Сделать ставку'); el.btn.className = 'btn-main'; el.btn.disabled = st.left < 500; }
    }
  }
  else if (st.state === 'fly') {
    setText(el.status, 'В полёте');
    setText(el.mult, st.mult.toFixed(2) + 'x'); el.mult.className = 'num';
    el.rocket.classList.add('on'); drawTrail(st.mult); placeRocket(st.mult);   // ракета появляется только когда таймер ставок прошёл
    if (!busy) {
      if (bet && !myBet.cashed_out) {
        const v = myBet.amount * st.mult;
        setHTML(el.btn, 'Забрать ' + (myBet.currency === 'ton' ? v.toFixed(2) + ' TON' : Math.floor(v) + ' ' + STAR_IMG));
        el.btn.className = 'btn-main cash'; el.btn.disabled = false;
      } else if (bet && myBet.cashed_out) {
        setText(el.btn, 'Взято!'); el.btn.className = 'btn-main'; el.btn.disabled = true;
      } else {
        setText(el.btn, 'Ждите следующий раунд'); el.btn.className = 'btn-main'; el.btn.disabled = true;
      }
    }
  }
  else { // crash
    setText(el.status, 'Крах');
    setText(el.mult, st.cp.toFixed(2) + 'x'); el.mult.className = 'num crashed';
    el.rocket.classList.add('hidden'); drawTrail(st.cp);
    if (!busy) {
      const won = bet && myBet.cashed_out;
      setText(el.btn, won ? 'Взято!' : 'Крах!'); el.btn.className = 'btn-main'; el.btn.disabled = true;
    }
  }
  tickRows(st);
  requestAnimationFrame(frame);
}

/* ================= СТАРТ ================= */
el.status.addEventListener('click', () => { if (apiDown) alert('Диагностика: ' + lastApiError + '\nСтраница: ' + location.origin); });
refreshMode(); refreshGiftUI(); resize();
loadRocket();
refreshMe();
poll();
requestAnimationFrame(frame);
</script>
