<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarsDrop - Daily Bonus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #22c55e; }
        
        * { -webkit-tap-highlight-color: transparent; user-select: none; }
        
        body { 
            background: #050505; color: white; font-family: 'Inter', sans-serif; 
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; 
        }

        .header-panel { 
            padding: 12px 20px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; 
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }

        .bonus-container {
            flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
        }

        .gift-box {
            font-size: 80px; filter: drop-shadow(0 0 20px rgba(34, 197, 94, 0.2));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .btn-main { 
            background: var(--accent); color: white; font-weight: 900; border-radius: 18px; 
            transition: 0.2s; box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { opacity: 0.2; filter: grayscale(1); box-shadow: none; }

        #win-modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); align-items: center; justify-content: center; }
        .modal-box { background: #0f0f0f; border: 1px solid var(--accent); border-radius: 24px; width: 85%; padding: 25px; text-align: center; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="flex items-center justify-center w-8 h-8 rounded-xl bg-[#111] border border-[#222] active:scale-90 transition-transform">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">STARS<span class="text-[#22c55e]">DROP</span></div>
        </div>
        <div class="flex items-center gap-2 bg-[#111] px-4 py-1.5 rounded-full border border-[#222]">
            <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <div class="bonus-container">
        <div class="gift-box" id="gift-icon">🎁</div>
        <h1 class="text-xs uppercase font-black tracking-widest text-gray-500">До следующего бонуса</h1>
        <div id="countdown-timer" class="text-3xl font-black italic tracking-tight text-white bg-[#0a0a0a] px-6 py-2 rounded-2xl border border-[#151515]">
            --:--:--
        </div>
        <p class="text-[11px] text-center text-gray-400 max-w-[240px] px-4 mt-2">
            Заходи каждые 24 часа и забирай случайный призовой дроп от <span class="text-green-400 font-bold">0.05</span> до <span class="text-green-400 font-bold">0.50</span> ★
        </p>
    </div>

    <div class="p-6 bg-[#0a0a0a] border-t border-[#181818] pb-[calc(24px + var(--tg-safe-area-inset-bottom, 0px))]">
        <button id="bonus-btn" onclick="claimDailyBonus()" class="w-full py-4 btn-main uppercase tracking-widest text-sm" disabled>Загрузка данных...</button>
    </div>

    <div id="win-modal">
        <div class="modal-box">
            <h2 class="text-lg font-black italic uppercase text-green-400 tracking-tight">Бонус получен!</h2>
            <div class="bg-white/5 py-4 rounded-xl border border-white/5 my-5 flex flex-col items-center justify-center">
                <img src="img/star.png" class="w-12 h-12 mb-2" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
                <p id="bonus-gain-text" class="text-2xl font-black text-green-400">+0.00 ★</p>
            </div>
            <button onclick="confirmAndReload()" class="w-full bg-[#22c55e] py-4 rounded-xl font-black uppercase text-xs tracking-wider text-black">Отлично</button>
        </div>
    </div>

    <script>
        const SB_URL = "https://xbklrdpguqsuvqndcujb.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhia2xyZHBndXFzdXZxbmRjdWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ0NzUsImV4cCI6MjEwNzIxMDQ3NX0.IeK3NGOTu_J1jDOd_XjHQUOySnkbFh4uThGCPeu-Wu4";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;
        
        tg.expand();
        tg.enableClosingConfirmation();

        let user = null;
        let generatedBonus = 0;

        function goHome() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'index.html';
        }

        async function checkAuth() {
            let userId = tg.initDataUnsafe?.user?.id || 8015661230;

            try {
                let { data, error } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (error) throw error;
                
                if (!data) {
                    const { data: newUser, error: insError } = await SB.from('users').insert([
                        { id: userId, balance: 5, username: tg.initDataUnsafe?.user?.username || "Player" }
                    ]).select().single();
                    
                    if (insError) throw insError;
                    data = newUser;
                }

                user = data;
                document.getElementById('val-stars').innerText = Number(user.balance || 0).toFixed(2);
                initBonusTimer();
            } catch (e) {
                console.error("Ошибка авторизации:", e);
                document.getElementById('bonus-btn').innerText = "ОШИБКА СЕТИ";
            }
        }

        function initBonusTimer() {
            const btn = document.getElementById('bonus-btn');
            const timerEl = document.getElementById('countdown-timer');
            const giftEl = document.getElementById('gift-icon');
            
            const lastBonus = user && user.hasOwnProperty('last_bonus_claim') && user.last_bonus_claim ? new Date(user.last_bonus_claim).getTime() : 0;
            
            const updateTimer = () => {
                const now = Date.now();
                const remaining = 86400000 - (now - lastBonus);

                if (remaining <= 0) {
                    timerEl.innerText = "ГОТОВ";
                    timerEl.className = "text-3xl font-black italic tracking-tight text-green-400 bg-[#0a0a0a] px-6 py-2 rounded-2xl border border-green-500/30 shadow-[0_0_15px_rgba(34,197,94,0.15)]";
                    btn.innerText = "ЗАБРАТЬ ПРИЗ";
                    btn.disabled = false;
                    giftEl.innerText = "🎁";
                } else {
                    timerEl.className = "text-3xl font-black italic tracking-tight text-white bg-[#0a0a0a] px-6 py-2 rounded-2xl border border-[#151515]";
                    btn.disabled = true;
                    giftEl.innerText = "🔒";

                    const hours = Math.floor(remaining / 3600000).toString().padStart(2, '0');
                    const minutes = Math.floor((remaining % 3600000) / 60000).toString().padStart(2, '0');
                    const seconds = Math.floor((remaining % 60000) / 1000).toString().padStart(2, '0');
                    
                    timerEl.innerText = `${hours}:${minutes}:${seconds}`;
                    btn.innerText = `ДОСТУПНО ЧЕРЕЗ ${hours}:${minutes}:${seconds}`;
                }
            };

            updateTimer();
            setInterval(updateTimer, 1000);
        }

        async function claimDailyBonus() {
            if (!user) return;
            
            const btn = document.getElementById('bonus-btn');
            btn.disabled = true;
            btn.innerText = "СОХРАНЕНИЕ...";

            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

            generatedBonus = parseFloat((Math.random() * (0.50 - 0.05) + 0.05).toFixed(2));
            const currentBalance = parseFloat(user.balance || 0);
            const targetBalance = parseFloat((currentBalance + generatedBonus).toFixed(2));

            let updateData = { balance: targetBalance };
            
            if (user.hasOwnProperty('last_bonus_claim')) {
                updateData.last_bonus_claim = new Date().toISOString();
            }

            try {
                const { error } = await SB.from('users').update(updateData).eq('id', user.id);
                if (error) throw error;

                user.balance = targetBalance;
                if (updateData.last_bonus_claim) user.last_bonus_claim = updateData.last_bonus_claim;
                document.getElementById('val-stars').innerText = targetBalance.toFixed(2);

                document.getElementById('bonus-gain-text').innerText = `+${generatedBonus.toFixed(2)} ★`;
                document.getElementById('win-modal').style.display = 'flex';
            } catch (err) {
                console.error("Ошибка при работе с базой:", err.message);
                document.getElementById('bonus-gain-text').innerText = `+${generatedBonus.toFixed(2)} ★ (Тест)`;
                document.getElementById('win-modal').style.display = 'flex';
            }
        }

        function confirmAndReload() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            location.reload();
        }

        checkAuth();
    </script>
</body>
</html>
