<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FixStars - Tasks</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root {
            --orange: #ff7a1a;
            --orange-light: #ffb347;
            --line: rgba(255, 150, 60, 0.35);
        }
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        body {
            background:
                radial-gradient(circle at 50% 8%, rgba(255, 122, 26, 0.75) 0%, rgba(255, 122, 26, 0.2) 28%, transparent 55%),
                linear-gradient(180deg, #5a1e00 0%, #2a0d00 45%, #120500 100%);
            background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        #stars-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .layer { position: relative; z-index: 1; }

        /* паутина и паук */
        .web { position: fixed; top: 0; right: 0; width: 100px; height: 100px; z-index: 0; pointer-events: none; opacity: 0.8; }
        .spider-wrap { position: fixed; top: 0; left: 68%; z-index: 2; pointer-events: none; animation: spiderDrop 5s ease-in-out infinite; }
        .spider-wrap .thread { width: 2px; height: 60px; background: #000; margin: 0 auto; }
        .spider-wrap .sp { font-size: 26px; line-height: 1; margin-left: -12px; margin-top: -3px; filter: brightness(0); }
        @keyframes spiderDrop { 0%,100% { transform: translateY(-28px); } 50% { transform: translateY(6px); } }

        .header-panel { padding: 12px 20px; background: rgba(20, 6, 0, 0.45); border-bottom: 1px solid var(--line); padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px)); }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 12px; background: rgba(20, 6, 0, 0.8); border: 1px solid var(--line); }
        .back-btn:active { transform: scale(0.9); }
        .bal-pill { display: flex; align-items: center; gap: 8px; background: rgba(20, 6, 0, 0.8); padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); color: var(--orange-light); }

        .sub-panel { padding: 14px 20px; border-bottom: 1px solid rgba(255, 150, 60, 0.15); }

        .tasks-container { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
        .tasks-container::-webkit-scrollbar { display: none; }

        .task-card {
            position: relative; overflow: hidden;
            background: linear-gradient(160deg, rgba(255, 122, 26, 0.24) 0%, rgba(30, 10, 0, 0.82) 100%);
            border: 1px solid var(--line); border-radius: 28px; padding: 24px;
            display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .task-card .card-web { position: absolute; top: 0; right: 0; width: 70px; height: 70px; opacity: 0.6; pointer-events: none; }
        .task-card .card-pump { position: absolute; bottom: 8px; left: 12px; font-size: 22px; opacity: 0.35; pointer-events: none; }
        .task-hero { width: 104px; height: 104px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255, 140, 30, 0.6)); animation: float 3.5s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .reward-pill { color: var(--orange-light); background: rgba(255, 122, 26, 0.18); border: 1px solid rgba(255, 150, 60, 0.3); }

        .btn-row { display: flex; width: 100%; gap: 8px; margin-top: 6px; }
        .btn-action { flex: 1; text-align: center; font-weight: 900; font-size: 11px; padding: 14px 4px; border-radius: 14px; text-transform: uppercase; transition: all 0.2s ease; }
        .btn-action:active { transform: scale(0.95); }
        .btn-action:disabled { opacity: 0.4; }
        .btn-go { background: rgba(10, 3, 0, 0.85); color: #fff; border: 1px solid rgba(255, 150, 60, 0.35); }
        .btn-verify { background: linear-gradient(135deg, #ffa13a, #e2570a 60%, #c2410c); color: #fff; box-shadow: 0 0 20px rgba(255, 122, 26, 0.45), inset 0 -3px 0 rgba(120, 30, 0, 0.4); }
        .btn-skip { background: rgba(0, 0, 0, 0.3); color: #b58a6a; border: 1px solid rgba(255, 150, 60, 0.15); }

        .star-ico { display: inline-block; vertical-align: middle; object-fit: contain; }
        .search-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px; gap: 16px; }
        .spinner { width: 44px; height: 44px; border: 3px solid #3a1500; border-left-color: var(--orange); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .fade-text { animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .empty-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; margin-top: 24px; border-radius: 28px; background: linear-gradient(160deg, rgba(255, 122, 26, 0.16), rgba(30, 10, 0, 0.8)); border: 1px solid var(--line); }

        /* общие модалки */
        .modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(10, 3, 0, 0.92); backdrop-filter: blur(12px); align-items: center; justify-content: center; }
        .modal-box { position: relative; overflow: hidden; width: 85%; max-width: 340px; padding: 30px 24px 24px; border-radius: 28px; text-align: center; animation: pop 0.3s ease; }
        @keyframes pop { from { transform: scale(0.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* модалка успеха */
        #success-modal .modal-box { background: radial-gradient(circle at 50% 0%, #6b2400 0%, #1c0900 70%); border: 1px solid rgba(255, 170, 80, 0.7); box-shadow: 0 0 40px rgba(255, 122, 26, 0.5); }
        .m-btn { position: relative; overflow: hidden; width: 100%; padding: 15px; border-radius: 16px; font-weight: 900; font-style: italic; font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #fff; }
        .m-btn:active { transform: scale(0.96); }
        .m-orange { background: linear-gradient(135deg, #ffa13a, #e2570a 60%, #c2410c); box-shadow: 0 0 22px rgba(255, 122, 26, 0.55), inset 0 -3px 0 rgba(120, 30, 0, 0.45); }
        .m-orange::after { content: ''; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent); transform: skewX(-20deg); animation: shine 3s infinite; }
        @keyframes shine { 0% { left: -60%; } 60%, 100% { left: 130%; } }

        /* модалка "не подписан" */
        #fail-modal .modal-box { background: #000; border: 1px solid #5a0000; box-shadow: 0 0 40px rgba(160, 0, 0, 0.45); padding-top: 46px; }
        .m-dark { background: #140000; border: 1px solid #a00000; color: #ff5050; }
        .blood { position: absolute; top: 0; left: 0; width: 100%; height: 60px; pointer-events: none; }
        .blood svg { width: 100%; height: 100%; display: block; }
        .fail-title { animation: flick 3s infinite; }
        @keyframes flick { 0%,100% { opacity: 1; } 46% { opacity: 1; } 48% { opacity: 0.45; } 50% { opacity: 1; } 53% { opacity: 0.65; } 55% { opacity: 1; } }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <!-- градиент для крови -->
    <svg width="0" height="0" style="position:absolute">
        <defs>
            <linearGradient id="blood-g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="60">
                <stop offset="0" stop-color="#5e0000"/>
                <stop offset="1" stop-color="#b30000"/>
            </linearGradient>
        </defs>
    </svg>

    <!-- паутина в углу и паук -->
    <svg class="web" viewBox="0 0 150 150" fill="none" stroke="#000" stroke-width="1">
        <path d="M150 0 L0 0 M150 0 L150 150 M150 0 L0 110 M150 0 L40 150 M150 0 L90 150 M150 0 L0 50"/>
        <path d="M120 0 Q115 25 150 30 M85 0 Q80 45 150 60 M50 0 Q45 70 150 95 M15 0 Q10 100 150 130"/>
    </svg>
    <div class="spider-wrap"><div class="thread"></div><div class="sp">🕷️</div></div>

    <header class="header-panel layer flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="back-btn">
                <svg class="w-4 h-4 text-orange-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">FIX<span style="color:#ffb347">TASKS</span></div>
        </div>
        <div class="bal-pill">
            <img src="img/star.png" class="w-4 h-4" onerror="this.style.display='none'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <div class="sub-panel layer">
        <h2 class="text-xs uppercase font-black tracking-widest" style="color:#ffb347">🎃 Доступные задания</h2>
        <p class="text-[11px] mt-0.5" style="color:#e2c4a8">Выполняй задания спонсоров и получай звёзды на счёт</p>
    </div>

    <div class="tasks-container layer" id="tasks-list"></div>

    <!-- модалка: звёзды заработаны -->
    <div id="success-modal" class="modal">
        <div class="modal-box">
            <img src="img/star.png" class="w-20 h-20 mx-auto mb-3 object-contain animate-bounce" style="filter: drop-shadow(0 0 18px rgba(255,150,40,0.8))" alt="">
            <h2 class="text-xl font-black uppercase italic tracking-tight" style="color:#ffb347">🎃 Задание выполнено!</h2>
            <div class="py-4 rounded-2xl my-5" style="background: rgba(255,122,26,0.12); border: 1px solid rgba(255,150,60,0.3);">
                <p id="reward-text" class="text-3xl font-black" style="color:#ffb347">+0.00</p>
            </div>
            <button onclick="closeModal()" class="m-btn m-orange">Отлично</button>
        </div>
    </div>

    <!-- модалка: не подписан / задание не выполнено -->
    <div id="fail-modal" class="modal">
        <div class="modal-box">
            <div class="blood" id="blood-fail"></div>
            <div class="text-5xl mb-3">💀</div>
            <h2 id="fail-title" class="fail-title text-xl font-black uppercase italic tracking-tight" style="color:#ff2a2a; text-shadow: 0 0 14px rgba(255,0,0,0.6)">Вы не подписаны</h2>
            <p id="fail-text" class="text-xs my-4 leading-relaxed" style="color:#cfcfcf">Подпишитесь на канал и нажмите «Проверить» ещё раз.</p>
            <button onclick="closeFail()" class="m-btn m-dark">Понятно</button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        const BACKEND_URL = 'https://sdjsdjsd.vercel.app';

        const IMAGES = ["pepe.png", "chassiki.png", "cccccerce.png", "mixail.png", "rozka.png", "pidarynok.png", "totik.png", "buket.png", "raketa.png", "kypok.png", "kolechko.png", "alik.png"];

        let own = [];
        let skipped = new Set();
        const SRC = {
            bh: { path: '/tasks/bh', link: null, loaded: false, error: false, reward: 0.3 },
            fl: { path: '/tasks/fl', link: null, loaded: false, error: false, reward: 0.3 }
        };
        let cur = null;
        let busy = false;
        let searchTimer = null;

        const listEl = () => document.getElementById('tasks-list');

        // звуки (лежат рядом с tasks.html)
        const sndEarn = new Audio('earn.mp3');
        const sndFail = new Audio('skip.mp3');
        sndEarn.preload = 'auto';
        sndFail.preload = 'auto';
        function playSnd(a) {
            try {
                a.currentTime = 0;
                const p = a.play();
                if (p && p.catch) p.catch(e => console.warn('звук не играет', e));
            } catch (_) {}
        }

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function starImg(size) {
            const s = size || 16;
            return `<img src="img/star.png" class="star-ico" style="width:${s}px;height:${s}px" alt="" onerror="this.style.display='none'">`;
        }
        function pickImg(key) {
            let h = 0;
            for (const c of String(key)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return 'img/' + IMAGES[h % IMAGES.length];
        }
        function setBalance(v) { document.getElementById('val-stars').innerText = Number(v || 0).toFixed(2); }
        function haptic(t) { try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (_) {} }
        function goHome() { haptic(); window.location.href = 'index.html'; }

        async function api(path, body) {
            const res = await fetch(BACKEND_URL + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: tg.initData, ...(body || {}) })
            });
            let data = {};
            try { data = await res.json(); } catch (_) {}
            if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
            return data;
        }

        // ---- Модалка успеха (+ звук earn.mp3) ----
        function showModal(reward) {
            document.getElementById('reward-text').innerHTML = `+${Number(reward).toFixed(2)} ${starImg(28)}`;
            document.getElementById('success-modal').style.display = 'flex';
            playSnd(sndEarn);
            try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
        }
        function closeModal() { document.getElementById('success-modal').style.display = 'none'; }

        // ---- Модалка "не подписан" (+ звук skip.mp3) ----
        function showFail(title, text) {
            document.getElementById('fail-title').innerText = title;
            document.getElementById('fail-text').innerText = text;
            document.getElementById('fail-modal').style.display = 'flex';
            playSnd(sndFail);
            try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); } catch (_) {}
        }
        function closeFail() { document.getElementById('fail-modal').style.display = 'none'; }

        // кровь сверху модалки
        function buildBlood(el) {
            if (!el) return;
            const n = 7;
            let drips = '';
            for (let i = 0; i < n; i++) {
                const x = 22 + i * (316 / (n - 1)) + (Math.random() * 16 - 8);
                const w = 4 + Math.random() * 3.5;
                const len = 14 + Math.random() * 26;
                const dur = (5 + Math.random() * 4).toFixed(1);
                const begin = (Math.random() * 3).toFixed(1);
                const r = (w / 2 + 1.2).toFixed(1);
                drips += `
                    <line x1="${x}" y1="6" x2="${x}" y2="${len}" stroke="url(#blood-g)" stroke-width="${w}" stroke-linecap="round">
                        <animate attributeName="y2" values="${len};${len + 7};${len}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>
                    </line>
                    <circle cx="${x}" cy="${len}" r="${r}" fill="url(#blood-g)">
                        <animate attributeName="cy" values="${len};${len + 7};${len}" dur="${dur}s" begin="${begin}s" repeatCount="indefinite"/>
                    </circle>
                    <line x1="${x - w * 0.2}" y1="8" x2="${x - w * 0.2}" y2="${len - 3}" stroke="rgba(255,130,130,0.3)" stroke-width="1" stroke-linecap="round"/>`;
            }
            el.innerHTML = `<svg viewBox="0 0 360 60" preserveAspectRatio="xMidYMin slice">
                <path d="M0 0H360V9Q340 14 320 9T280 10T240 8T200 11T160 9T120 10T80 8T40 11T0 9Z" fill="#6e0000"/>
                ${drips}
            </svg>`;
        }
        buildBlood(document.getElementById('blood-fail'));

        // ---- Экран поиска: сначала "Ищем задания...", через пару секунд "Это займёт меньше минуты" ----
        function stopSearching() {
            if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
        }
        function showSearching() {
            stopSearching();
            listEl().innerHTML = `
                <div class="search-box">
                    <div class="spinner"></div>
                    <div id="search-text" class="text-sm font-black uppercase tracking-wider" style="color:#ffd2a0">Ищем задания...</div>
                </div>`;
            searchTimer = setTimeout(() => {
                const el = document.getElementById('search-text');
                if (el) {
                    el.classList.remove('fade-text');
                    void el.offsetWidth;
                    el.classList.add('fade-text');
                    el.innerText = 'Это займёт меньше минуты';
                }
            }, 2500);
        }

        // ---- Внешние источники (BotoHub / Flowly) ----
        async function srcCall(name, action) {
            const s = SRC[name];
            const prev = s.link;
            const d = await api(s.path, { action });
            s.loaded = true;
            if (d.ok === false) { s.error = true; s.link = null; return { ok: false, prev }; }
            s.error = false;
            s.link = d.link || null;
            if (d.rewarded > 0) {
                if (d.new_balance !== null && d.new_balance !== undefined) setBalance(d.new_balance);
                showModal(d.rewarded);
            }
            return { ok: true, prev, link: d.link, rewarded: d.rewarded };
        }

        async function ensureSrc(name) {
            const s = SRC[name];
            if (s.loaded) return;
            try { await srcCall(name, 'get'); } catch (e) { s.loaded = true; s.error = true; s.link = null; }
        }

        // ---- Отрисовка ----
        async function render() {
            const t = own.find(x => !skipped.has(x.id));
            if (t) {
                return drawCard({
                    kind: 'own', id: t.id, key: 'own' + t.id, link: t.link,
                    title: t.title,
                    desc: t.desc_text || 'Подпишись на канал и нажми «Проверить»',
                    reward: t.reward
                });
            }

            const need = ['bh', 'fl'].some(n => !SRC[n].loaded);
            if (need) showSearching();

            for (const name of ['bh', 'fl']) {
                await ensureSrc(name);
                if (SRC[name].link) {
                    return drawCard({
                        kind: name, key: name + SRC[name].link, link: SRC[name].link,
                        title: 'Задание',
                        desc: 'Перейди по ссылке, подпишись или запусти бота и нажми «Проверить»',
                        reward: SRC[name].reward
                    });
                }
            }
            drawEmpty();
        }

        function drawCard(t) {
            stopSearching();
            cur = t;
            listEl().innerHTML = `
                <div class="task-card">
                    <svg class="card-web" viewBox="0 0 150 150" fill="none" stroke="#000" stroke-width="1.2">
                        <path d="M150 0 L0 0 M150 0 L150 150 M150 0 L0 110 M150 0 L40 150 M150 0 L90 150 M150 0 L0 50"/>
                        <path d="M120 0 Q115 25 150 30 M85 0 Q80 45 150 60 M50 0 Q45 70 150 95 M15 0 Q10 100 150 130"/>
                    </svg>
                    <div class="card-pump">🎃</div>
                    <img class="task-hero" src="${pickImg(t.key)}" alt="" onerror="this.style.display='none'">
                    <div>
                        <h3 class="text-base font-black tracking-tight text-white">${esc(t.title)}</h3>
                        <p class="text-xs mt-1 max-w-[260px] mx-auto" style="color:#e2c4a8">${esc(t.desc)}</p>
                        <p class="reward-pill text-xs font-black mt-3 px-3 py-1 rounded-full inline-flex items-center gap-1">+${Number(t.reward).toFixed(2)} ${starImg(14)}</p>
                    </div>
                    <div class="btn-row">
                        <button onclick="goToLink()" class="btn-action btn-go">Перейти</button>
                        <button id="btn-check" onclick="checkTask()" class="btn-action btn-verify">Проверить</button>
                        <button id="btn-skip" onclick="skipTask()" class="btn-action btn-skip">Пропустить</button>
                    </div>
                </div>`;
        }

        function drawEmpty() {
            stopSearching();
            cur = null;
            const bothErr = SRC.bh.error && SRC.fl.error;
            const msg = bothErr
                ? ['💀', 'Задания временно недоступны', 'Попробуй открыть раздел чуть позже.']
                : ['👻', 'Пока заданий нет', 'Новые задания появляются регулярно. Загляни позже!'];
            listEl().innerHTML = `
                <div class="empty-box">
                    <div class="text-5xl mb-4">${msg[0]}</div>
                    <h3 class="text-sm font-black uppercase tracking-wider" style="color:#ffd2a0">${msg[1]}</h3>
                    <p class="text-[11px] mt-2 max-w-[220px] leading-relaxed" style="color:#c9a98d">${msg[2]}</p>
                </div>`;
        }

        // ---- Действия ----
        function goToLink() {
            if (!cur) return;
            haptic();
            if (/^https?:\/\/(t|telegram)\.me\//i.test(cur.link) && tg.openTelegramLink) tg.openTelegramLink(cur.link);
            else tg.openLink(cur.link);
        }

        function setBusy(v) {
            busy = v;
            ['btn-check', 'btn-skip'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = v; });
        }

        async function checkTask() {
            if (!cur || busy) return;
            setBusy(true);
            try {
                if (cur.kind === 'own') {
                    const d = await api('/tasks/check_own', { task_id: cur.id });
                    if (d.success) {
                        own = own.filter(x => x.id !== cur.id);
                        setBalance(d.new_balance);
                        showModal(d.reward);
                    } else if (d.reason === 'not_subscribed') {
                        showFail('Вы не подписаны', 'Вы не подписаны на канал. Подпишитесь и нажмите «Проверить» ещё раз.');
                        setBusy(false); return;
                    } else if (d.reason === 'already_done' || d.reason === 'not_found') {
                        own = own.filter(x => x.id !== cur.id);
                    } else {
                        tg.showAlert('Не удалось проверить задание. Попробуй позже.');
                        setBusy(false); return;
                    }
                } else {
                    const r = await srcCall(cur.kind, 'check');
                    if (!r.ok) {
                        tg.showAlert('Не удалось проверить задание. Попробуй позже.');
                        setBusy(false); return;
                    }
                    if (!(r.rewarded > 0) && r.link && r.link === r.prev) {
                        showFail('Не выполнено', 'Вы не подписаны на канал или не выполнили задание. Сделайте это по ссылке и нажмите «Проверить» снова.');
                        setBusy(false); return;
                    }
                }
            } catch (e) {
                tg.showAlert('Ошибка сети. Попробуй ещё раз.');
                setBusy(false); return;
            }
            setBusy(false);
            render();
        }

        // пропуск без звука
        async function skipTask() {
            if (!cur || busy) return;
            haptic();
            if (cur.kind === 'own') {
                skipped.add(cur.id);
                return render();
            }
            setBusy(true);
            showSearching();
            try { await srcCall(cur.kind, 'skip'); } catch (e) { tg.showAlert('Ошибка сети. Попробуй ещё раз.'); }
            setBusy(false);
            render();
        }

        // ---- Старт ----
        window.onload = async () => {
            try {
                tg.expand(); tg.ready();
                tg.headerColor = '#5a1e00';
                tg.backgroundColor = '#1a0a00';
            } catch (_) {}
            if (!tg.initData) {
                listEl().innerHTML = `<div class="text-center text-sm font-bold py-12" style="color:#e2c4a8">Открой приложение через Telegram</div>`;
                return;
            }
            showSearching();
            try {
                const d = await api('/tasks/list');
                own = d.own || [];
                SRC.bh.reward = Number(d.bh_reward || 0.3);
                SRC.fl.reward = Number(d.fl_reward || 0.3);
                setBalance(d.balance);
                render();
            } catch (e) {
                console.error(e);
                stopSearching();
                listEl().innerHTML = `<div class="text-center text-red-400 text-xs py-12 font-bold">Не удалось загрузить задания. Перезапусти приложение.</div>`;
            }
        };

        // искры на фоне
        const canvas = document.getElementById('stars-canvas');
        const ctx = canvas.getContext('2d');
        let embers = [];
        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            embers = Array.from({ length: 30 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.4 + 0.12,
                drift: (Math.random() - 0.5) * 0.3,
                opacity: Math.random() * 0.6 + 0.2,
                yellow: Math.random() < 0.4
            }));
        }
        function animateStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            embers.forEach(s => {
                ctx.beginPath();
                ctx.globalAlpha = s.opacity;
                ctx.fillStyle = s.yellow ? '#ffd27a' : '#ff8a2a';
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
                s.y -= s.speed;
                s.x += s.drift;
                if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
            });
            requestAnimationFrame(animateStars);
        }
        initStars(); animateStars();
        window.addEventListener('resize', initStars);
    </script>
</body>
</html>
