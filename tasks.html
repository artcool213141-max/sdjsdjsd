<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FixStars - Tasks</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #22c55e; }
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        body { background: #050a05; color: white; font-family: 'Inter', sans-serif; margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header-panel { padding: 12px 20px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px)); }
        .tasks-container { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scrollbar-width: none; }
        .tasks-container::-webkit-scrollbar { display: none; }
        .task-card { background: linear-gradient(160deg, rgba(34,197,94,0.07) 0%, rgba(255,255,255,0.02) 100%); border: 1px solid rgba(34,197,94,0.18); border-radius: 28px; padding: 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .task-hero { width: 104px; height: 104px; object-fit: contain; filter: drop-shadow(0 0 18px rgba(34,197,94,0.35)); animation: float 3.5s ease-in-out infinite; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .btn-row { display: flex; width: 100%; gap: 8px; margin-top: 6px; }
        .btn-action { flex: 1; text-align: center; font-weight: 900; font-size: 11px; padding: 14px 4px; border-radius: 14px; text-transform: uppercase; transition: all 0.2s ease; }
        .btn-action:active { transform: scale(0.95); }
        .btn-action:disabled { opacity: 0.4; }
        .btn-go { background: #111; color: #fff; border: 1px solid #222; }
        .btn-verify { background: var(--accent); color: black; box-shadow: 0 0 20px rgba(34,197,94,0.25); }
        .btn-skip { background: rgba(255,255,255,0.02); color: #666; border: 1px solid #141414; }
        #success-modal { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.92); backdrop-filter: blur(12px); align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="flex items-center justify-center w-9 h-9 rounded-xl bg-[#111] border border-[#222] active:scale-90 transition-transform">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">FIX<span class="text-[#22c55e]">TASKS</span></div>
        </div>
        <div class="flex items-center gap-2 bg-[#111] px-4 py-2 rounded-full border border-[#222]">
            <img src="img/star.png" class="w-4 h-4" onerror="this.style.display='none'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <div class="p-4 bg-[#0a0a0a]/50 border-b border-[#111]">
        <h2 class="text-xs uppercase font-black tracking-widest text-gray-500">Доступные задания</h2>
        <p class="text-[11px] text-gray-400 mt-0.5">Выполняй задания спонсоров и получай ★ на счёт</p>
    </div>

    <div class="tasks-container" id="tasks-list">
        <div class="text-center text-gray-500 text-xs py-12">Загрузка заданий...</div>
    </div>

    <div id="success-modal">
        <div class="bg-[#0f0f0f] border border-[#22c55e] rounded-[28px] w-[85%] max-w-sm p-6 text-center shadow-2xl">
            <div class="text-6xl mb-4 animate-bounce">⭐</div>
            <h2 class="text-xl font-black uppercase italic text-green-400 tracking-tight">Задание выполнено!</h2>
            <div class="bg-white/5 py-4 rounded-2xl border border-white/5 my-5">
                <p id="reward-text" class="text-3xl font-black text-green-400">+0.00 ★</p>
            </div>
            <button onclick="closeModal()" class="w-full bg-[#22c55e] py-4 rounded-xl font-black text-black uppercase text-xs tracking-wider active:scale-95 transition-transform">Отлично</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BACKEND_URL = 'https://sdjsdjsd.vercel.app';

        const IMAGES = ["pepe.png", "chassiki.png", "cccccerce.png", "mixail.png", "rozka.png", "pidarynok.png", "totik.png", "buket.png", "raketa.png", "kypok.png", "kolechko.png", "alik.png"];

        let own = [];
        let skipped = new Set();
        const SRC = {
            bh: { path: '/tasks/bh', link: null, loaded: false, error: false, reward: 0.3 },
            sg: { path: '/tasks/sg', link: null, loaded: false, error: false, reward: 0.1 }
        };
        let cur = null;
        let busy = false;

        const listEl = () => document.getElementById('tasks-list');

        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function pickImg(key) {
            let h = 0;
            for (const c of String(key)) h = (h * 31 + c.charCodeAt(0)) >>> 0;
            return 'img/' + IMAGES[h % IMAGES.length];
        }
        function setBalance(v) { document.getElementById('val-stars').innerText = Number(v || 0).toFixed(2); }
        function haptic(t) { try { tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t || 'light'); } catch (_) {} }
        function goHome() { haptic(); window.location.href = 'index.html'; }

        async function api(path, body) {
            const res = await fetch(BACKEND_URL + path, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: tg.initData, ...(body || {}) })
            });
            let data = {};
            try { data = await res.json(); } catch (_) {}
            if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
            return data;
        }

        function showModal(reward) {
            document.getElementById('reward-text').innerText = `+${Number(reward).toFixed(2)} ★`;
            document.getElementById('success-modal').style.display = 'flex';
            try { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (_) {}
        }
        function closeModal() { document.getElementById('success-modal').style.display = 'none'; }

        // ---- Внешние источники (BotoHub / Subgram) ----
        async function srcCall(name, action) {
            const s = SRC[name];
            const prev = s.link;
            const d = await api(s.path, { action });
            s.loaded = true;
            if (d.ok === false) { s.error = true; s.link = null; return { ok: false, prev }; }
            s.error = false;
            s.link = d.link || null;
            if (d.rewarded > 0) {
                if (d.new_balance !== null && d.new_balance !== undefined) setBalance(d.new_balance);
                showModal(d.rewarded);
            }
            return { ok: true, prev, link: d.link, rewarded: d.rewarded };
        }

        async function ensureSrc(name) {
            const s = SRC[name];
            if (s.loaded) return;
            listEl().innerHTML = `<div class="text-center text-gray-500 text-xs py-12">Ищем задания спонсоров...</div>`;
            try { await srcCall(name, 'get'); } catch (e) { s.loaded = true; s.error = true; s.link = null; }
        }

        // ---- Отрисовка ----
        async function render() {
            const t = own.find(x => !skipped.has(x.id));
            if (t) {
                return drawCard({
                    kind: 'own', id: t.id, key: 'own' + t.id, link: t.link,
                    title: t.title,
                    desc: t.desc_text || 'Подпишись на канал и нажми «Проверить»',
                    reward: t.reward
                });
            }

            for (const name of ['bh', 'sg']) {
                await ensureSrc(name);
                if (SRC[name].link) {
                    return drawCard({
                        kind: name, key: name + SRC[name].link, link: SRC[name].link,
                        title: 'Задание от спонсора',
                        desc: 'Перейди по ссылке, подпишись или запусти бота и нажми «Проверить»',
                        reward: SRC[name].reward
                    });
                }
            }
            drawEmpty();
        }

        function drawCard(t) {
            cur = t;
            listEl().innerHTML = `
                <div class="task-card">
                    <img class="task-hero" src="${pickImg(t.key)}" alt="" onerror="this.style.display='none'">
                    <div>
                        <h3 class="text-base font-black tracking-tight text-white/90">${esc(t.title)}</h3>
                        <p class="text-xs text-gray-400 mt-1 max-w-[260px] mx-auto">${esc(t.desc)}</p>
                        <p class="text-xs text-green-400 font-black mt-3 bg-green-500/10 px-3 py-1 rounded-full inline-block">+${Number(t.reward).toFixed(2)} ★</p>
                    </div>
                    <div class="btn-row">
                        <button onclick="goToLink()" class="btn-action btn-go">Перейти</button>
                        <button id="btn-check" onclick="checkTask()" class="btn-action btn-verify">Проверить</button>
                        <button id="btn-skip" onclick="skipTask()" class="btn-action btn-skip">Пропустить</button>
                    </div>
                </div>`;
        }

        function drawEmpty() {
            cur = null;
            const bothErr = SRC.bh.error && SRC.sg.error;
            const msg = bothErr
                ? ['⚠️', 'Задания временно недоступны', 'Попробуй открыть раздел чуть позже.']
                : ['⏳', 'Пока заданий нет', 'Новые задания появляются регулярно. Загляни позже!'];
            listEl().innerHTML = `
                <div class="flex flex-col items-center justify-center text-center p-8 bg-white/5 border border-white/5 rounded-[28px] mt-6">
                    <div class="text-5xl mb-4">${msg[0]}</div>
                    <h3 class="text-sm font-black text-gray-300 uppercase tracking-wider">${msg[1]}</h3>
                    <p class="text-[11px] text-gray-500 mt-2 max-w-[220px] leading-relaxed">${msg[2]}</p>
                </div>`;
        }

        // ---- Действия ----
        function goToLink() {
            if (!cur) return;
            haptic();
            if (/^https?:\/\/(t|telegram)\.me\//i.test(cur.link) && tg.openTelegramLink) tg.openTelegramLink(cur.link);
            else tg.openLink(cur.link);
        }

        function setBusy(v) {
            busy = v;
            ['btn-check', 'btn-skip'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = v; });
        }

        async function checkTask() {
            if (!cur || busy) return;
            setBusy(true);
            try {
                if (cur.kind === 'own') {
                    const d = await api('/tasks/check_own', { task_id: cur.id });
                    if (d.success) {
                        own = own.filter(x => x.id !== cur.id);
                        setBalance(d.new_balance);
                        showModal(d.reward);
                    } else if (d.reason === 'not_subscribed') {
                        tg.showAlert('Подписка не найдена. Подпишись на канал и нажми «Проверить» ещё раз.');
                        setBusy(false); return;
                    } else if (d.reason === 'already_done' || d.reason === 'not_found') {
                        own = own.filter(x => x.id !== cur.id);
                    } else {
                        tg.showAlert('Не удалось проверить задание. Попробуй позже.');
                        setBusy(false); return;
                    }
                } else {
                    const r = await srcCall(cur.kind, 'check');
                    if (!r.ok) {
                        tg.showAlert('Не удалось проверить задание. Попробуй позже.');
                        setBusy(false); return;
                    }
                    if (!(r.rewarded > 0) && r.link && r.link === r.prev) {
                        tg.showAlert('Задание ещё не выполнено. Выполни его по ссылке и нажми «Проверить» снова.');
                        setBusy(false); return;
                    }
                }
            } catch (e) {
                tg.showAlert('Ошибка сети. Попробуй ещё раз.');
                setBusy(false); return;
            }
            setBusy(false);
            render();
        }

        async function skipTask() {
            if (!cur || busy) return;
            haptic();
            if (cur.kind === 'own') {
                skipped.add(cur.id);
                return render();
            }
            setBusy(true);
            try { await srcCall(cur.kind, 'skip'); } catch (e) { tg.showAlert('Ошибка сети. Попробуй ещё раз.'); }
            setBusy(false);
            render();
        }

        // ---- Старт ----
        window.onload = async () => {
            try { tg.expand(); tg.ready(); } catch (_) {}
            if (!tg.initData) {
                listEl().innerHTML = `<div class="text-center text-gray-400 text-sm font-bold py-12">Открой приложение через Telegram</div>`;
                return;
            }
            try {
                const d = await api('/tasks/list');
                own = d.own || [];
                SRC.bh.reward = Number(d.bh_reward || 0.3);
                SRC.sg.reward = Number(d.sg_reward || 0.1);
                setBalance(d.balance);
                render();
            } catch (e) {
                console.error(e);
                listEl().innerHTML = `<div class="text-center text-red-400 text-xs py-12 font-bold">Не удалось загрузить задания. Перезапусти приложение.</div>`;
            }
        };
    </script>
</body>
</html>
