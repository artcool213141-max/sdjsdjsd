<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StarsDrop - Tasks</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { 
            --accent: #22c55e; 
        }
        
        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            box-sizing: border-box;
        }
        
        body { 
            background: #050505; 
            color: white; 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        /* Шапка приложения */
        .header-panel { 
            padding: 12px 20px; 
            background: #0a0a0a; 
            border-bottom: 1px solid #1a1a1a; 
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }

        /* Основной контейнер для контента */
        .tasks-container {
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px;
            scrollbar-width: none;
        }
.tasks-container {
    overflow-y: auto;
    -webkit-overflow-scrolling: touch; /* Плавная прокрутка на iOS */
}

        /* Главная вертикальная карточка задания */
        .task-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid #151515;
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        /* Обертка для логотипа задания */
        .task-icon-wrap {
            width: 72px; 
            height: 72px; 
            background: rgba(34, 197, 94, 0.03);
            border-radius: 22px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            border: 1px solid rgba(34, 197, 94, 0.12); 
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .task-icon-wrap img {
            width: 100%; 
            height: 100%; 
            object-fit: cover;
        }

        /* Контейнер для трех кнопок в ряд */
        .btn-row {
            display: flex; 
            width: 100%; 
            gap: 8px; 
            margin-top: 6px;
        }

        /* Базовый класс для кнопок управления */
        .btn-action {
            flex: 1; 
            text-align: center; 
            font-weight: 900; 
            font-size: 11px;
            padding: 14px 4px; 
            border-radius: 14px; 
            text-transform: uppercase;
            transition: all 0.2s ease; 
            tracking-wider: 0.05em;
        }
        .btn-action:active { 
            transform: scale(0.95); 
        }

        /* Кнопка Перейти */
        .btn-go { 
            background: #111; 
            color: #fff; 
            border: 1px solid #222; 
        }
        .btn-go:active {
            background: #161616;
        }

        /* Кнопка Проверить */
        .btn-verify { 
            background: var(--accent); 
            color: black; 
            box-shadow: 0 0 20px rgba(34, 197, 94, 0.2); 
        }
        .btn-verify:disabled { 
            opacity: 0.4; 
            filter: grayscale(1); 
            box-shadow: none; 
        }

        /* Кнопка Пропустить */
        .btn-skip { 
            background: rgba(255,255,255,0.02); 
            color: #555; 
            border: 1px solid #141414; 
        }
        .btn-skip:active {
            color: #777;
            background: rgba(255,255,255,0.05);
        }

        /* Модальное окно успешного выполнения */
        #success-modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 999; 
            background: rgba(0,0,0,0.94); 
            backdrop-filter: blur(12px); 
            align-items: center; 
            justify-content: center; 
        }
    </style>
</head>
<body>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goHome()" class="flex items-center justify-center w-9 h-9 rounded-xl bg-[#111] border border-[#222] active:scale-90 transition-transform">
                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">STARS<span class="text-[#22c55e]">TASKS</span></div>
        </div>
        <div class="flex items-center gap-2 bg-[#111] px-4 py-2 rounded-full border border-[#222]">
            <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <div class="p-4 bg-[#0a0a0a]/50 border-b border-[#111]">
        <h2 class="text-xs uppercase font-black tracking-widest text-gray-500">Доступные задания</h2>
        <p class="text-[11px] text-gray-400 mt-0.5">Выполняй квесты спонсоров и получай ★ на счет</p>
    </div>

    <div class="tasks-container" id="tasks-list">
        <div class="text-center text-gray-500 text-xs py-12">Синхронизация с базой данных...</div>
    </div>

    <div id="success-modal">
        <div class="bg-[#0f0f0f] border border-[#22c55e] rounded-[28px] w-[85%] p-6 text-center shadow-2xl">
            <div class="text-6xl mb-4 animate-bounce">⭐</div>
            <h2 class="text-xl font-black uppercase italic text-green-400 tracking-tight">Задание выполнено!</h2>
            <div class="bg-white/5 py-4 rounded-2xl border border-white/5 my-5 flex flex-col items-center justify-center">
                <p id="reward-text" class="text-3xl font-black text-green-400">+0.00 ★</p>
            </div>
            <button onclick="closeModal()" class="w-full bg-[#22c55e] py-4 rounded-xl font-black text-black uppercase text-xs tracking-wider active:scale-95 transition-transform">Отлично</button>
        </div>
    </div>

    <script>
        // Инициализация Supabase Client
        const SB_URL = "https://bajufluzgcguxconhxuj.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhanVmbHV6Z2NndXhjb25oeHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxODI4NTUsImV4cCI6MjA5Mzc1ODg1NX0.LtqDCLlMlaWluUdnx0uc3Wt-w8jimw9gyLYMwW9eAxs";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;
        
        tg.expand();

        let user = null;
        let TASKS = [];             
        let completedTaskIds = [];
        let skippedTaskIds = [];

        // СПИСОК ТВОИХ КАРТИНОК ИЗ ПАПКИ imgtsk НА ГИТХАБЕ
        // Сюда можешь вписать любые названия файлов картинок, которые ты туда загрузил!
// АКТУАЛЬНЫЙ СПИСОК КАРТИНОК ИЗ ПРАВИЛЬНОЙ ПАПКИ (66 шт.)
        const RANDOM_LOGOS = [
            "1may.jpg",
            "2025.jpg",
            "bear.png",
            "book.jpg",
            "booox.png",
            "botinok.png",
            "box.png",
            "car.png",
            "ccolso2.png",
            "cerrrdce.jpg",
            "chassiki.png",
            "chemodan.jpg",
            "ciga.png",
            "colso.png",
            "costum.jpg",
            "cvetk.PNG",
            "cvetok.png",
            "dog.png",
            "dyxi.png",
            "fonarik.jpg",
            "gribb.PNG",
            "grob.jpg",
            "gyba.png",
            "happybirthday.jpg",
            "heart.png",
            "helmet.png",
            "hero.jpg",
            "kalendar.png",
            "kepka.png",
            "kirpitch.jpg",
            "kkolso.png",
            "kkoolsoo.png",
            "koks.jpg",
            "koktel.png",
            "kot.png",
            "kotel.png",
            "krovatka.jpg",
            "kryg.PNG",
            "lolipop.png",
            "lucky.jpg",
            "mafin.jpg",
            "meczcc.png",
            "metch.png",
            "mini.png",
            "narkotiki.png",
            "obyv.jpg",
            "ochki.jpg",
            "orel.jpg",
            "otkritka.jpg",
            "paska.jpg",
            "pepe.png",
            "rozza.png",
            "rykzak.jpg",
            "shapka.png",
            "shar.jpg",
            "shlem.png",
            "sliva.png",
            "soska.jpg",
            "sshapka.PNG",
            "statyyetka.png",
            "tnt.png",
            "tyfli.PNG",
            "venok.png",
            "yayko.png",
            "zhele.png",
            "zirka.PNG",
            "zmei.png"
        ];

        // Функция получения рандомного элемента из массива логотипов
        function getRandomLogo() {
            const randomIndex = Math.floor(Math.random() * RANDOM_LOGOS.length);
            return RANDOM_LOGOS[randomIndex];
        }

        function goHome() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = 'index.html';
        }

        // Авторизация и загрузка данных из таблиц Supabase
        async function checkAuth() {
            let userId = tg.initDataUnsafe?.user?.id || 7140366080;

            try {
                // 1. Подтягиваем или создаем юзера
                let { data: userData, error: userErr } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (userErr) throw userErr;
                
                if (!userData) {
                    const { data: newUser, error: insError } = await SB.from('users').insert([
                        { id: userId, balance: 0, username: tg.initDataUnsafe?.user?.username || "Player", tasks_completed: 0 }
                    ]).select().single();
                    if (insError) throw insError;
                    userData = newUser;
                }
                user = userData;
                document.getElementById('val-stars').innerText = Number(user.balance || 0).toFixed(2);

                // 2. Вытаскиваем массив id выполненных квестов
                let { data: doneTasks, error: taskErr } = await SB.from('completed_tasks').select('task_id').eq('user_id', userId);
                if (!taskErr && doneTasks) {
                    completedTaskIds = doneTasks.map(t => t.task_id);
                }

                // 3. Загружаем все активные квесты из глобальной таблицы
                let { data: dbTasks, error: dbTasksErr } = await SB.from('tasks_list').select('*');
                if (dbTasksErr) throw dbTasksErr;
                TASKS = dbTasks || [];

                renderTasks();
            } catch (e) {
                console.error("Критический сбой инициализации:", e);
                document.getElementById('tasks-list').innerHTML = `
                    <div class="text-center text-red-500 text-xs py-12 font-bold">
                        Ошибка связи с сервером БД. Перезапустите приложение.
                    </div>
                `;
            }
        }

// Отрисовка очереди квестов
function renderTasks() {
    const listEl = document.getElementById('tasks-list');
    listEl.innerHTML = "";

    // 1. Фильтруем только активные задания
    const activeTasks = TASKS.filter(task => 
        !completedTaskIds.includes(task.id) && 
        !skippedTaskIds.includes(task.id)
    );

    // 2. Если заданий нет — показываем сообщение
    if (activeTasks.length === 0) {
        listEl.innerHTML = `
            <div class="flex flex-col items-center justify-center text-center p-8 bg-white/5 border border-white/5 rounded-[28px] mt-6 shadow-inner">
                <div class="text-5xl mb-4">⏳</div>
                <h3 class="text-sm font-black text-gray-300 uppercase tracking-wider">Все задания выполнены!</h3>
            </div>
        `;
        return;
    }

    // 3. Рендерим ВСЕ активные задания циклом
    activeTasks.forEach(task => {
        const iconUrl = `imgtsk/${getRandomLogo()}`;

        const card = document.createElement('div');
        card.className = "task-card";
        
        card.innerHTML = `
            <div class="flex items-center w-full gap-4">
                <div class="task-icon-wrap !w-14 !h-14 shrink-0">
                    <img src="${iconUrl}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
                </div>
                <div class="flex-grow text-left">
                    <h3 class="text-sm font-black text-white/90">${task.title}</h3>
                    <p class="text-[11px] text-gray-400 mt-0.5">${task.desc_text || 'Выполни квест'}</p>
                    <p class="text-[10px] text-green-400 font-bold mt-1 bg-green-500/10 px-2 py-0.5 rounded-md inline-block">
                        +${Number(task.reward).toFixed(2)} ★
                    </p>
                </div>
            </div>
            
            <div class="btn-row">
                <button onclick="goToLink('${task.link}')" class="btn-action btn-go">Перейти</button>
                <button id="btn-${task.id}" onclick="verifyTask('${task.id}', ${task.reward})" class="btn-action btn-verify">Проверить</button>
                <button onclick="skipTask('${task.id}')" class="btn-action btn-skip">Пропустить</button>
            </div>
        `;
        listEl.appendChild(card);
    });
}

        // Переход по ссылке спонсора
        function goToLink(link) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            if (tg.openTelegramLink) {
                tg.openTelegramLink(link);
            } else {
                tg.openLink(link);
            }
        }

        // Скип текущего квеста
        function skipTask(id) {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            skippedTaskIds.push(id);
            renderTasks(); // Карта обновится, подтянется следующее задание
        }

async function verifyTask(id, reward) {
    const btn = document.getElementById(`btn-${id}`);
    
    // Блокируем кнопку намертво
    btn.disabled = true;
    btn.style.opacity = "0.4";
    btn.innerText = "ПРОВЕРКА...";

    const currentTask = TASKS.find(t => t.id === id);

    try {
        const response = await fetch("https://bajufluzgcguxconhxuj.supabase.co/functions/v1/clever-service", {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id, taskId: id, channelChatId: currentTask.channel, reward: reward })
        });

        const result = await response.json();

        if (result.success) {
            completedTaskIds.push(id); // Локально добавляем в список, чтобы задание скрылось
            document.getElementById('reward-text').innerText = `+${Number(reward).toFixed(2)} ★`;
            document.getElementById('success-modal').style.display = 'flex';
            renderTasks(); // Перерисовываем список, кнопка исчезнет
        } else {
            // Если сервер вернул 'already_done', значит юзер пытался обмануть систему
            alert(result.reason === 'already_done' ? "Задание уже выполнено!" : "Ошибка: " + result.reason);
            btn.disabled = false;
            btn.style.opacity = "1";
            btn.innerText = "Проверить";
        }
    } catch (err) {
        alert("Ошибка сети!");
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.innerText = "Проверить";
    }
}

        function closeModal() {
            document.getElementById('success-modal').style.display = 'none';
        }

        // Запуск сессии при загрузке страницы
        checkAuth();
    </script>
</body>
</html>
