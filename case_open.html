<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PandaGift - Открытие кейса</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--bg-dark:#07173f;--blue:#2f6bff;--blue-light:#8fc2ff;--glass:rgba(255,255,255,.12);--glass-line:rgba(255,255,255,.18);--soft:#cfe0ff;--gold:#ffd24a}
*{box-sizing:border-box}
body{background:var(--bg-dark);color:#fff;font-family:'Inter',sans-serif;margin:0;height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stars-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.main-wrapper{background:radial-gradient(circle at 50% 30%,#4a86ff 0%,rgba(47,107,255,.35) 30%,transparent 65%),linear-gradient(180deg,#1f55d6 0%,#133ea6 45%,#08205f 100%);height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;padding-top:14px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.it{font-weight:900;font-style:italic;text-transform:uppercase}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.back{width:40px;height:40px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:#fff;font-size:18px;cursor:pointer;backdrop-filter:blur(10px)}
.title{font-size:17px;text-shadow:0 4px 18px rgba(0,20,100,.55)}
.top .sp{width:40px}
.chips{display:flex;justify-content:center;gap:10px;margin-top:12px}
.chip{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);padding:8px 16px;border-radius:999px;font-weight:900;font-size:15px}
.chip img{width:20px;height:20px;object-fit:contain}

/* верхняя лента */
.ticker{position:relative;margin:14px 14px 0;height:58px;overflow:hidden;border-radius:999px;background:rgba(3,14,60,.45);border:1px solid var(--glass-line);backdrop-filter:blur(8px);display:flex;align-items:center}
.ticker .tag{flex-shrink:0;padding:0 14px 0 18px;font-size:15px;position:relative;z-index:2;background:linear-gradient(90deg,#0b2a78 70%,transparent)}
.ticker-track{display:flex;gap:16px;align-items:center;will-change:transform;animation:tick 40s linear infinite;padding-left:6px}
.ticker-track img{width:38px;height:38px;object-fit:cover;border-radius:10px;flex-shrink:0}
@keyframes tick{to{transform:translateX(-50%)}}

/* рулетка */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.chev{display:block;margin:0 auto;width:26px;height:16px;opacity:.9;filter:drop-shadow(0 0 8px var(--blue-light))}
.roll{position:relative;height:196px;overflow:hidden;margin:6px 0}
.roll::before,.roll::after{content:'';position:absolute;top:0;bottom:0;width:70px;z-index:3;pointer-events:none}
.roll::before{left:0;background:linear-gradient(90deg,rgba(24,66,170,.95),transparent)}
.roll::after{right:0;background:linear-gradient(270deg,rgba(24,66,170,.95),transparent)}
.strip{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:8px;will-change:transform}
.cell{flex:0 0 148px;height:176px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;border-radius:28px;transition:background .3s,box-shadow .3s}
.cell img.pic{width:128px;height:128px;object-fit:cover;border-radius:22px;margin-bottom:-14px;position:relative;z-index:1;filter:drop-shadow(0 8px 10px rgba(0,20,90,.5))}
.cell .pill{position:relative;z-index:2;display:flex;align-items:center;gap:5px;padding:8px 16px;border-radius:999px;background:rgba(10,36,104,.78);border:1px solid var(--glass-line);font-weight:900;font-size:15px;white-space:nowrap;backdrop-filter:blur(6px)}
.cell .pill img{width:16px;height:16px;object-fit:contain}
.cell.win{background:radial-gradient(circle,rgba(143,194,255,.35),transparent 70%);box-shadow:0 0 30px rgba(143,194,255,.55)}

/* кнопки */
.actions{padding:0 18px}
.row{display:flex;gap:12px;margin-bottom:12px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);color:#fff;font:800 14px 'Inter',sans-serif;cursor:pointer;backdrop-filter:blur(10px)}
.sbtn svg{width:18px;height:18px}
.sbtn:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:999px;padding:18px;background:linear-gradient(180deg,#4f8cff,#1d4ed8);color:#fff;font:italic 900 16px 'Inter',sans-serif;text-transform:uppercase;cursor:pointer;box-shadow:0 0 22px rgba(47,107,255,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.btn img{width:22px;height:22px;object-fit:contain}
.btn:active{transform:scale(.97)}
.btn:disabled{background:rgba(3,14,60,.55);border:1px solid var(--glass-line);color:#a9c3f5;box-shadow:none;transform:none}
.btn.demo{background:linear-gradient(180deg,#5be3a1,#1f9e68);box-shadow:0 0 22px rgba(91,227,161,.35),inset 0 1px 0 rgba(255,255,255,.35)}

/* модалки */
.ov{position:fixed;inset:0;z-index:6000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(2,10,40,.82);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
.ov.show{display:flex}
.ov.vis{opacity:1}
.box{position:relative;width:100%;max-width:400px;max-height:86vh;overflow-y:auto;padding:22px 18px 18px;border-radius:30px;text-align:center;background:linear-gradient(180deg,#1c4bc4 0%,#0a2468 100%);border:1px solid var(--glass-line);box-shadow:0 20px 60px rgba(0,10,60,.6);transform:translateY(24px) scale(.94);transition:transform .3s cubic-bezier(.2,1.2,.4,1);scrollbar-width:none}
.box::-webkit-scrollbar{display:none}
.ov.vis .box{transform:none}
.box h2{margin:0 0 16px;font-size:20px}
.x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:none;background:var(--glass);color:#fff;font-size:16px;cursor:pointer}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:20px;padding:16px;margin-top:12px;font:900 15px 'Inter',sans-serif;color:#fff;background:rgba(255,255,255,.14);border:1px solid var(--glass-line);cursor:pointer}
.mbtn:active{transform:scale(.97)}
.mbtn img{width:18px;height:18px;object-fit:contain}
.mbtn.main{background:#fff;color:#0a2468;border:none}
.mbtn.main .tag2{background:var(--blue);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px}
.mbtn:disabled{opacity:.6}

.set{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px 16px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);margin-bottom:10px}
.set b{display:block;font-size:16px}
.set small{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--soft)}
.sw{position:relative;flex-shrink:0;width:52px;height:30px;border-radius:999px;background:rgba(3,14,60,.6);border:1px solid var(--glass-line);cursor:pointer;transition:background .2s}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#2f6bff}
.sw.on::after{transform:translateX(22px)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(3,14,60,.5);flex-shrink:0}
.seg div{display:flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-weight:900;font-size:13px;cursor:pointer;color:var(--soft)}
.seg div img{width:15px;height:15px;object-fit:contain}
.seg div.on{background:#2f6bff;color:#fff}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gi{display:flex;flex-direction:column;align-items:center}
.gi img.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block;margin-bottom:-12px;position:relative;z-index:1}
.gi .pill{position:relative;z-index:2;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:rgba(10,36,104,.8);border:1px solid var(--glass-line);font-weight:900;font-size:12px;white-space:nowrap}
.gi .pill img{width:13px;height:13px;object-fit:contain}

.win-t{font-size:26px;margin-bottom:12px}
.win-img{width:190px;height:190px;object-fit:cover;border-radius:30px;margin:0 auto 12px;display:block;filter:drop-shadow(0 10px 18px rgba(0,20,90,.55));animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.win-name{font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.win-name img{width:20px;height:20px;object-fit:contain}
.win-name .p{color:var(--gold)}
.note{font-size:12px;font-weight:700;color:var(--soft);margin-top:4px}

.toast{position:fixed;left:50%;bottom:130px;transform:translate(-50%,20px);background:#0a2468;border:1px solid var(--blue-light);font-weight:800;font-size:13px;padding:12px 18px;border-radius:22px;z-index:9000;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center;word-break:break-word}
.toast.show{opacity:1;transform:translate(-50%,0)}

#loader{position:fixed;inset:0;background:var(--bg-dark);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#loader.hidden{opacity:0;pointer-events:none}
.ring{width:50px;height:50px;border:3px solid #12308a;border-left-color:var(--blue-light);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader"><div class="ring"></div><div class="it" style="margin-top:16px;color:#8fc2ff;letter-spacing:3px;font-size:14px">PandaGift</div></div>
<canvas id="stars-canvas"></canvas>

<div class="main-wrapper">

    <div class="top">
        <button class="back" onclick="location.href='case.html'">←</button>
        <div class="title it" id="case-title">Кейс</div>
        <div class="sp"></div>
    </div>

    <div class="chips">
        <div class="chip"><img src="img/star.png" alt="Stars"><span id="bal-stars">0</span></div>
        <div class="chip"><img src="img/ton.png" alt="TON"><span id="bal-ton">0</span></div>
    </div>

    <div class="ticker">
        <div class="tag it">В кейсе</div>
        <div class="ticker-track" id="ticker"></div>
    </div>

    <div class="stage">
        <svg class="chev" viewBox="0 0 26 16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l10 10L23 3"/></svg>
        <div class="roll"><div class="strip" id="strip"></div></div>
        <svg class="chev" viewBox="0 0 26 16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13L13 3l10 10"/></svg>
    </div>

    <div class="actions">
        <div class="row">
            <div class="sbtn" onclick="openSettings()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg>Настройки
            </div>
            <div class="sbtn" onclick="openPrizes()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg>Призы
            </div>
        </div>
        <button class="btn" id="spin-btn" onclick="spin()" disabled>
            <span id="spin-lbl">Крутить за</span><img id="spin-ico" src="img/star.png" alt=""><span id="spin-price">—</span>
        </button>
    </div>
</div>

<div class="ov" id="ov-settings"><div class="box">
    <button class="x" onclick="closeOv('ov-settings')">✕</button>
    <h2 class="it">Настройки кейса</h2>
    <div class="set">
        <div><b>Валюта</b><small>Чем платить за открытие</small></div>
        <div class="seg" id="seg">
            <div data-c="stars" class="on"><img src="img/star.png" alt="">Stars</div>
            <div data-c="ton"><img src="img/ton.png" alt="">TON</div>
        </div>
    </div>
    <div class="set">
        <div><b>Демо</b><small>Кейс бесплатный, но призы не начисляются</small></div>
        <div class="sw" id="demo-sw" onclick="toggleDemo()"></div>
    </div>
    <button class="mbtn" onclick="closeOv('ov-settings')">Закрыть</button>
</div></div>

<div class="ov" id="ov-prizes"><div class="box">
    <button class="x" onclick="closeOv('ov-prizes')">✕</button>
    <h2 class="it">Возможные призы</h2>
    <div class="grid" id="prizes"></div>
    <button class="mbtn" onclick="closeOv('ov-prizes')">Закрыть</button>
</div></div>

<div class="ov" id="ov-win"><div class="box" id="win-box"></div></div>
<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram.WebApp;
const BACKEND_URL = 'https://sdjsdjsd.vercel.app';
const $ = id => document.getElementById(id);
const CELL = 148, GAP = 8, STEP = CELL + GAP, WIN_INDEX = 48, TOTAL = 60;
const META = { bear:'Bear', ring:'Ring', lip:'Lip', halloween:'Halloween', loot:'Loot', helmet:'Helmet', pepe:'Pepe' };

const CASE_ID = new URLSearchParams(location.search).get('id');
if (!CASE_ID || CASE_ID === 'free') location.replace(CASE_ID === 'free' ? 'event.html' : 'case.html');

const S = { items: [], priceStars: 0, priceTon: 0, busy: false, stars: 0, ton: 0, cur: 'stars', demo: false };
try { const c = localStorage.getItem('case_cur'); if (c === 'ton' || c === 'stars') S.cur = c; } catch (e) {}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function haptic(kind, type) { try { tg.HapticFeedback[kind](type); } catch (e) {} }
function toast(t) { const el = $('toast'); el.innerText = String(t).slice(0, 160); el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 3000); }
function fmt(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }
function imgUrl(id) { return `${BACKEND_URL}/inventory/preview/${id}`; }
function onImgErr(img) { img.onerror = null; img.src = 'img/star.png'; }

async function api(path, body) {
    const res = await fetch(BACKEND_URL + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tg.initData, ...(body || {}) })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));
    return data;
}

/* ---------- данные ---------- */
function applyBalances(d) {
    if (d.balance !== undefined) { S.stars = Number(d.balance) || 0; $('bal-stars').innerText = fmt(S.stars); }
    if (d.ton_balance !== undefined) { S.ton = Number(d.ton_balance) || 0; $('bal-ton').innerText = fmt(S.ton); }
}
const uid = (tg.initDataUnsafe?.user && tg.initDataUnsafe.user.id) ? tg.initDataUnsafe.user.id : '12345';
async function loadBalances() {
    try {
        const r = await fetch(`${BACKEND_URL}/get_balance/${uid}?t=${Date.now()}`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        applyBalances(await r.json());
    } catch (e) { console.warn('balance', e); }
}
async function loadCase() {
    try {
        const d = await api('/case/info', { case_id: CASE_ID });
        S.items = (d.items || []).filter(x => x && x.id != null);
        S.priceStars = Number(d.price_stars) || 0;
        S.priceTon = Number(d.price_ton) || 0;
        $('case-title').innerText = d.name || META[CASE_ID] || 'Кейс';
        drawTicker(); drawPrizes();
    } catch (e) { toast('Кейс недоступен: ' + e.message); }
    drawSpinBtn();
}

/* ---------- кнопка ---------- */
function drawSpinBtn() {
    const b = $('spin-btn');
    b.disabled = S.busy || !S.items.length;
    b.classList.toggle('demo', S.demo);
    if (S.demo) {
        $('spin-lbl').innerText = 'Крутить демо';
        $('spin-ico').style.display = 'none';
        $('spin-price').innerText = '';
    } else {
        $('spin-lbl').innerText = 'Крутить за';
        $('spin-ico').style.display = '';
        $('spin-ico').src = S.cur === 'ton' ? 'img/ton.png' : 'img/star.png';
        $('spin-price').innerText = S.items.length ? fmt(S.cur === 'ton' ? S.priceTon : S.priceStars) : '—';
    }
}
function setBusy(v) { S.busy = v; drawSpinBtn(); }

/* ---------- верхняя лента и призы ---------- */
function drawTicker() {
    const one = S.items.map(it => `<img src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">`).join('');
    // дублируем, чтобы анимация шла по кругу без шва
    $('ticker').innerHTML = (one + one + one + one);
}
function sorted() { return S.items.slice().sort((a, b) => (Number(b.price_stars) || 0) - (Number(a.price_stars) || 0)); }
function drawPrizes() {
    $('prizes').innerHTML = sorted().map(it => `
        <div class="gi">
            <img class="pic" src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">
            <div class="pill"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div>
        </div>`).join('');
}

/* ---------- лента ---------- */
function cellNft(it, win) {
    return `<div class="cell${win ? ' win' : ''}"><img class="pic" src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)"><div class="pill"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div></div>`;
}
function filler() { const p = S.items; return cellNft(p[Math.floor(Math.random() * p.length)], false); }
function placeStrip(html) {
    const st = $('strip');
    st.style.transition = 'none';
    st.innerHTML = html;
    st.style.transform = 'translateX(0)';
    void st.offsetWidth;
}
function idleStrip() {
    if (!S.items.length) return;
    const list = sorted();
    let html = '';
    for (let i = 0; i < 14; i++) html += cellNft(list[i % list.length], false);
    placeStrip(html);
    const w = $('strip').parentElement.clientWidth;
    $('strip').style.transform = `translateX(${Math.round(w / 2 - CELL / 2 - STEP * 3)}px)`;
}
function runStrip(cells, onDone) {
    const st = $('strip');
    placeStrip(cells.join(''));
    const w = st.parentElement.clientWidth;
    const jitter = Math.round((Math.random() - 0.5) * (CELL * 0.5));
    const shift = Math.round(WIN_INDEX * STEP + CELL / 2 - w / 2 + jitter);
    requestAnimationFrame(() => {
        st.style.transition = 'transform 5.2s cubic-bezier(.08,.6,.12,1)';
        st.style.transform = `translateX(${-shift}px)`;
    });
    let done = false;
    const fin = () => { if (done) return; done = true; st.removeEventListener('transitionend', fin); onDone(); };
    st.addEventListener('transitionend', fin);
    setTimeout(fin, 5600);
    const t0 = Date.now();
    let last = -1;
    const tick = setInterval(() => {
        if (done) return clearInterval(tick);
        const m = new DOMMatrix(getComputedStyle(st).transform);
        const idx = Math.floor((-m.m41 + w / 2) / STEP);
        if (idx !== last) { last = idx; haptic('selectionChanged'); }
        if (Date.now() - t0 > 5800) clearInterval(tick);
    }, 60);
}

/* ---------- открытие ---------- */
async function spin() {
    if (S.busy || !S.items.length) return;
    let won, r = {};
    if (S.demo) {
        won = S.items[Math.floor(Math.random() * S.items.length)];
        setBusy(true);
    } else {
        const price = S.cur === 'ton' ? S.priceTon : S.priceStars;
        const have = S.cur === 'ton' ? S.ton : S.stars;
        if (have < price) {
            haptic('notificationOccurred', 'error');
            toast(S.cur === 'ton' ? 'Недостаточно TON. Пополните баланс на главной.' : 'Недостаточно Stars. Пополните баланс на главной.');
            return;
        }
        setBusy(true);
        try { r = await api('/case/open', { case_id: CASE_ID, currency: S.cur }); }
        catch (e) { haptic('notificationOccurred', 'error'); toast(e.message); setBusy(false); loadBalances(); return; }
        won = r.nft;
    }
    const cells = [];
    for (let i = 0; i < TOTAL; i++) cells.push(i === WIN_INDEX ? cellNft(won, true) : filler());
    runStrip(cells, () => {
        if (!S.demo) applyBalances(r);
        haptic('notificationOccurred', 'success');
        showNft(won, S.demo);
    });
}

/* ---------- модалки ---------- */
function showOv(id) { const m = $(id); m.classList.add('show'); requestAnimationFrame(() => m.classList.add('vis')); }
function closeOv(id) { const m = $(id); m.classList.remove('vis'); setTimeout(() => m.classList.remove('show'), 250); }
function openSettings() { drawSettings(); showOv('ov-settings'); }
function openPrizes() { showOv('ov-prizes'); }
function drawSettings() {
    $('demo-sw').classList.toggle('on', S.demo);
    document.querySelectorAll('#seg div').forEach(d => d.classList.toggle('on', d.dataset.c === S.cur));
}
document.querySelectorAll('#seg div').forEach(d => d.onclick = () => {
    S.cur = d.dataset.c;
    try { localStorage.setItem('case_cur', S.cur); } catch (e) {}
    drawSettings(); drawSpinBtn(); haptic('impactOccurred', 'light');
});
function toggleDemo() { S.demo = !S.demo; drawSettings(); drawSpinBtn(); haptic('impactOccurred', 'light'); }

function closeWin() {
    closeOv('ov-win');
    setBusy(false);
    idleStrip();
}
let curNft = null;
function showNft(n, demo) {
    curNft = n;
    const price = Number(n.price_stars) || 0;
    $('win-box').innerHTML = demo ? `
        <div class="win-t it">Демо-выигрыш</div>
        <img class="win-img" src="${imgUrl(n.id)}" alt="" onerror="onImgErr(this)">
        <div class="win-name"><span>${esc(n.name || 'NFT')}</span><img src="img/star.png" alt=""><span class="p">${fmt(price)}</span></div>
        <div class="note">Приз не начислен: это демо-режим</div>
        <button class="mbtn" onclick="closeWin()">Продолжить</button>` : `
        <div class="win-t it">Вы выиграли!</div>
        <img class="win-img" src="${imgUrl(n.id)}" alt="" onerror="onImgErr(this)">
        <div class="win-name"><span>${esc(n.name || 'NFT')}</span><img src="img/star.png" alt=""><span class="p">${fmt(price)}</span></div>
        <button class="mbtn main" onclick="upgradeNft()">Улучшить <span class="tag2">шанс</span></button>
        <button class="mbtn" id="sell-btn" onclick="sellNft()">Продать за <img src="img/star.png" alt=""> ${fmt(price)}</button>
        <button class="mbtn" onclick="closeWin()">Продолжить</button>`;
    showOv('ov-win');
}
function upgradeNft() {
    if (!curNft) return;
    location.href = 'update.html?nft_id=' + encodeURIComponent(curNft.id) + '&v=' + Date.now();
}
async function sellNft() {
    if (!curNft) return;
    const b = $('sell-btn');
    b.disabled = true;
    try {
        const r = await api('/roulette/sell', { nft_id: curNft.id });
        applyBalances(r);
        haptic('notificationOccurred', 'success');
        toast('Продано!');
        closeWin();
    } catch (e) {
        haptic('notificationOccurred', 'error');
        toast(e.message);
        b.disabled = false;
    }
}

/* ---------- фон ---------- */
const canvas = $('stars-canvas'), ctx = canvas.getContext('2d');
let bubbles = [];
function initBubbles() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    bubbles = Array.from({ length: 30 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.2 + .6, speed: Math.random() * .35 + .1, drift: (Math.random() - .5) * .25, opacity: Math.random() * .45 + .15, bright: Math.random() < .4 }));
}
function animateBubbles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(s => {
        ctx.beginPath(); ctx.globalAlpha = s.opacity; ctx.fillStyle = s.bright ? '#fff' : '#9cc4ff';
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        s.y -= s.speed; s.x += s.drift;
        if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(animateBubbles);
}
initBubbles(); animateBubbles();
addEventListener('resize', initBubbles);

/* ---------- старт ---------- */
window.onload = async () => {
    try { tg.expand(); tg.ready(); tg.headerColor = '#1f55d6'; tg.backgroundColor = '#08205f'; } catch (e) {}
    try { tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = 'case.html'; }); } catch (e) {}
    $('case-title').innerText = META[CASE_ID] || 'Кейс';
    drawSettings(); drawSpinBtn();
    await Promise.allSettled([loadBalances(), loadCase()]);
    idleStrip();
    $('loader').classList.add('hidden');
};
setTimeout(() => $('loader').classList.add('hidden'), 4000);
</script>
