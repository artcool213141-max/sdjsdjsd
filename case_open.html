<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PandaGift - Открытие кейса</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');
:root{--bg-dark:#07173f;--blue:#2f6bff;--blue-light:#8fc2ff;--soft:#cfe0ff;--gold:#ffd24a;--glass:rgba(255,255,255,.1);--glass-line:rgba(255,255,255,.14);--panel:#1f1f21;--panel2:#2c2d30;--panel-line:rgba(255,255,255,.07);--muted:#8d8e93}
*{box-sizing:border-box}
body{background:var(--bg-dark);color:#fff;font-family:'Montserrat',sans-serif;margin:0;height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stars-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.main-wrapper{background:linear-gradient(180deg,#173f9c 0%,#1c4cc0 45%,#173f9c 100%);height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;padding-top:12px;padding-bottom:max(22px,env(safe-area-inset-bottom))}
.it{font-weight:900;font-style:italic;text-transform:uppercase}

/* балансы */
.chips{display:flex;justify-content:center;gap:12px;margin-top:6px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(10,24,70,.45);padding:6px 6px 6px 14px;border-radius:999px;font-weight:800;font-size:15px}
.chip img{width:20px;height:20px;object-fit:contain}
.chip .plus{width:28px;height:28px;border-radius:50%;border:none;background:#2f6bff;color:#fff;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}

/* рулетки */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow:hidden}
.rolls{display:flex;flex-direction:column;gap:8px}
.roll{position:relative;height:var(--rh);overflow:hidden}
.roll::before,.roll::after{content:'';position:absolute;top:0;bottom:0;width:50px;z-index:3;pointer-events:none}
.roll::before{left:0;background:linear-gradient(90deg,#1a45ad,transparent)}
.roll::after{right:0;background:linear-gradient(270deg,#1a45ad,transparent)}
.mk{display:none;position:absolute;left:50%;top:5px;bottom:5px;width:2px;margin-left:-1px;border-radius:2px;background:rgba(255,255,255,.5);z-index:4;pointer-events:none}
.rolls.multi .mk{display:block}
.strip{position:absolute;left:0;top:0;height:100%;display:flex;align-items:center;gap:8px;will-change:transform}
.cell{flex:0 0 var(--cw);height:var(--rh);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .3s}
.cell.win{transform:scale(1.06)}
.cell img.pic{width:var(--pic);height:var(--pic);object-fit:cover;border-radius:var(--rad);margin-bottom:calc(var(--ov) * -1);position:relative;z-index:1;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 18px rgba(0,15,80,.5)}
.pill{position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;background:rgba(30,60,140,.72);font-weight:800;font-size:15px;white-space:nowrap;backdrop-filter:blur(6px)}
.pill img{width:16px;height:16px;object-fit:contain}
.roll .pill{font-size:var(--pf);padding:var(--pp);gap:5px}
.roll .pill img{width:calc(var(--pf) + 1px);height:calc(var(--pf) + 1px)}
.rolls.nopill .roll .pill{display:none}
.mtile{width:var(--mt);height:var(--mt);margin:0 calc((var(--cw) - var(--mt)) / 2);flex-shrink:0;border-radius:calc(var(--mt) * .2);background:linear-gradient(160deg,#5b34c9,#2c1670);border:1px solid rgba(160,130,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:calc(var(--mt) * .14)}
.mtile img{width:calc(var(--mt) * .32);height:calc(var(--mt) * .32);object-fit:contain}

/* Стили для кастомной плитки звезды */
.star-drop-tile, .star-drop-tile-grid {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 22px;
    background: linear-gradient(160deg, #3c3c8c, #1e1e50);
    border: 1px solid rgba(255, 255, 255, 0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 8px 18px rgba(0, 15, 80, 0.4);
}
.star-drop-tile img, .star-drop-tile-grid img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}
.star-drop-tile span, .star-drop-tile-grid span {
    font-size: 16px;
    font-weight: 900;
    color: #fff;
}

/* кнопки */
.actions{padding:0 18px}
.cnt{display:flex;gap:8px;margin-bottom:12px}
.cnt button{flex:1;padding:11px 0;border:none;border-radius:12px;background:rgba(120,150,210,.28);color:#fff;font:800 15px 'Montserrat',sans-serif;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.cnt button:active{transform:scale(.95)}
.cnt button.on{background:#fff;color:#0d2a78}
.row{display:flex;gap:14px;margin-bottom:14px}
.sbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;background:rgba(120,150,210,.28);color:#fff;font:700 14px 'Montserrat',sans-serif;cursor:pointer}
.sbtn svg{width:18px;height:18px}
.sbtn:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:14px;padding:17px;background:#2f6bff;color:#fff;font:700 17px 'Montserrat',sans-serif;cursor:pointer;transition:transform .15s}
.btn img{width:22px;height:22px;object-fit:contain}
.btn:active{transform:scale(.97)}
.btn:disabled{background:rgba(10,24,70,.55);color:#9db6ee;transform:none}
.btn.demo{background:#1f9e68}
.btn.ton{margin-top:10px;background:#0098ea}
.btn.ton:disabled{background:rgba(10,24,70,.55);color:#9db6ee}
.skip{display:none;width:100%;border:none;border-radius:14px;padding:17px;background:rgba(120,150,210,.32);color:#fff;font:700 17px 'Montserrat',sans-serif;cursor:pointer}
.skip:active{transform:scale(.97)}
.actions.spinning .buy,.actions.spinning .cnt{display:none}
.actions.spinning{display:flex;flex-direction:column;justify-content:flex-end}
.actions.spinning .skip{display:block}

/* модалки */
.ov{position:fixed;inset:0;z-index:6000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(0,6,30,.78);backdrop-filter:blur(6px);opacity:0;transition:opacity .25s}
.ov.show{display:flex}
.ov.vis{opacity:1}
.box{position:relative;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;padding:22px 18px 18px;border-radius:28px;text-align:center;background:linear-gradient(180deg,#262628,#1b1b1d);border:1px solid var(--panel-line);box-shadow:0 20px 60px rgba(0,0,0,.6);transform:translateY(24px) scale(.94);transition:transform .3s cubic-bezier(.2,1.2,.4,1);scrollbar-width:none}
.box::-webkit-scrollbar{display:none}
.ov.vis .box{transform:none}
.box h2{margin:0 0 18px;font-size:21px;font-weight:800}
.x{position:absolute;right:14px;top:16px;width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:#8d8e93;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:20px;padding:18px;margin-top:12px;font:700 16px 'Montserrat',sans-serif;color:#fff;background:#4c4d51;cursor:pointer}
.mbtn:active{transform:scale(.97)}
.mbtn img{width:18px;height:18px;object-fit:contain}
.mbtn.main{background:#fff;color:#16161a}
.mbtn.main .tag2{background:var(--blue);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px}
.mbtn.ton{background:#0098ea}
.mbtn:disabled{opacity:.45;transform:none}

.set{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:16px 18px;border-radius:22px;background:var(--panel2)}
.set b{display:block;font-size:19px;font-weight:700}
.set small{display:block;margin-top:4px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.3}
.sw{position:relative;flex-shrink:0;width:60px;height:36px;border-radius:999px;background:#202022;cursor:pointer;transition:background .2s}
.sw::after{content:'';position:absolute;left:4px;top:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:#2f6bff}
.sw.on::after{transform:translateX(24px)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px}
.gi{display:flex;flex-direction:column;align-items:center}
.gi img.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:22px;display:block;margin-bottom:-22px;position:relative;z-index:1;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.gi .pill{background:#3a3b3f;font-size:14px;padding:9px 14px;width:100%;justify-content:center;border-radius:999px}
.gi .mt{width:100%;aspect-ratio:1;border-radius:26px;background:linear-gradient(160deg,#5b34c9,#2c1670);border:1px solid rgba(160,130,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:18px}
.gi .mt img{width:38px;height:38px;object-fit:contain}

.sub{font-size:13px;font-weight:600;color:var(--muted);margin:-8px 0 16px}
.pick{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 10px;margin-bottom:8px}
.pi{position:relative;width:calc((100% - 20px) / 3);display:flex;flex-direction:column;align-items:center;padding:8px 6px 8px;border-radius:22px;border:2px solid transparent;background:rgba(255,255,255,.04);cursor:pointer;transition:all .18s}
.pi img.pic{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;display:block}
.pi .pill{background:#3a3b3f;font-size:12px;padding:6px 10px;margin-top:-14px;gap:4px}
.pi .pill img{width:13px;height:13px}
.pi .nm{font-size:11px;font-weight:700;color:var(--muted);margin-top:6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi .ck{position:absolute;right:6px;top:6px;width:22px;height:22px;border-radius:50%;background:#fff;color:#16161a;display:none;align-items:center;justify-content:center;font-size:13px;font-weight:900;z-index:3}
.pi.sel{border-color:#fff;background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.16),0 0 22px rgba(255,255,255,.4);transform:scale(1.03)}
.pi.sel .ck{display:flex}
.pi.static{cursor:default}
.pi .mt2{width:100%;aspect-ratio:1;border-radius:18px;background:linear-gradient(160deg,#5b34c9,#2c1670);border:1px solid rgba(160,130,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:16px}
.pi .mt2 img{width:30px;height:30px;object-fit:contain}
.selall{background:none;border:none;color:#8fb6ff;font:700 14px 'Montserrat',sans-serif;cursor:pointer;padding:8px}

.win-t{font-size:24px;margin-bottom:12px}
.win-img{width:180px;height:180px;object-fit:cover;border-radius:34px;margin:0 auto 12px;display:block;box-shadow:0 12px 28px rgba(0,0,0,.5);animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win-money{width:170px;height:170px;margin:0 auto 14px;border-radius:34px;background:linear-gradient(160deg,#5b34c9,#2c1670);border:1px solid rgba(160,130,255,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:26px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.win-money img{width:60px;height:60px;object-fit:contain}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.win-name{font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.win-name img{width:20px;height:20px;object-fit:contain}
.win-name .p{color:var(--gold)}
.note{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}

.toast{position:fixed;left:50%;bottom:130px;transform:translate(-50%,20px);background:#1f1f21;border:1px solid var(--panel-line);font-weight:700;font-size:13px;padding:12px 18px;border-radius:18px;z-index:9000;opacity:0;pointer-events:none;transition:all .25s;max-width:88vw;text-align:center;word-break:break-word;display:flex;align-items:center;justify-content:center;gap:8px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast img{width:18px;height:18px;object-fit:contain;flex-shrink:0}

#loader{position:fixed;inset:0;background:var(--bg-dark);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#loader.hidden{opacity:0;pointer-events:none}
.ring{width:50px;height:50px;border:3px solid #12308a;border-left-color:var(--blue-light);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="loader"><div class="ring"></div><div class="it" style="margin-top:16px;color:#8fc2ff;letter-spacing:3px;font-size:14px">PandaGift</div></div>
<canvas id="stars-canvas"></canvas>

<div class="main-wrapper">

    <span id="case-title" hidden></span>

    <div class="chips">
        <div class="chip"><img src="img/star.png" alt="Stars"><span id="bal-stars">0</span><button class="plus" onclick="location.href='index.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="chip"><img src="img/ton.png" alt="TON"><span id="bal-ton">0</span><button class="plus" onclick="location.href='index.html'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <div class="chip"><img src="img/bambyk.png" alt="Бамбук"><span id="bal-bamboo">0</span></div>
    </div>

    <div class="stage" id="stage">
        <div class="rolls" id="rolls"></div>
    </div>

    <div class="actions" id="actions">
        <div class="cnt" id="cnt">
            <button data-n="1" class="on">1</button>
            <button data-n="2">2</button>
            <button data-n="3">3</button>
            <button data-n="4">4</button>
            <button data-n="5">5</button>
        </div>
        <div class="row">
            <div class="sbtn" onclick="openSettings()">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z"/></svg>Настройки
            </div>
            <div class="sbtn" onclick="openPrizes()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8h14v-8M12 8v12M12 8c-2-4-6-3-5 0M12 8c2-4 6-3 5 0"/></svg>Призы
            </div>
        </div>
        <div class="buy">
            <button class="btn" id="spin-btn" onclick="spin('stars')" disabled>
                <span id="spin-lbl">Крутить за</span><img id="spin-ico" src="img/star.png" alt=""><span id="spin-price">—</span>
            </button>
            <button class="btn ton" id="spin-ton-btn" onclick="spin('ton')" disabled>
                <span>Крутить за</span><img src="img/ton.png" alt=""><span id="spin-ton-price">—</span>
            </button>
        </div>
        <button class="skip" id="skip-btn" onclick="skip()">Пропустить</button>
    </div>
</div>

<div class="ov" id="ov-settings"><div class="box">
    <button class="x" onclick="closeOv('ov-settings')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>Настройки кейса</h2>
    <div class="set">
        <div><b>Демо</b><small>Все кейсы бесплатные, но призы не начисляются</small></div>
        <div class="sw" id="demo-sw" onclick="toggleDemo()"></div>
    </div>
    <button class="mbtn" onclick="closeOv('ov-settings')">Закрыть</button>
</div></div>

<div class="ov" id="ov-prizes"><div class="box">
    <button class="x" onclick="closeOv('ov-prizes')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2>Возможные призы</h2>
    <div class="grid" id="prizes"></div>
    <button class="mbtn" onclick="closeOv('ov-prizes')">Закрыть</button>
</div></div>

<div class="ov" id="ov-win"><div class="box" id="win-box"></div></div>
<div id="toast" class="toast"></div>

<script>
const tg = window.Telegram.WebApp;
const BACKEND_URL = 'https://sdjsdjsd.vercel.app';
const CUSTOM_STAR_URL = 'https://github.com/artcool213141-max/sdjsdjsd/raw/main/img/stars.png';
const $ = id => document.getElementById(id);
const GAP = 8, WIN_INDEX = 48, TOTAL = 60;
const META = { bear:'Bear', ring:'Ring', lip:'Lip', halloween:'Halloween', loot:'Loot', helmet:'Helmet', pepe:'Pepe', gorilla:'Gorilla Case' };

const CFG = {
    1: { cw: 148, pic: 136, rh: 196, rad: 30, ov: 24, pf: 15, pp: '9px 18px', mt: 172, pill: true  },
    2: { cw: 112, pic: 100, rh: 150, rad: 24, ov: 18, pf: 12, pp: '6px 12px', mt: 126, pill: true  },
    3: { cw: 84,  pic: 74,  rh: 104, rad: 20, ov: 14, pf: 11, pp: '4px 9px',  mt: 84,  pill: true  },
    4: { cw: 66,  pic: 58,  rh: 78,  rad: 16, ov: 0,  pf: 11, pp: '4px 9px',  mt: 58,  pill: false },
    5: { cw: 56,  pic: 50,  rh: 64,  rad: 14, ov: 0,  pf: 11, pp: '4px 9px',  mt: 48,  pill: false }
};

const CASE_ID = new URLSearchParams(location.search).get('id');
if (!CASE_ID || CASE_ID === 'free') location.replace(CASE_ID === 'free' ? 'event.html' : 'case.html');

const S = { items: [], priceStars: 0, priceTon: 0, busy: false, stars: 0, ton: 0, bamboo: 0, demo: false, count: 1 };
let L = { n: 1, cw: 148 };
let skipFn = null;

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function haptic(kind, type) { try { tg.HapticFeedback[kind](type); } catch (e) {} }

function showToast(text, icon) {
    const el = $('toast');
    el.innerHTML = (icon ? `<img src="${icon}" alt="">` : '') + `<span>${esc(String(text).slice(0, 160))}</span>`;
    el.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => el.classList.remove('show'), 3000);
}
function toast(t) { showToast(t); }

function fmt(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }

let catalogItemsCache = {};

// Функция генерации ссылки на картинку дропа (принудительно подставляет твою звезду для ID 61 и 62)
function imgUrl(id) {
    if (Number(id) === 61 || Number(id) === 62) {
        return CUSTOM_STAR_URL;
    }
    if (catalogItemsCache[id] && catalogItemsCache[id].image_url) {
        return catalogItemsCache[id].image_url;
    }
    return `${BACKEND_URL}/inventory/preview/${id}`;
}
    
function onImgErr(img) { 
    img.onerror = null; 
    if (!img.src.includes('stars.png')) {
        img.src = 'img/star.png'; 
    }
}

const isMoney = it => it && (it.kind === 'money' || (it.id == null && it.amount != null));
function curIcon(c) { return c === 'ton' ? 'img/ton.png' : 'img/star.png'; }
function valueOf(it) { return isMoney(it) ? (it.currency === 'ton' ? 0 : Number(it.amount) || 0) : (Number(it.price_stars) || 0); }
const r2 = n => Math.round(n * 100) / 100;

async function api(path, body) {
    const res = await fetch(BACKEND_URL + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tg.initData, ...(body || {}) })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.detail || data.error || ('HTTP ' + res.status));
    return data;
}

function applyBalances(d) {
    if (d.balance !== undefined) { S.stars = Number(d.balance) || 0; $('bal-stars').innerText = fmt(S.stars); }
    if (d.ton_balance !== undefined) { S.ton = Number(d.ton_balance) || 0; $('bal-ton').innerText = fmt(S.ton); }
    if (d.bamboo_balance !== undefined) { S.bamboo = Number(d.bamboo_balance) || 0; $('bal-bamboo').innerText = fmt(S.bamboo); }
}
const uid = (tg.initDataUnsafe?.user && tg.initDataUnsafe.user.id) ? tg.initDataUnsafe.user.id : '12345';
async function loadBalances() {
    try {
        const r = await fetch(`${BACKEND_URL}/get_balance/${uid}?t=${Date.now()}`);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        applyBalances(await r.json());
    } catch (e) { console.warn('balance', e); }
}
async function loadCase() {
    try {
        const d = await api('/case/info', { case_id: CASE_ID });
        S.items = (d.items || []).filter(x => x && (x.id != null || isMoney(x)));
        
        S.items.forEach(item => {
            if (item && item.id != null) {
                catalogItemsCache[item.id] = item;
            }
        });

        S.priceStars = Number(d.price_stars) || 0;
        S.priceTon = Number(d.price_ton) || Math.round(S.priceStars * 1.3) / 100;
        $('case-title').innerText = d.name || META[CASE_ID] || 'Кейс';
        drawPrizes();
    } catch (e) { toast('Кейс недоступен: ' + e.message); }
    drawSpinBtn();
}

function drawCnt() { document.querySelectorAll('#cnt button').forEach(b => b.classList.toggle('on', +b.dataset.n === S.count)); }
document.querySelectorAll('#cnt button').forEach(b => b.onclick = () => {
    if (S.busy || +b.dataset.n === S.count) return;
    S.count = +b.dataset.n;
    drawCnt(); idleRolls(); drawSpinBtn(); haptic('selectionChanged');
});
function drawSpinBtn() {
    const b = $('spin-btn'), tb = $('spin-ton-btn');
    b.disabled = S.busy || !S.items.length;
    tb.disabled = S.busy || !S.items.length;
    b.classList.toggle('demo', S.demo);
    tb.style.display = S.demo ? 'none' : '';
    $('spin-ton-price').innerText = S.items.length ? fmt(r2(S.priceTon * S.count)) : '—';
    if (S.demo) {
        $('spin-lbl').innerText = 'Крутить демо';
        $('spin-ico').style.display = 'none';
        $('spin-price').innerText = '';
    } else {
        $('spin-lbl').innerText = 'Крутить за';
        $('spin-ico').style.display = '';
        $('spin-price').innerText = S.items.length ? fmt(S.priceStars * S.count) : '—';
    }
}
function beginSpin() { S.busy = true; const a = $('actions'); a.style.minHeight = a.offsetHeight + 'px'; a.classList.add('spinning'); drawSpinBtn(); }
function endSpin() { S.busy = false; skipFn = null; const a = $('actions'); a.classList.remove('spinning'); a.style.minHeight = ''; idleRolls(); drawSpinBtn(); }
function skip() { if (skipFn) skipFn(); }

function sorted() { return S.items.slice().sort((a, b) => valueOf(b) - valueOf(a)); }

// Рендеринг призов в модалке (с поддержкой красивой плашки для кастомной звезды)
function drawPrizes() {
    $('prizes').innerHTML = sorted().map(it => {
        if (isMoney(it)) {
            return `<div class="gi"><div class="mt"><img src="${curIcon(it.currency)}" alt="">+${fmt(it.amount)}</div></div>`;
        }
        if (Number(it.id) === 61 || Number(it.id) === 62) {
            return `
            <div class="gi">
                <div class="star-drop-tile-grid">
                    <img src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">
                    <span>${fmt(it.price_stars)}</span>
                </div>
            </div>`;
        }
        return `
        <div class="gi">
            <img class="pic" src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">
            <div class="pill"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div>
        </div>`;
    }).join('');
}

// Рендеринг ячейки рулетки
function cellItem(it, win) {
    if (isMoney(it)) return `<div class="cell${win ? ' win' : ''}"><div class="mtile"><img src="${curIcon(it.currency)}" alt="">+${fmt(it.amount)}</div></div>`;
    
    if (Number(it.id) === 61 || Number(it.id) === 62) {
        return `<div class="cell${win ? ' win' : ''}">
            <div class="star-drop-tile">
                <img src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">
                <span>${fmt(it.price_stars)}</span>
            </div>
        </div>`;
    }

    return `<div class="cell${win ? ' win' : ''}"><img class="pic" src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)"><div class="pill"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div></div>`;
}

function filler() { const p = S.items; return cellItem(p[Math.floor(Math.random() * p.length)], false); }
function layoutRolls(n) {
    const C0 = CFG[n] || CFG[1];
    const R = $('rolls');
    const H = $('stage').clientHeight;
    const gap = n >= 4 ? 6 : 8;
    let f = H > 0 ? Math.min(1, (H - gap * (n - 1) - 6) / (n * C0.rh)) : 1;
    f = Math.max(f, 0.4);
    const sc = v => Math.round(v * f);
    const C = { cw: sc(C0.cw), pic: sc(C0.pic), rh: sc(C0.rh), rad: sc(C0.rad), ov: sc(C0.ov),
                pf: Math.max(9, Math.round(C0.pf * Math.max(f, 0.8))), pp: C0.pp, mt: sc(C0.mt), pill: C0.pill };
    R.style.gap = gap + 'px';
    R.className = 'rolls' + (n > 1 ? ' multi' : '') + (C.pill ? '' : ' nopill');
    R.style.setProperty('--cw', C.cw + 'px');
    R.style.setProperty('--pic', C.pic + 'px');
    R.style.setProperty('--rh', C.rh + 'px');
    R.style.setProperty('--rad', C.rad + 'px');
    R.style.setProperty('--ov', (C.pill ? C.ov : 0) + 'px');
    R.style.setProperty('--pf', C.pf + 'px');
    R.style.setProperty('--pp', C.pp);
    R.style.setProperty('--mt', C.mt + 'px');
    R.innerHTML = Array.from({ length: n }, () => '<div class="roll"><div class="mk"></div><div class="strip"></div></div>').join('');
    L = { n, cw: C.cw };
    return [...R.querySelectorAll('.strip')];
}
function placeStrip(st, html) {
    st.style.transition = 'none';
    st.innerHTML = html;
    st.style.transform = 'translateX(0)';
    void st.offsetWidth;
}
function idleRolls() {
    const strips = layoutRolls(S.count);
    if (!S.items.length) return;
    const list = sorted();
    const STEP = L.cw + GAP;
    const w = $('rolls').clientWidth;
    strips.forEach((st, k) => {
        let html = '';
        for (let i = 0; i < 14; i++) html += cellItem(list[(i + k * 2) % list.length], false);
        placeStrip(st, html);
        st.style.transform = `translateX(${Math.round(w / 2 - L.cw / 2 - STEP * 3)}px)`;
    });
}

function runRolls(wons, onDone) {
    const strips = layoutRolls(wons.length);
    const STEP = L.cw + GAP;
    const w = $('rolls').clientWidth;
    const finals = [];
    strips.forEach((st, i) => {
        const cells = [];
        for (let k = 0; k < TOTAL; k++) cells.push(k === WIN_INDEX ? cellItem(wons[i], true) : filler());
        placeStrip(st, cells.join(''));
        const jitter = Math.round((Math.random() - 0.5) * (L.cw * 0.6));
        finals.push(Math.round(WIN_INDEX * STEP + L.cw / 2 - w / 2 + jitter));
    });
    requestAnimationFrame(() => strips.forEach((st, i) => {
        st.style.transition = `transform ${(5.2 + i * 0.3).toFixed(1)}s cubic-bezier(.08,.6,.12,1)`;
        st.style.transform = `translateX(${-finals[i]}px)`;
    }));
    let done = false;
    const fin = () => { if (done) return; done = true; skipFn = null; onDone(); };
    skipFn = () => {
        strips.forEach((st, i) => { st.style.transition = 'none'; st.style.transform = `translateX(${-finals[i]}px)`; });
        haptic('impactOccurred', 'light');
        fin();
    };
    setTimeout(fin, (5.2 + (wons.length - 1) * 0.3) * 1000 + 450);
    const t0 = Date.now();
    let lastTick = -1;
    const tick = setInterval(() => {
        if (done || Date.now() - t0 > 7500) return clearInterval(tick);
        const m = new DOMMatrix(getComputedStyle(strips[0]).transform);
        const idx = Math.floor((-m.m41 + w / 2) / STEP);
        if (idx !== lastTick) { lastTick = idx; haptic('selectionChanged'); }
    }, 60);
}

async function spin(cur) {
    cur = cur === 'ton' ? 'ton' : 'stars';
    if (S.busy || !S.items.length) return;
    const n = S.count;
    let wons = [], r = {};
    if (S.demo) {
        for (let i = 0; i < n; i++) wons.push(S.items[Math.floor(Math.random() * S.items.length)]);
        beginSpin();
    } else {
        const price = cur === 'ton' ? r2(S.priceTon * n) : S.priceStars * n;
        const have = cur === 'ton' ? S.ton : S.stars;
        if (have < price) {
            haptic('notificationOccurred', 'error');
            toast(cur === 'ton' ? 'Недостаточно TON.' : 'Недостаточно Stars.');
            return;
        }
        beginSpin();
        try { r = await api('/case/open', { case_id: CASE_ID, currency: cur, count: n }); }
        catch (e) { haptic('notificationOccurred', 'error'); toast(e.message); endSpin(); loadBalances(); return; }
        wons = (r.nfts && r.nfts.length) ? r.nfts : [r.nft];
        if (wons.length < n) toast(`Открыто ${wons.length} из ${n}`);
    }
    runRolls(wons, () => {
        if (!S.demo) {
            applyBalances(r);
            if (r.bamboo > 0) showToast(`Вы получили ${r.bamboo} бамбука`, 'img/bambyk.png');
        }
        haptic('notificationOccurred', 'success');
        if (wons.length === 1) showWin(wons[0], S.demo); else showPick(wons, S.demo);
    });
}

function showOv(id) { const m = $(id); m.classList.add('show'); requestAnimationFrame(() => m.classList.add('vis')); }
function closeOv(id) { const m = $(id); m.classList.remove('vis'); setTimeout(() => m.classList.remove('show'), 250); }
function openSettings() { drawSettings(); showOv('ov-settings'); }
function openPrizes() { showOv('ov-prizes'); }
function drawSettings() { $('demo-sw').classList.toggle('on', S.demo); }
function toggleDemo() { if (S.busy) return; S.demo = !S.demo; drawSettings(); drawSpinBtn(); haptic('impactOccurred', 'light'); }
function closeWin() { closeOv('ov-win'); endSpin(); }

let curNft = null;
function showWin(n, demo) {
    if (isMoney(n)) {
        $('win-box').innerHTML = `
            <div class="win-t it">${demo ? 'Демо-выигрыш' : 'Вы выиграли!'}</div>
            <div class="win-money"><img src="${curIcon(n.currency)}" alt="">+${fmt(n.amount)}</div>
            <div class="note">${demo ? 'Приз не начислен' : 'Зачислено на баланс'}</div>
            <button class="mbtn" onclick="closeWin()">Продолжить</button>`;
        showOv('ov-win');
        return;
    }
    curNft = n;
    const price = Number(n.price_stars) || 0;
    const priceTon = Number(n.price_ton) || 0;
    $('win-box').innerHTML = demo ? `
        <div class="win-t it">Демо-выигрыш</div>
        <img class="win-img" src="${imgUrl(n.id)}" alt="" onerror="onImgErr(this)">
        <div class="win-name"><span>${esc(n.name || 'NFT')}</span><img src="img/star.png" alt=""><span class="p">${fmt(price)}</span></div>
        <button class="mbtn" onclick="closeWin()">Продолжить</button>` : `
        <div class="win-t it">Вы выиграли!</div>
        <img class="win-img" src="${imgUrl(n.id)}" alt="" onerror="onImgErr(this)">
        <div class="win-name"><span>${esc(n.name || 'NFT')}</span><img src="img/star.png" alt=""><span class="p">${fmt(price)}</span></div>
        <button class="mbtn main" onclick="upgradeNft()">Улучшить <span class="tag2">шанс</span></button>
        <button class="mbtn" id="sell-btn" onclick="sellNft('stars')">Продать за <img src="img/star.png" alt=""> ${fmt(price)}</button>
        ${priceTon > 0 ? `<button class="mbtn ton" id="sell-ton-btn" onclick="sellNft('ton')">Продать за <img src="img/ton.png" alt=""> ${fmt(priceTon)}</button>` : ''}
        <button class="mbtn" onclick="closeWin()">Продолжить</button>`;
    showOv('ov-win');
}
function upgradeNft() {
    if (!curNft) return;
    location.href = 'update.html?nft_id=' + encodeURIComponent(curNft.id) + '&v=' + Date.now();
}
async function sellNft(cur) {
    if (!curNft) return;
    const btns = ['sell-btn', 'sell-ton-btn'].map($).filter(Boolean);
    btns.forEach(x => x.disabled = true);
    try {
        const r = cur === 'ton'
            ? await api('/case/sell_ton', { nft_id: curNft.id })
            : await api('/roulette/sell', { nft_id: curNft.id });
        applyBalances(r);
        haptic('notificationOccurred', 'success');
        toast('Продано!');
        closeWin();
    } catch (e) {
        haptic('notificationOccurred', 'error');
        toast(e.message);
        btns.forEach(x => x.disabled = false);
    }
}

const P = { list: [], sel: new Set(), demo: false, busy: false };
function showPick(list, demo) {
    P.list = list.slice(); P.sel = new Set(); P.demo = demo; P.busy = false;
    drawPick();
    showOv('ov-win');
}
function selectable() { return P.list.map((it, i) => isMoney(it) ? -1 : i).filter(i => i >= 0); }
function togglePick(i) {
    if (P.demo || P.busy || isMoney(P.list[i])) return;
    P.sel.has(i) ? P.sel.delete(i) : P.sel.add(i);
    haptic('selectionChanged');
    drawPick();
}
function toggleAll() {
    if (P.demo || P.busy) return;
    const all = selectable();
    P.sel = P.sel.size === all.length ? new Set() : new Set(all);
    haptic('selectionChanged');
    drawPick();
}
function drawPick() {
    const sel = [...P.sel];
    const sumS = sel.reduce((a, i) => a + (Number(P.list[i].price_stars) || 0), 0);
    const sumT = r2(sel.reduce((a, i) => a + (Number(P.list[i].price_ton) || 0), 0));
    const canTon = sel.length > 0 && sel.every(i => Number(P.list[i].price_ton) > 0);
    const allSel = selectable().length > 0 && P.sel.size === selectable().length;
    const cards = P.list.map((it, i) => isMoney(it) ? `
        <div class="pi static"><div class="mt2"><img src="${curIcon(it.currency)}" alt="">+${fmt(it.amount)}</div><div class="nm">Зачислено</div></div>` : `
        <div class="pi${P.sel.has(i) ? ' sel' : ''}" onclick="togglePick(${i})">
            <div class="ck"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
            <img class="pic" src="${imgUrl(it.id)}" alt="" onerror="onImgErr(this)">
            <div class="pill"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div>
            <div class="nm">${esc(it.name || 'NFT')}</div>
        </div>`).join('');
    $('win-box').innerHTML = P.demo ? `
        <div class="win-t it">Демо-выигрыш</div>
        <div class="sub">Призы не начислены</div>
        <div class="pick">${cards}</div>
        <button class="mbtn" onclick="closeWin()">Продолжить</button>` : `
        <div class="win-t it">Вы выиграли!</div>
        <div class="sub">Нажми на подарки для продажи</div>
        <div class="pick">${cards}</div>
        <button class="selall" onclick="toggleAll()">${allSel ? 'Снять выбор' : 'Выбрать все'}</button>
        <button class="mbtn main" ${sel.length && !P.busy ? '' : 'disabled'} onclick="sellPick('stars')">${sel.length ? `Продать за <img src="img/star.png" alt=""> ${fmt(sumS)}` : 'Выбери подарки'}</button>
        ${canTon ? `<button class="mbtn ton" ${P.busy ? 'disabled' : ''} onclick="sellPick('ton')">Продать за <img src="img/ton.png" alt=""> ${fmt(sumT)}</button>` : ''}
        <button class="mbtn" ${P.busy ? 'disabled' : ''} onclick="closeWin()">Продолжить</button>`;
}
async function sellPick(cur) {
    if (P.busy || P.demo || !P.sel.size) return;
    P.busy = true; drawPick();
    const idx = [...P.sel].sort((a, b) => a - b);
    const sold = []; let last = null, err = null;
    for (const i of idx) {
        try {
            last = cur === 'ton'
                ? await api('/case/sell_ton', { nft_id: P.list[i].id })
                : await api('/roulette/sell', { nft_id: P.list[i].id });
            sold.push(i);
        } catch (e) { err = e.message; break; }
    }
    if (last) applyBalances(last);
    P.list = P.list.filter((_, i) => !sold.includes(i));
    P.sel = new Set(); P.busy = false;
    if (sold.length) { haptic('notificationOccurred', 'success'); toast('Продано: ' + sold.length); }
    if (err) { haptic('notificationOccurred', 'error'); toast(err); }
    if (!selectable().length) closeWin(); else drawPick();
}

const canvas = $('stars-canvas'), ctx = canvas.getContext('2d');
let bubbles = [];
function initBubbles() {
    canvas.width = innerWidth; canvas.height = innerHeight;
    bubbles = Array.from({ length: 30 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2.2 + .6, speed: Math.random() * .35 + .1, drift: (Math.random() - .5) * .25, opacity: Math.random() * .45 + .15, bright: Math.random() < .4 }));
}
function animateBubbles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(s => {
        ctx.beginPath(); ctx.globalAlpha = s.opacity; ctx.fillStyle = s.bright ? '#fff' : '#9cc4ff';
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill();
        s.y -= s.speed; s.x += s.drift;
        if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(animateBubbles);
}
initBubbles(); animateBubbles();
addEventListener('resize', initBubbles);

window.onload = async () => {
    try { tg.expand(); tg.ready(); tg.headerColor = '#173f9c'; tg.backgroundColor = '#173f9c'; } catch (e) {}
    try { tg.BackButton.show(); tg.BackButton.onClick(() => { location.href = 'case.html'; }); } catch (e) {}
    $('case-title').innerText = META[CASE_ID] || 'Кейс';
    drawSettings(); drawCnt(); drawSpinBtn();
    await Promise.allSettled([loadBalances(), loadCase()]);
    idleRolls();
    $('loader').classList.add('hidden');
};
setTimeout(() => $('loader').classList.add('hidden'), 4000);
</script>
