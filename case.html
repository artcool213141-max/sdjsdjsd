<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PandaGift — Кейсы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-dark: #07173f;
            --blue: #2f6bff;
            --blue-light: #8fc2ff;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-line: rgba(255, 255, 255, 0.18);
        }
        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #stars-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .main-wrapper {
            background:
                radial-gradient(circle at 50% 8%, #4a86ff 0%, rgba(47,107,255,0.35) 26%, transparent 60%),
                linear-gradient(180deg, #1f55d6 0%, #133ea6 42%, #08205f 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .scrollable-content {
            position: relative; z-index: 1; flex: 1; overflow-y: auto;
            padding: 20px 18px 120px 18px; scrollbar-width: none;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        /* шапка */
        .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
            background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); cursor: pointer;
        }
        .back-btn:active { transform: scale(0.94); }
        .page-title { font-size: 30px; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -0.5px; text-shadow: 0 4px 18px rgba(0, 20, 100, 0.55); }
        .page-title span { color: var(--blue-light); }

        .balances { display: flex; flex-direction: column; gap: 4px; }
        .bal-pill {
            display: flex; align-items: center; gap: 6px; min-width: 96px; padding: 3px 10px 3px 6px;
            border-radius: 999px; background: var(--glass); border: 1px solid #000; backdrop-filter: blur(10px);
        }
        .bal-pill img { width: 16px; height: 16px; object-fit: contain; }
        .bal-pill span { font-weight: 900; font-size: 12px; }

        /* бесплатный кейс */
        .free-card {
            position: relative; overflow: hidden; display: flex; align-items: center; gap: 14px;
            padding: 14px 16px; margin-bottom: 18px; border-radius: 24px; cursor: pointer;
            background: linear-gradient(135deg, #5b94ff 0%, #2456e6 100%);
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 8px 24px rgba(5, 25, 100, 0.5), inset 0 1px 0 rgba(255,255,255,0.35);
            transition: transform 0.2s;
        }
        .free-card:active { transform: scale(0.97); }
        .free-card img.ico { width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0, 20, 90, 0.5)); animation: bounce 2.4s ease-in-out infinite; }
        .free-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 17px; line-height: 1; }
        .free-desc { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #e3eeff; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
        .free-desc img { width: 13px; height: 13px; object-fit: contain; }
        .free-dot { margin-left: auto; width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: ping 1.4s cubic-bezier(0,0,.2,1) infinite; }

        .section-label { font-size: 11px; font-weight: 900; font-style: italic; text-transform: uppercase; color: #cfe0ff; letter-spacing: 1px; margin: 0 4px 10px; }

        /* сетка кейсов */
        .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .case-card {
            position: relative; padding: 12px 12px 12px; border-radius: 24px; cursor: pointer; overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.06) 100%);
            border: 1px solid var(--glass-line); backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
            animation: cardIn 0.45s ease both;
        }
        .case-card:active { transform: scale(0.96); border-color: #fff; background: rgba(255,255,255,0.24); }
        .case-img-box { position: relative; height: 104px; display: flex; align-items: center; justify-content: center; }
        .case-img-box::before {
            content: ''; position: absolute; width: 96px; height: 96px; border-radius: 50%;
            background: radial-gradient(circle, rgba(190,220,255,0.4) 0%, transparent 70%);
        }
        .case-img-box img { position: relative; max-width: 100%; max-height: 100px; object-fit: contain; filter: drop-shadow(0 6px 8px rgba(0, 20, 90, 0.45)); }
        .limit-badge {
            position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); z-index: 2;
            padding: 2px 9px; border-radius: 999px; font-size: 9px; font-weight: 800;
            background: linear-gradient(180deg, #ff6b6b, #c81e3a); border: 1px solid rgba(255,255,255,0.4); white-space: nowrap;
        }
        .case-card.wide .limit-badge { bottom: -12px; }
        .case-card.wide { grid-column: span 2; }
        .case-card.wide .case-img-box { height: 120px; }
        .case-foot { display: flex; flex-direction: column; align-items: flex-start; margin-top: 8px; gap: 4px; }
        .case-prices { display: flex; align-items: center; gap: 10px; }
        .case-price.ton { color: #8fc2ff; }
        .case-name { font-weight: 900; font-size: 14px; font-style: italic; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; padding-left: 2px; }
        .case-price { display: flex; align-items: center; gap: 3px; font-weight: 900; font-size: 13px; color: #ffd45e; flex-shrink: 0; }
        .case-price img { width: 14px; height: 14px; object-fit: contain; }

        /* ===== РУССКАЯ РУЛЕТКА ===== */
        .rr-section { margin-top: 26px; }
        .rr-head {
            position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px;
            padding: 14px 16px; margin-bottom: 12px; border-radius: 24px;
            background: linear-gradient(135deg, rgba(255, 90, 110, 0.55) 0%, rgba(120, 20, 60, 0.7) 100%);
            border: 1px solid rgba(255,255,255,0.28);
            box-shadow: 0 8px 24px rgba(40, 5, 40, 0.45), inset 0 1px 0 rgba(255,255,255,0.25);
        }
        .rr-head-ico {
            width: 44px; height: 44px; border-radius: 16px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.16); border: 1px solid rgba(255,255,255,0.3);
        }
        .rr-head-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 18px; line-height: 1; padding-right: 4px; }
        .rr-head-desc { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #ffd9de; margin-top: 6px; letter-spacing: 0.4px; }
        .rr-card { cursor: pointer; }
        .rr-card .case-img-box { height: 96px; }
        .rr-card .case-img-box img { max-height: 92px; max-width: 92px; border-radius: 14px; }

        .rr-modal {
            position: fixed; inset: 0; z-index: 2000; display: flex; flex-direction: column;
            padding: 20px 20px 30px; overflow-y: auto;
            background: linear-gradient(180deg, #1a3fa0 0%, #0a2262 60%, #061748 100%);
            visibility: hidden; opacity: 0; transform: scale(0.97); pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0s linear 0.25s;
        }
        .rr-modal.open { visibility: visible; opacity: 1; transform: scale(1); pointer-events: auto; transition: opacity 0.25s ease, transform 0.25s ease; }
        .rr-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
        .rr-view { display: none; flex-direction: column; align-items: center; }
        .rr-view.show { display: flex; }
        .rr-big-img { width: 190px; height: 190px; object-fit: contain; border-radius: 28px; filter: drop-shadow(0 10px 22px rgba(0, 20, 90, 0.6)); }
        .rr-name { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 22px; margin-top: 12px; text-align: center; padding-right: 4px; }
        .rr-row { display: flex; align-items: center; gap: 6px; }
        .rr-row img { width: 16px; height: 16px; object-fit: contain; }
        .rr-muted { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #b9d0ff; }
        .rr-chance { font-size: 56px; font-weight: 900; font-style: italic; color: #fff; line-height: 1; padding-right: 6px; text-shadow: 0 4px 18px rgba(0, 20, 100, 0.6); }
        .rr-panel {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; border-radius: 20px;
            background: var(--glass); border: 1px solid var(--glass-line);
        }
        input[type="range"].rr-slider {
            -webkit-appearance: none; appearance: none; width: 100%; height: 8px; border-radius: 999px;
            background: rgba(255,255,255,0.22); outline: none;
        }
        input[type="range"].rr-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%;
            background: #fff; border: 4px solid var(--blue); box-shadow: 0 0 14px rgba(120, 170, 255, 0.8); cursor: pointer;
        }
        input[type="range"].rr-slider::-moz-range-thumb {
            width: 28px; height: 28px; border-radius: 50%;
            background: #fff; border: 4px solid var(--blue); box-shadow: 0 0 14px rgba(120, 170, 255, 0.8); cursor: pointer;
        }
        .rr-btn {
            width: 100%; padding: 16px; border-radius: 22px; font-weight: 900; font-style: italic;
            text-transform: uppercase; font-size: 15px; color: #fff; cursor: pointer; border: 1px solid rgba(255,255,255,0.4);
            background: linear-gradient(145deg, #5b94ff, #1d4ed8);
            box-shadow: 0 8px 20px rgba(5, 25, 100, 0.55), inset 0 1px 0 rgba(255,255,255,0.35);
            transition: transform 0.15s;
        }
        .rr-btn:active { transform: scale(0.96); }
        .rr-btn.ghost { background: var(--glass); box-shadow: none; font-size: 12px; }
        .rr-btn[disabled] { opacity: 0.6; }

        .rr-tape-box {
            position: relative; width: 100%; height: 150px; overflow: hidden; margin: 18px 0 6px;
            border-radius: 22px; background: rgba(4, 16, 60, 0.55); border: 1px solid var(--glass-line);
        }
        .rr-tape-box::before, .rr-tape-box::after { content: ''; position: absolute; top: 0; width: 22%; height: 100%; z-index: 5; pointer-events: none; }
        .rr-tape-box::before { left: 0; background: linear-gradient(to right, #0b2570 5%, transparent); }
        .rr-tape-box::after { right: 0; background: linear-gradient(to left, #0b2570 5%, transparent); }
        .rr-pointer { position: absolute; left: 50%; top: 0; width: 3px; height: 100%; background: #fff; z-index: 6; transform: translateX(-50%); box-shadow: 0 0 14px #fff; }
        .rr-rail { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: center; will-change: transform; }
        .rr-tile {
            width: 120px; height: 120px; margin: 0 10px; flex-shrink: 0; border-radius: 22px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
        }
        .rr-tile img { width: 84px; height: 84px; object-fit: contain; border-radius: 12px; }
        .rr-tile svg { width: 40px; height: 40px; opacity: 0.35; }
        .rr-result-title { font-size: 34px; font-weight: 900; font-style: italic; text-transform: uppercase; padding-right: 6px; }
        .rr-fee { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #9fbcf5; text-align: center; margin-top: 10px; }

        .toast-box {
            position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
            background: rgba(0,0,0,0.85); color: #fff; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; font-weight: 700; z-index: 99999; opacity: 0; pointer-events: none; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 8px;
        }
        .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast-box img { width: 18px; height: 18px; object-fit: contain; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        @keyframes ping { 75%, 100% { transform: scale(2.2); opacity: 0; } }

        /* тулбар */
        .dock-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(8, 28, 92, 0.92); border-top: 1px solid var(--glass-line); display: flex; justify-content: space-around; padding: 12px 10px 34px 10px; z-index: 1000; backdrop-filter: blur(25px); height: 95px; }
        .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8fb0f0; flex: 1; }
        .dock-btn.active { color: #fff; }
        .dock-center { color: #e3eeff; }
        .dock-center .ico {
            width: 54px; height: 54px; margin: -13px 0; transform: translateY(-16px); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #5b94ff, #1d4ed8); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 16px rgba(5, 25, 100, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
    </style>
</head>
<body>

    <canvas id="stars-canvas"></canvas>

    <div class="main-wrapper">
        <div class="scrollable-content">

            <!-- ШАПКА -->
            <div class="top-row">
                <div class="back-btn" onclick="location.href='index.html'">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
                </div>
                <div class="page-title">Кей<span>сы</span></div>
                <div class="balances">
                    <div class="bal-pill"><img src="img/star.png" alt="STAR"><span id="bal-stars">0.00</span></div>
                    <div class="bal-pill"><img src="img/ton.png" alt="TON"><span id="bal-ton">0.00</span></div>
                    <div class="bal-pill"><img src="img/bambyk.png" alt="BAMBOO"><span id="bal-bamboo">0</span></div>
                </div>
            </div>

            <!-- БЕСПЛАТНЫЙ КЕЙС -->
            <div class="free-card" onclick="openCase('free')">
                <img class="ico" src="img/bonus.png" alt="Бесплатный кейс">
                <div>
                    <div class="free-title">Бесплатный кейс</div>
                    <div class="free-desc">Раз в 24 часа · 0–10 <img src="img/bambyk.png" alt=""></div>
                </div>
                <div class="free-dot"></div>
            </div>

            <div class="section-label">Платные кейсы</div>
            <div class="cases-grid" id="cases-grid"></div>

            <!-- РУССКАЯ РУЛЕТКА -->
            <div class="rr-section">
                <div class="rr-head">
                    <div class="rr-head-ico">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="9"></circle>
                            <circle cx="12" cy="12" r="2.2"></circle>
                            <circle cx="12" cy="6.6" r="1.1"></circle>
                            <circle cx="16.7" cy="9.3" r="1.1"></circle>
                            <circle cx="16.7" cy="14.7" r="1.1"></circle>
                            <circle cx="12" cy="17.4" r="1.1"></circle>
                            <circle cx="7.3" cy="14.7" r="1.1"></circle>
                            <circle cx="7.3" cy="9.3" r="1.1"></circle>
                        </svg>
                    </div>
                    <div>
                        <div class="rr-head-title">Русская рулетка</div>
                        <div class="rr-head-desc">Выбери шанс — цена считается сама</div>
                    </div>
                </div>
                <div class="cases-grid" id="rr-grid"></div>
            </div>
        </div>

        <!-- ТУЛБАР -->
        <div class="dock-bar">
            <div onclick="location.href='index.html'" class="dock-btn">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-black uppercase italic">Главная</span>
            </div>
            <div onclick="location.href='ref.html'" class="dock-btn dock-center">
                <div class="ico">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="4.5" cy="9.5" r="2.2"></circle><circle cx="19.5" cy="9.5" r="2.2"></circle><path d="M1 18c0-2 1.3-3.5 3.5-3.7"></path><path d="M23 18c0-2-1.3-3.5-3.5-3.7"></path></svg>
                </div>
                <span class="text-[10px] font-black uppercase italic">Рефералы</span>
            </div>
            <div onclick="location.href='profile.html'" class="dock-btn">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-black uppercase italic">Профиль</span>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РУЛЕТКИ -->
    <div id="rr-modal" class="rr-modal">
        <div class="rr-top">
            <div class="back-btn" onclick="closeRR()">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7"></path></svg>
            </div>
            <div class="rr-muted">Русская рулетка</div>
            <div class="bal-pill"><img src="img/star.png" alt="STAR"><span id="rr-bal">0</span></div>
        </div>

        <!-- настройка -->
        <div id="rr-setup" class="rr-view show">
            <img id="rr-img" class="rr-big-img" src="img/star.png" alt="">
            <div id="rr-title" class="rr-name"></div>
            <div class="rr-row" style="margin:8px 0 22px">
                <span class="rr-muted">Цена приза</span>
                <img src="img/star.png" alt="">
                <span id="rr-prize" class="font-black text-sm" style="color:#ffd45e"></span>
            </div>

            <div class="rr-muted">Твой шанс на победу</div>
            <div id="rr-chance" class="rr-chance" style="margin:8px 0 16px">50%</div>
            <input id="rr-slider" class="rr-slider" type="range" min="5" max="95" value="50" step="1" oninput="updateRR()">
            <div class="flex justify-between w-full" style="margin-top:8px">
                <span class="rr-muted" style="font-size:9px">5% — дёшево</span>
                <span class="rr-muted" style="font-size:9px">95% — дорого</span>
            </div>

            <div class="rr-panel" style="margin:22px 0 14px">
                <span class="rr-muted">Цена прокрута</span>
                <div class="rr-row">
                    <img src="img/star.png" alt="" style="width:20px;height:20px">
                    <span id="rr-cost" class="font-black text-lg">0</span>
                </div>
            </div>
            <button id="rr-go" class="rr-btn" onclick="spinRR()">Крутить</button>
            <div id="rr-fee" class="rr-fee"></div>
        </div>

        <!-- прокрутка -->
        <div id="rr-spin" class="rr-view">
            <div id="rr-spin-title" class="rr-name" style="margin-top:20px"></div>
            <div class="rr-tape-box">
                <div class="rr-pointer"></div>
                <div class="rr-rail" id="rr-rail"></div>
            </div>
            <button class="rr-btn ghost" style="width:auto;padding:10px 28px;margin-top:22px" onclick="skipRR()">
                Пропустить
                <svg style="display:inline-block;vertical-align:-2px;margin-left:4px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l7 7-7 7"></path><path d="M13 5l7 7-7 7"></path></svg>
            </button>
        </div>

        <!-- результат -->
        <div id="rr-result" class="rr-view" style="margin-top:50px;gap:16px">
            <img id="rr-res-img" class="rr-big-img" style="width:150px;height:150px" src="img/star.png" alt="">
            <div id="rr-res-lose" style="display:none">
                <svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#ff8a9a" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M15 9l-6 6M9 9l6 6"></path></svg>
            </div>
            <div id="rr-res-text" class="rr-result-title"></div>
            <div id="rr-res-sub" class="rr-muted" style="text-align:center;line-height:1.6"></div>
            <button class="rr-btn" style="margin-top:14px" onclick="backToSetup()">Ещё раз</button>
            <button class="rr-btn ghost" onclick="closeRR()">Закрыть</button>
        </div>
    </div>

    <div id="toast" class="toast-box"></div>

<script src="music.js"></script>
<script>
const tg = window.Telegram.WebApp;
const BACKEND_URL = 'https://sdjsdjsd.vercel.app';

try { tg.expand(); tg.ready(); tg.headerColor = '#1f55d6'; tg.backgroundColor = '#08205f'; } catch (e) {}

// кнопка «назад» Telegram -> главная (внутри рулетки — закрывает рулетку)
try {
    tg.BackButton.show();
    tg.BackButton.onClick(() => {
        if (document.getElementById('rr-modal').classList.contains('open')) { closeRR(); return; }
        location.href = 'index.html';
    });
} catch (e) {}

const tgUser = tg.initDataUnsafe?.user;
const user = (tgUser && tgUser.id) ? tgUser : { id: '12345', username: 'TestUser', first_name: 'Тестер' };

const CASES = [
    { id: 'bear',     name: 'Bear',     price: 149,   img: 'bear.png' },
    { id: 'ring',     name: 'Ring',     price: 199,   img: 'colso.png',     limit: true },
    { id: 'lip',      name: 'Lip',      price: 249,   img: 'gyba.png' },
    { id: 'halloween', name: 'Halloween', price: 299,   img: 'ev_pumpkin.png', limit: true },
    { id: 'loot',     name: 'Loot',     price: 499,   img: 'statyyetka.png',     limit: true },
    { id: 'helmet',   name: 'Helmet',   price: 1499, img: 'helmet.png' },
    { id: 'pepe',     name: 'Pepe',     price: 2999, img: 'pepe.png' }
];
const toTon = stars => (stars * 1.3 / 100).toFixed(2);
const fmt = n => Number(n).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);

function showToast(text, icon) {
    const t = $('toast');
    t.innerHTML = (icon ? `<img src="${icon}" alt="">` : '') + `<span>${esc(text)}</span>`;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function renderCases() {
    const grid = $('cases-grid');
    grid.innerHTML = CASES.map((c, i) => `
        <div class="case-card${i === CASES.length - 1 ? ' wide' : ''}" style="animation-delay:${i * 40}ms" onclick="openCase('${c.id}')">
            <div class="case-img-box">
                <img src="img/${c.img}" alt="${c.name}" onerror="this.onerror=null;this.src='img/bonus.png'">
                ${c.limit ? '<div class="limit-badge">Лимит</div>' : ''}
            </div>
            <div class="case-foot">
                <div class="case-name">${c.name}</div>
                <div class="case-prices">
                    <div class="case-price"><img src="img/star.png" alt="">${fmt(c.price)}</div>
                    <div class="case-price ton"><img src="img/ton.png" alt="">${fmt(toTon(c.price))}</div>
                </div>
            </div>
        </div>
    `).join('');
}
renderCases();

function openCase(id) {
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    location.href = 'case_open.html?id=' + encodeURIComponent(id) + '&v=' + Date.now();
}

let starsBalance = 0;
function setStars(v) {
    starsBalance = Number(v) || 0;
    $('bal-stars').innerText = starsBalance.toFixed(2);
    $('rr-bal').innerText = fmt(starsBalance);
}

async function syncData() {
    try {
        const username = user.username || `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Player';
        const res = await fetch(`${BACKEND_URL}/get_balance/${user.id}?username=${encodeURIComponent(username)}&t=${Date.now()}`);
        if (!res.ok) throw new Error('Ошибка сервера');
        const data = await res.json();
        setStars(data.balance);
        $('bal-ton').innerText = (Number(data.ton_balance) || 0).toFixed(2);
        $('bal-bamboo').innerText = fmt(Number(data.bamboo_balance) || 0);
    } catch (e) { console.warn('Не удалось обновить баланс:', e); }
}
syncData();

/* ================= РУССКАЯ РУЛЕТКА ================= */
let rrItems = [], rrMargin = 0.10, rrMin = 5, rrMax = 95;
let rrActive = null, rrBusy = false, rrOutcome = null, rrTimer = null;

async function post(path, body) {
    const res = await fetch(BACKEND_URL + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tg.initData || '', ...body })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.detail || 'Ошибка сервера');
    return data;
}

const rrCost = (price, chance) => Math.max(1, Math.ceil(price * (chance / 100) * (1 + rrMargin)));
const itemImg = it => it.image_url || 'img/star.png';

async function loadRR() {
    try {
        const data = await post('/case/rr/info', {});
        rrItems = (data.items || []).slice().sort((a, b) => a.price_stars - b.price_stars);
        rrMargin = Number(data.margin ?? 0.10);
        rrMin = data.min_chance || 5; rrMax = data.max_chance || 95;
    } catch (e) { console.warn('RR info error:', e); }
    renderRR();
}

function renderRR() {
    $('rr-grid').innerHTML = rrItems.map((it, i) => `
        <div class="case-card rr-card" style="animation-delay:${i * 40}ms" onclick="openRR(${i})">
            <div class="case-img-box">
                <img src="${esc(itemImg(it))}" alt="" onerror="this.onerror=null;this.src='img/star.png'">
            </div>
            <div class="case-foot">
                <div class="case-name">${esc(it.name)}</div>
                <div class="case-prices">
                    <div class="case-price"><img src="img/star.png" alt="">${fmt(it.price_stars)}</div>
                </div>
            </div>
        </div>
    `).join('');
}

function showView(id) {
    ['rr-setup', 'rr-spin', 'rr-result'].forEach(v => $(v).classList.toggle('show', v === id));
}

function openRR(i) {
    if (rrBusy) return;
    try { tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
    rrActive = rrItems[i];
    if (!rrActive) return;
    $('rr-img').src = itemImg(rrActive);
    $('rr-title').innerText = rrActive.name;
    $('rr-prize').innerText = fmt(rrActive.price_stars);
    const s = $('rr-slider');
    s.min = rrMin; s.max = rrMax; s.value = 50;
    $('rr-fee').innerText = `Цена = цена приза × шанс + комиссия ${Math.round(rrMargin * 100)}%. Шанс на слайдере — реальный шанс победы.`;
    updateRR();
    showView('rr-setup');
    $('rr-bal').innerText = fmt(starsBalance);
    $('rr-modal').classList.add('open');
}

function updateRR() {
    const chance = parseInt($('rr-slider').value, 10);
    $('rr-chance').innerText = chance + '%';
    $('rr-cost').innerText = fmt(rrCost(rrActive.price_stars, chance));
}

function closeRR() {
    if (rrBusy) return;
    $('rr-modal').classList.remove('open');
    rrActive = null;
}

function backToSetup() { showView('rr-setup'); }

const TILE_W = 140;
const XMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>';

async function spinRR() {
    if (rrBusy || !rrActive) return;
    const chance = parseInt($('rr-slider').value, 10);
    const cost = rrCost(rrActive.price_stars, chance);
    if (starsBalance < cost) { showToast('Недостаточно звёзд', 'img/star.png'); return; }

    rrBusy = true;
    $('rr-go').disabled = true;
    try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}

    let out;
    try {
        out = await post('/case/rr/spin', { item_id: rrActive.id, chance });
    } catch (e) {
        rrBusy = false; $('rr-go').disabled = false;
        showToast(e.message || 'Ошибка', 'img/star.png');
        return;
    }
    $('rr-go').disabled = false;
    rrOutcome = out;
    if (out.balance !== null && out.balance !== undefined) setStars(out.balance);
    else setStars(starsBalance - out.cost);

    $('rr-spin-title').innerText = rrActive.name;
    showView('rr-spin');

    // лента: доля плиток с призом = выбранному шансу, на победной позиции — результат
    const winIndex = 30;
    let html = '';
    for (let i = 0; i < 45; i++) {
        const prize = (i === winIndex) ? out.win : (Math.random() * 100 < chance);
        html += `<div class="rr-tile">${prize
            ? `<img src="${esc(itemImg(rrActive))}" alt="" onerror="this.onerror=null;this.src='img/star.png'">`
            : XMARK}</div>`;
    }
    const rail = $('rr-rail');
    rail.style.transition = 'none';
    rail.style.transform = 'translateX(0)';
    rail.innerHTML = html;

    setTimeout(() => {
        const half = rail.parentElement.clientWidth / 2;
        const offset = winIndex * TILE_W - half + TILE_W / 2;
        rail.style.transition = 'transform 5.5s cubic-bezier(0.15, 0, 0.05, 1)';
        rail.style.transform = `translateX(-${offset}px)`;
    }, 60);

    clearTimeout(rrTimer);
    rrTimer = setTimeout(finishRR, 5800);
}

function skipRR() {
    if (!rrBusy) return;
    clearTimeout(rrTimer);
    finishRR();
}

function finishRR() {
    if (!rrOutcome) return;
    const out = rrOutcome; rrOutcome = null;
    if (out.win) {
        $('rr-res-img').style.display = 'block';
        $('rr-res-img').src = itemImg(rrActive || out.item);
        $('rr-res-lose').style.display = 'none';
        $('rr-res-text').innerText = 'Победа!';
        $('rr-res-text').style.color = '#8dffb0';
        $('rr-res-sub').innerText = `${out.item.name} добавлен в инвентарь`;
        try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
    } else {
        $('rr-res-img').style.display = 'none';
        $('rr-res-lose').style.display = 'block';
        $('rr-res-text').innerText = 'Неудача';
        $('rr-res-text').style.color = '#ff8a9a';
        $('rr-res-sub').innerText = `Шанс был ${out.chance}% — в этот раз не повезло`;
        try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {}
    }
    showView('rr-result');
    rrBusy = false;
}

loadRR();

/* ============== фон ============== */
const canvas = $('stars-canvas');
const ctx = canvas.getContext('2d');
let bubbles = [];
function initStars() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    bubbles = Array.from({ length: 30 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2.2 + 0.6,
        speed: Math.random() * 0.35 + 0.1,
        drift: (Math.random() - 0.5) * 0.25,
        opacity: Math.random() * 0.45 + 0.15,
        bright: Math.random() < 0.4
    }));
}
function animateStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(s => {
        ctx.beginPath();
        ctx.globalAlpha = s.opacity;
        ctx.fillStyle = s.bright ? '#ffffff' : '#9cc4ff';
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.y -= s.speed;
        s.x += s.drift;
        if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(animateStars);
}
initStars(); animateStars();
window.addEventListener('resize', initStars);
</script>
</body>
</html>
