<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FixStars Halloween</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-dark: #1a0a00;
            --orange: #ff7a1a;
            --orange-light: #ffb347;
            --orange-deep: #c2410c;
            --glow: rgba(255, 122, 26, 0.35);
            --line: rgba(255, 150, 60, 0.35);
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }
        body.loaded { opacity: 1; }

        #pc-only-blocker { display: none; position: fixed; inset: 0; background: #1a0a00; z-index: 999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
        .qr-frame { background: white; padding: 15px; border-radius: 25px; box-shadow: 0 0 40px var(--orange); margin-bottom: 25px; }

        #stars-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        .main-wrapper {
            background:
                radial-gradient(circle at 50% 18%, #ff7a1a 0%, rgba(255,122,26,0.35) 22%, transparent 55%),
                linear-gradient(180deg, #5a1e00 0%, #2a0d00 45%, #120500 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* Паутина */
        .web { position: fixed; top: 0; right: 0; width: 150px; height: 150px; z-index: 2; pointer-events: none; opacity: 0.4; }

        /* Паук на нитке */
        .spider-wrap { position: fixed; top: 0; left: 22px; z-index: 2; pointer-events: none; animation: spiderDrop 5s ease-in-out infinite; transform-origin: top center; }
        .spider-wrap .thread { width: 1px; height: 70px; background: rgba(255,255,255,0.5); margin: 0 auto; }
        .spider-wrap .sp { font-size: 22px; line-height: 1; margin-left: -10px; }
        @keyframes spiderDrop { 0%,100% { transform: translateY(-25px); } 50% { transform: translateY(5px); } }

        /* Летучие мыши */
        .bat { position: fixed; z-index: 2; pointer-events: none; font-size: 20px; opacity: 0; animation: batFly 14s linear infinite; }
        .bat.b2 { animation-delay: 6s; top: 24% !important; font-size: 15px; animation-duration: 18s; }
        @keyframes batFly {
            0%   { transform: translateX(-60px) translateY(0) scaleX(1); opacity: 0; }
            10%  { opacity: 0.85; }
            50%  { transform: translateX(55vw) translateY(-30px) scaleX(-1); }
            90%  { opacity: 0.85; }
            100% { transform: translateX(110vw) translateY(10px) scaleX(1); opacity: 0; }
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px 24px 110px 24px;
            scrollbar-width: none;
        }
        .scrollable-content::-webkit-scrollbar { display: none; }

        .balance-container-v2 {
            display: flex; flex-direction: column; gap: 4px;
            background: rgba(20, 6, 0, 0.7); border: 1px solid var(--line);
            padding: 10px 16px; border-radius: 18px; backdrop-filter: blur(14px);
        }
        .balance-item-v2 { display: flex; align-items: center; justify-content: flex-end; gap: 8px; cursor: pointer; color: var(--orange-light); }
        .balance-item-v2 img { width: 20px; height: 20px; object-fit: contain; filter: drop-shadow(0 0 5px var(--orange)); }

        .hero-zone { position: relative; text-align: center; margin: 30px 0 10px; }
        .pumpkin { font-size: 78px; display: inline-block; animation: heroFloat 4s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255, 150, 40, 0.8)); }
        @keyframes heroFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
        .title-glow { text-shadow: 0 0 22px rgba(255, 140, 30, 0.7); }

        .game-card {
            background: linear-gradient(135deg, rgba(255, 122, 26, 0.22) 0%, rgba(40, 12, 0, 0.75) 100%);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .game-card:active { transform: scale(0.97); border-color: var(--orange-light); background: rgba(255, 122, 26, 0.35); }
        .game-card img { width: 50px; height: 50px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(255, 150, 40, 0.6)); }
        .card-title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 16px; line-height: 1; letter-spacing: -0.3px; }
        .card-desc { font-size: 10px; font-weight: 700; color: var(--orange-light); text-transform: uppercase; opacity: 0.95; margin-top: 5px; }

        .dock-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(20, 6, 0, 0.94); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 12px 10px 34px 10px; z-index: 1000; backdrop-filter: blur(25px); height: 95px; }
        .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #a16c4a; flex: 1; }
        .dock-btn.active { color: var(--orange-light); filter: drop-shadow(0 0 8px rgba(255, 150, 40, 0.8)); }

        #global-loader { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-ring { width: 50px; height: 50px; border: 3px solid #3a1500; border-left-color: var(--orange); border-radius: 50%; animation: rotate 1s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        .dock-center { color: #ffd2a0; }
        .dock-center .ico {
            width: 54px; height: 54px; margin: -13px 0; transform: translateY(-16px); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(145deg, #ffa13a, #c2410c); color: #fff;
            border: 1px solid rgba(255, 190, 110, 0.7);
            box-shadow: 0 0 24px rgba(255, 122, 26, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        .dock-center.active .ico { box-shadow: 0 0 34px rgba(255, 150, 40, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="loaded">

    <div id="pc-only-blocker">
        <div class="qr-frame"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://t.me/FixStarsBot" alt="QR"></div>
        <h1 class="text-2xl font-black italic uppercase text-white">FIX <span style="color:#ff7a1a">STARS</span></h1>
    </div>

    <div id="global-loader">
        <div class="loader-ring"></div>
        <div class="mt-4 font-black italic tracking-widest animate-pulse" style="color:#ff7a1a">FIX STARS</div>
    </div>

    <canvas id="stars-canvas"></canvas>

    <!-- Хэллоуин-декор -->
    <svg class="web" viewBox="0 0 150 150" fill="none" stroke="#fff" stroke-width="0.8">
        <path d="M150 0 L0 0 M150 0 L150 150 M150 0 L0 110 M150 0 L40 150 M150 0 L90 150 M150 0 L0 50"/>
        <path d="M120 0 Q115 25 150 30 M85 0 Q80 45 150 60 M50 0 Q45 70 150 95 M15 0 Q10 100 150 130"/>
    </svg>
    <div class="spider-wrap"><div class="thread"></div><div class="sp">🕷️</div></div>
    <div class="bat" style="top: 14%; left: 0;">🦇</div>
    <div class="bat b2" style="left: 0;">🦇</div>

    <div class="main-wrapper">
        <div class="scrollable-content">
            <!-- ШАПКА -->
            <div class="flex justify-between items-center mb-6">
                <div class="flex items-center gap-4">
                    <div class="relative">
                        <img id="user-avatar" src="" class="w-14 h-14 rounded-2xl object-cover bg-gray-900" style="border:2px solid rgba(255,170,80,0.7)">
                        <div class="absolute -bottom-1 -right-1 w-4 h-4 border-2 border-black rounded-full" style="background:#ffb347"></div>
                    </div>
                    <div>
                        <div id="display-name" class="text-[14px] font-black text-white tracking-wide uppercase italic">ЗАГРУЗКА...</div>
                        <div id="display-id" class="text-[10px] font-bold opacity-80" style="color:#ffb347">ID: 00000000</div>
                    </div>
                </div>
                <div class="balance-container-v2" onclick="tg.showAlert('Пополнение доступно в разделе STARS')">
                    <div class="balance-item-v2">
                        <span id="bal-stars" class="font-black text-xl">0.00</span>
                        <img src="img/star.png" alt="STAR">
                    </div>
                </div>
            </div>

            <!-- ЗАГОЛОВОК -->
            <div class="hero-zone">
                <div class="pumpkin">🎃</div>
                <h1 class="text-5xl font-black italic mt-2 uppercase tracking-tighter title-glow">Fix<span style="color:#ffb347">Stars</span></h1>
                <div class="h-1 w-14 rounded-full mx-auto mt-3" style="background:#ffb347; box-shadow:0 0 14px rgba(255,170,80,0.9)"></div>
                <div class="text-[10px] font-bold uppercase tracking-[0.35em] mt-3" style="color:#ffd2a0">Halloween Edition</div>
            </div>

            <!-- МЕНЮ -->
            <div class="mt-8">
                <div onclick="window.location.href='tasks.html?v=' + Date.now()" class="game-card">
                    <img src="img/pepe.png" alt="Cases">
                    <div>
                        <div class="card-title">Задания</div>
                        <div class="card-desc">Выполняй простые задания и зарабатывай Stars</div>
                    </div>
                    <div class="ml-auto opacity-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>

                <div onclick="window.location.href='wheel.html'" class="game-card">
                    <img src="img/chassiki.png" alt="Wheel">
                    <div>
                        <div class="card-title">Ежедневный бонус</div>
                        <div class="card-desc">Испытай свою удачу</div>
                    </div>
                    <div class="ml-auto"><div class="w-3 h-3 rounded-full animate-ping" style="background:#ffb347"></div></div>
                </div>

                <div onclick="window.location.href='games.html?v=' + Date.now()" class="game-card">
                    <img src="img/helmet.png" alt="Games">
                    <div>
                        <div class="card-title">Мини игры</div>
                        <div class="card-desc">Играй в мини игры и удваивай свой выигрыш</div>
                    </div>
                    <div class="ml-auto opacity-50">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7"></path>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- ТУЛБАР -->
        <div class="dock-bar">
            <div onclick="location.href='index.html'" class="dock-btn active">
                <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                <span class="text-[10px] font-black uppercase italic">Главная</span>
            </div>
            <div onclick="location.href='ref.html'" class="dock-btn dock-center">
                <div class="ico">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="4.5" cy="9.5" r="2.2"></circle><circle cx="19.5" cy="9.5" r="2.2"></circle><path d="M1 18c0-2 1.3-3.5 3.5-3.7"></path><path d="M23 18c0-2-1.3-3.5-3.5-3.7"></path></svg>
                </div>
                <span class="text-[10px] font-black uppercase italic">Рефералы</span>
            </div>
            <div onclick="window.location.href='profile.html'" class="dock-btn ">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[10px] font-black uppercase italic">Профиль</span>
            </div>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    const BACKEND_URL = 'https://sdjsdjsd.vercel.app';

    const tgUser = tg.initDataUnsafe?.user;
    const user = (tgUser && tgUser.id) ? tgUser : { id: '12345', username: 'TestUser', first_name: 'Тестер' };

    async function syncData() {
        try {
            const username = user.username || `${user.first_name || ''} ${user.last_name || ''}`.trim() || "Player";
            const res = await fetch(`${BACKEND_URL}/get_balance/${user.id}?username=${encodeURIComponent(username)}&t=${Date.now()}`);

            if (!res.ok) throw new Error("Ошибка сервера");

            const data = await res.json();
            const starsVal = Number(data.balance) || 0;

            const starsElem = document.getElementById('bal-stars');
            if (starsElem) {
                starsElem.innerText = starsVal.toFixed(2);
            }
        } catch (e) {
            console.warn("Не удалось обновить баланс:", e);
        }
    }

    async function registerReferral() {
        // start_param приходит при открытии по ссылке; если апку открыли кнопкой из бота — берём ?ref=
        const sp = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get('ref');
        if (!tgUser || !tgUser.id || !tg.initData || !sp) return;
        if (String(sp) === String(tgUser.id)) return;
        try {
            await fetch(`${BACKEND_URL}/register_referral`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: tg.initData, start_param: sp })
            });
        } catch (e) { console.warn("Реферал не зарегистрирован:", e); }
    }

    // DEV: поставь false, чтобы отключить обход подписки (10 тапов по звезде)
    const DEV_SKIP_ENABLED = true;

    // Подписку теперь проверяет бот при /start. Поставь true, чтобы дополнительно
    // проверять и внутри мини-апки (на сервере тогда нужен FORCE_SUB_IN_APP=1).
    const CHECK_IN_APP = false;

    // Проверка подписки только при запуске бота, а не при переходах между страницами.
    function isSubPassed() {
        try { return sessionStorage.getItem('sub_passed') === '1'; } catch (e) { return false; }
    }
    function markSubPassed() {
        try { sessionStorage.setItem('sub_passed', '1'); } catch (e) {}
    }

    // ===== Обязательная подписка на спонсоров =====
    async function checkMandatorySubscriptions() {
        try {
            const resp = await fetch(`${BACKEND_URL}/tasks/list`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ init_data: tg.initData || "" })
            });
            if (!resp.ok) throw new Error("HTTP " + resp.status);
            const data = await resp.json();

            if (data.forced_subscription && data.channels && data.channels.length > 0) {
                return { status: 'need', channels: data.channels };
            }
            return { status: 'ok' };
        } catch (e) {
            console.warn("Ошибка проверки подписки:", e);
            return { status: 'error' };
        }
    }

    // Экран блокировки (модалка подписки)
    function showSubscriptionModal(channels, errorText) {
        const existing = document.getElementById('sub-modal');
        if (existing) existing.remove();

        const modal = document.createElement('div');
        modal.id = 'sub-modal';
        modal.style.cssText = `
            position: fixed; inset: 0; background: rgba(26, 10, 0, 0.97); backdrop-filter: blur(20px);
            z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; font-family: 'Inter', sans-serif; color: white;
        `;

        let channelsHtml = '';
        (channels || []).forEach((ch) => {
            channelsHtml += `
                <a href="${ch.link}" target="_blank" onclick="if(window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.openTelegramLink('${ch.link}'); return false; }" style="
                    display: flex; justify-content: space-between; align-items: center; background: rgba(255,122,26,0.12);
                    padding: 16px; border-radius: 16px; color: #fff; text-decoration: none; font-weight: 700;
                    border: 1px solid rgba(255, 150, 60, 0.45); margin-bottom: 12px; width: 100%; box-sizing: border-box;
                ">
                    <span>📢 ${ch.name}</span>
                    <span style="color: #ffb347;">➔</span>
                </a>
            `;
        });

        const text = errorText
            ? `<span style="color: #f87171; font-weight: bold;">${errorText}</span>`
            : `Чтобы продолжить пользоваться приложением и зарабатывать <span style="color: #ffb347; font-weight: bold;">Stars ⭐</span>, подпишитесь на наших спонсоров:`;

        modal.innerHTML = `
            <img id="sub-star" src="img/star.png" alt="Star" style="width: 64px; height: 64px; margin-bottom: 16px; filter: drop-shadow(0 0 15px rgba(255,150,40,0.7)); animation: bounce 2s infinite;">
            <h2 style="font-size: 22px; font-weight: 900; font-style: italic; margin-bottom: 8px; text-transform: uppercase;">Обязательная подписка</h2>
            <p style="font-size: 13px; color: #d6b9a0; margin-bottom: 24px; line-height: 1.4;">${text}</p>
            <div style="width: 100%; max-width: 320px; margin-bottom: 20px;">
                ${channelsHtml}
            </div>
            <button id="check-sub-btn" style="
                width: 100%; max-width: 320px; background: linear-gradient(135deg, #ffa13a, #c2410c); color: #fff; border: none;
                padding: 16px; border-radius: 16px; font-size: 16px; font-weight: 900; font-style: italic; cursor: pointer;
                box-shadow: 0 0 25px rgba(255, 122, 26, 0.5); text-transform: uppercase;
            ">${errorText ? 'Повторить 🔄' : 'Я подписался ✅'}</button>
        `;

        document.body.appendChild(modal);

        // DEV: 10 нажатий на звезду пропускают проверку подписки (только для тестов)
        if (DEV_SKIP_ENABLED) {
            let starTaps = 0;
            let starTimer = null;
            document.getElementById('sub-star').onclick = () => {
                starTaps++;
                clearTimeout(starTimer);
                starTimer = setTimeout(() => { starTaps = 0; }, 3000);
                if (starTaps >= 10) {
                    markSubPassed();
                    modal.remove();
                    syncData();
                }
            };
        }

        document.getElementById('check-sub-btn').onclick = async () => {
            const btn = document.getElementById('check-sub-btn');
            btn.innerText = 'Проверка...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            const result = await checkMandatorySubscriptions();
            if (result.status === 'ok') {
                markSubPassed();
                modal.remove();
                syncData();
            } else if (result.status === 'need') {
                showSubscriptionModal(result.channels);
                const msg = 'Вы подписались ещё не на все каналы!';
                if (tg.showAlert) tg.showAlert(msg); else alert(msg);
            } else {
                showSubscriptionModal([], 'Не удалось проверить подписку. Попробуйте ещё раз.');
            }
        };
    }

    window.onload = async () => {
        try {
            tg.expand();
            tg.ready();
            tg.headerColor = '#5a1e00';
            tg.backgroundColor = '#1a0a00';
        } catch (err) {}

        // Открыто не из Telegram — показываем заглушку с QR
        if (!tg.initData) {
            document.getElementById('global-loader').style.display = 'none';
            document.getElementById('pc-only-blocker').style.display = 'flex';
            document.body.classList.add('loaded');
            return;
        }

        if (user) {
            document.getElementById('display-name').innerText = (user.username || user.first_name || "PLAYER").toUpperCase();
            document.getElementById('display-id').innerText = `ID: ${user.id}`;
            document.getElementById('user-avatar').src = user.photo_url || `https://ui-avatars.com/api/?background=c2410c&color=fff&name=${user.first_name || 'T'}`;

            await registerReferral();

            const result = (!CHECK_IN_APP || isSubPassed()) ? { status: 'ok' } : await checkMandatorySubscriptions();
            if (result.status === 'ok') markSubPassed();
            if (result.status !== 'ok') {
                if (result.status === 'need') {
                    showSubscriptionModal(result.channels);
                } else {
                    showSubscriptionModal([], 'Не удалось проверить подписку. Попробуйте ещё раз.');
                }
                document.getElementById('global-loader').style.display = 'none';
                document.body.classList.add('loaded');
                return;
            }

            syncData();
        }

        setTimeout(() => {
            document.getElementById('global-loader').style.display = 'none';
            document.body.classList.add('loaded');
        }, 800);
    };

    // Искры (оранжевые и жёлтые, медленно поднимаются вверх)
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    let embers = [];
    function initStars() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        embers = Array.from({length: 36}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.4 + 0.12,
            drift: (Math.random() - 0.5) * 0.3,
            opacity: Math.random() * 0.6 + 0.2,
            yellow: Math.random() < 0.4
        }));
    }
    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        embers.forEach(s => {
            ctx.beginPath();
            ctx.globalAlpha = s.opacity;
            ctx.fillStyle = s.yellow ? "#ffd27a" : "#ff8a2a";
            ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            ctx.fill();
            s.y -= s.speed;
            s.x += s.drift;
            if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
        });
        requestAnimationFrame(animateStars);
    }
    initStars(); animateStars();
    window.addEventListener('resize', initStars);
</script>
</body>
</html>
