<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PandaGift - Баскетбол</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root {
            --bg-dark: #07173f;
            --blue: #2f6bff;
            --blue-light: #8fc2ff;
            --blue-deep: #1d4ed8;
            --glass: rgba(255, 255, 255, 0.12);
            --glass-line: rgba(255, 255, 255, 0.18);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            background:
                radial-gradient(circle at 50% 30%, #4a86ff 0%, rgba(47,107,255,0.35) 28%, transparent 62%),
                linear-gradient(180deg, #1f55d6 0%, #133ea6 42%, #08205f 100%);
            background-attachment: fixed;
            color: white; font-family: 'Inter', sans-serif;
            margin: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column;
        }

        .header-panel {
            padding: 12px 20px; background: rgba(8, 28, 92, 0.55); border-bottom: 1px solid var(--glass-line);
            backdrop-filter: blur(20px);
            padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px));
        }
        .back-btn { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); transition: transform 0.15s; }
        .back-btn:active { transform: scale(0.9); }
        .bal-pill { display: flex; align-items: center; gap: 8px; background: var(--glass); padding: 6px 16px; border-radius: 999px; border: 1px solid #000; backdrop-filter: blur(10px); }

        /* ПОЛЕ */
        .field {
            flex-grow: 1; position: relative; overflow: hidden;
            background: radial-gradient(ellipse at 50% 100%, rgba(143,194,255,0.18), transparent 65%);
        }

        /* КОЛЬЦО */
        .hoop {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            width: 140px; height: 160px; z-index: 3; pointer-events: none;
        }
        .backboard {
            position: absolute; top: 0; left: 0; width: 140px; height: 88px;
            border: 4px solid #ef4444; border-radius: 8px;
            background: rgba(255,255,255,0.12);
            box-shadow: 0 0 25px rgba(239,68,68,0.2);
        }
        .backboard::after {
            content: ''; position: absolute; left: 42px; top: 38px; width: 48px; height: 36px;
            border: 3px solid #ef4444; border-radius: 4px; opacity: 0.8;
        }
        .rim {
            position: absolute; top: 82px; left: 22px; width: 96px; height: 14px;
            border: 4px solid #ef4444; border-radius: 50%;
            background: rgba(239,68,68,0.15);
        }
        .net {
            position: absolute; top: 92px; left: 28px; width: 84px; height: 62px;
            clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
            background:
                repeating-linear-gradient(45deg, rgba(226,232,240,0.7) 0 1px, transparent 1px 9px),
                repeating-linear-gradient(-45deg, rgba(226,232,240,0.7) 0 1px, transparent 1px 9px);
            transform-origin: top center;
        }
        .net.shake { animation: netshake 0.6s ease-out; }
        .rim.shake { animation: rimshake 0.5s ease-out; }

        @keyframes netshake {
            0% { transform: scaleY(1) skewX(0); }
            30% { transform: scaleY(1.25) skewX(4deg); }
            60% { transform: scaleY(0.92) skewX(-3deg); }
            100% { transform: scaleY(1) skewX(0); }
        }
        @keyframes rimshake {
            0%, 100% { transform: translateY(0); }
            25% { transform: translateY(3px); }
            55% { transform: translateY(-2px); }
        }

        .ball {
            position: absolute; bottom: 28px; left: 50%; margin-left: -28px;
            font-size: 56px; line-height: 1; z-index: 5;
            filter: drop-shadow(0 8px 8px rgba(0,0,0,0.5));
        }
        .ball.fly { transition: transform 0.85s cubic-bezier(0.25, 0.8, 0.3, 1); }
        .ball.drop { transition: transform 0.5s ease-in; z-index: 1; }
        .ball.back { transition: transform 0.65s cubic-bezier(0.3, 0, 0.6, 1); }

        .result-flash {
            position: absolute; top: 215px; left: 0; right: 0; text-align: center;
            font-size: 26px; font-weight: 900; font-style: italic; text-transform: uppercase;
            opacity: 0; transition: opacity 0.25s; letter-spacing: -0.02em;
            text-shadow: 0 2px 10px rgba(0, 20, 90, 0.6);
        }
        .result-flash.show { opacity: 1; }

        /* ПАНЕЛЬ СТАВКИ */
        .bet-panel {
            padding: 16px 20px; background: rgba(8, 28, 92, 0.7); border-top: 1px solid var(--glass-line);
            backdrop-filter: blur(20px);
            padding-bottom: calc(20px + var(--tg-safe-area-inset-bottom, 0px));
        }

        .bet-input {
            width: 100%; background: rgba(3, 14, 60, 0.45); border: 1px solid var(--glass-line); border-radius: 18px;
            padding: 14px 16px; font-size: 20px; font-weight: 900; color: white;
            outline: none; text-align: center; transition: 0.2s;
        }
        .bet-input:focus { border-color: var(--blue-light); }

        .chip {
            flex: 1; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px;
            padding: 9px 0; font-size: 11px; font-weight: 900; color: #cfe0ff;
            transition: 0.15s;
        }
        .chip:active { transform: scale(0.94); border-color: #fff; color: white; }

        .btn-main {
            background: linear-gradient(180deg, #4f8cff, #1d4ed8); color: white; font-weight: 900; border-radius: 999px;
            transition: 0.2s; box-shadow: 0 0 25px rgba(47, 107, 255, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-main:disabled { background: rgba(3, 14, 60, 0.55); color: #8fb0f0; border: 1px solid var(--glass-line); box-shadow: none; }

        /* МОДАЛКА */
        #result-modal {
            display: none; position: fixed; inset: 0; z-index: 999;
            background: rgba(2, 10, 40, 0.85); backdrop-filter: blur(10px);
            align-items: center; justify-content: center;
        }
        .modal-box { background: linear-gradient(180deg, #1c4bc4 0%, #0a2468 100%); border-radius: 28px; width: 85%; max-width: 340px; padding: 25px; text-align: center; box-shadow: 0 0 40px rgba(47, 107, 255, 0.5); }

        ::-webkit-scrollbar { display: none; }
        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>

    <header class="header-panel flex justify-between items-center">
        <div class="flex items-center gap-3">
            <button onclick="goBack()" class="back-btn">
                <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <div class="font-black italic text-lg tracking-tighter">Panda<span style="color:#8fc2ff">Gift</span></div>
        </div>
        <div class="bal-pill">
            <img src="img/star.png" class="w-4 h-4" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
            <span id="val-stars" class="font-black text-sm">0.00</span>
        </div>
    </header>

    <div class="field" id="field">
        <div class="hoop">
            <div class="backboard"></div>
            <div class="rim" id="rim"></div>
            <div class="net" id="net"></div>
        </div>
        <div class="result-flash" id="flash"></div>
        <div class="ball" id="ball">🏀</div>
    </div>

    <div class="bet-panel">
        <div class="flex justify-center items-center mb-3 px-1">
            <span class="text-[10px] uppercase font-black tracking-widest" style="color:#cfe0ff">Выигрыш <span style="color:#8fc2ff">x2</span></span>
        </div>

        <input id="bet-input" type="number" inputmode="decimal" step="0.01" min="1" placeholder="Ставка ★" class="bet-input" oninput="updatePotential()">

        <div class="flex gap-2 mt-3">
            <button class="chip" onclick="setBet(1)">1</button>
            <button class="chip" onclick="setBet(2)">2</button>
            <button class="chip" onclick="setBet(5)">5</button>
            <button class="chip" onclick="setBet(10)">10</button>
            <button class="chip" onclick="setBetMax()">MAX</button>
        </div>

        <button id="throw-btn" onclick="throwBall()" class="w-full py-4 btn-main uppercase tracking-widest text-sm mt-4" disabled>Загрузка...</button>
    </div>

    <div id="result-modal">
        <div class="modal-box" id="modal-box">
            <h2 id="modal-title" class="text-lg font-black italic uppercase tracking-tight"></h2>
            <div class="py-4 rounded-2xl my-5 flex flex-col items-center justify-center" style="background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);">
                <img src="img/star.png" class="w-12 h-12 mb-2" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1828/1828884.png'">
                <p id="modal-amount" class="text-2xl font-black"></p>
            </div>
            <button onclick="closeModal()" class="w-full py-4 rounded-full font-black uppercase text-xs tracking-wider text-white btn-main">Играть ещё</button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const SB_URL = "https://xbklrdpguqsuvqndcujb.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhia2xyZHBndXFzdXZxbmRjdWpiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MzQ0NzUsImV4cCI6MjEwNzIxMDQ3NX0.IeK3NGOTu_J1jDOd_XjHQUOySnkbFh4uThGCPeu-Wu4";
        const SB = supabase.createClient(SB_URL, SB_KEY);
        const tg = window.Telegram.WebApp;
        tg.expand();
        try {
            tg.headerColor = '#1f55d6';
            tg.backgroundColor = '#08205f';
        } catch (_) {}

        // ===== НАСТРОЙКИ ИГРЫ =====
        const WIN_CHANCE = 0.23;   // 23% на попадание
        const MULTIPLIER = 2;      // х2 от ставки
        const MIN_BET = 1;
        // ==========================

        let user = null;
        let busy = false;

        const $ = (id) => document.getElementById(id);
        const haptic = (t) => { if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred(t || 'light'); };

        function goBack() {
            haptic();
            window.location.href = 'games.html';
        }

        function getBalance() { return parseFloat(user?.balance || 0); }
        function getBet() { return parseFloat(parseFloat($('bet-input').value).toFixed(2)); }

        function setBet(v) {
            if (busy) return;
            haptic();
            $('bet-input').value = v;
            updatePotential();
        }
        function setBetMax() {
            if (busy) return;
            haptic();
            $('bet-input').value = Math.floor(getBalance() * 100) / 100;
            updatePotential();
        }

        function updatePotential() {
            const btn = $('throw-btn');
            if (busy || !user) return;
            const bet = getBet();
            if (!bet || bet < MIN_BET) {
                btn.disabled = true;
                btn.innerText = `Минимальная ставка ${MIN_BET} ★`;
            } else if (bet > getBalance()) {
                btn.disabled = true;
                btn.innerText = "Недостаточно звёзд";
            } else {
                btn.disabled = false;
                btn.innerText = `Бросить · выигрыш ${(bet * MULTIPLIER).toFixed(2)} ★`;
            }
        }

        async function loadUser() {
            const userId = tg.initDataUnsafe?.user?.id || 8015661230;
            try {
                const { data, error } = await SB.from('users').select('*').eq('id', userId).maybeSingle();
                if (error) throw error;
                if (!data) throw new Error("Пользователь не найден");
                user = data;
                $('val-stars').innerText = getBalance().toFixed(2);
                updatePotential();
            } catch (e) {
                console.error("Ошибка загрузки:", e);
                $('throw-btn').innerText = "ОШИБКА СЕТИ";
            }
        }

        // Смещение мяча к точке внутри поля
        function ballOffset(targetX, targetY) {
            const ball = $('ball').getBoundingClientRect();
            const field = $('field').getBoundingClientRect();
            const bx = ball.left + ball.width / 2;
            const by = ball.top + ball.height / 2;
            return { dx: field.left + targetX - bx, dy: field.top + targetY - by };
        }

        async function throwBall() {
            if (busy || !user) return;
            const bet = getBet();
            if (!bet || bet < MIN_BET || bet > getBalance()) return;

            busy = true;
            const btn = $('throw-btn');
            btn.disabled = true;
            btn.innerText = "БРОСОК...";
            haptic('medium');

            // Результат решаем сразу и сохраняем баланс до анимации
            const isWin = Math.random() < WIN_CHANCE;
            const payout = isWin ? parseFloat((bet * MULTIPLIER).toFixed(2)) : 0;
            // Победа: на баланс приходит ставка х2 (ставка не списывается). Проигрыш: ставка списывается.
            const newBalance = parseFloat((isWin ? getBalance() + payout : getBalance() - bet).toFixed(2));

            try {
                const { error } = await SB.from('users').update({ balance: newBalance }).eq('id', user.id);
                if (error) throw error;
            } catch (e) {
                console.error("Ошибка сохранения:", e);
                btn.innerText = "ОШИБКА СЕТИ";
                busy = false;
                setTimeout(updatePotential, 1500);
                return;
            }

            user.balance = newBalance;
            $('val-stars').innerText = newBalance.toFixed(2);

            await playAnimation(isWin);

            showResult(isWin, bet, payout);
        }

        function playAnimation(isWin) {
            return new Promise((resolve) => {
                const ball = $('ball');
                const rim = $('rim').getBoundingClientRect();
                const field = $('field').getBoundingClientRect();

                const side = Math.random() < 0.5 ? -1 : 1;
                const rimCx = rim.left - field.left + rim.width / 2;
                const rimTop = rim.top - field.top;

                ball.classList.add('fly');

                if (isWin) {
                    // Мяч летит точно в кольцо и проваливается через сетку
                    const o = ballOffset(rimCx, rimTop - 20);
                    ball.style.transform = `translate(${o.dx}px, ${o.dy}px) scale(0.5) rotate(540deg)`;

                    setTimeout(() => {
                        ball.classList.remove('fly');
                        ball.classList.add('drop');
                        const d = ballOffset(rimCx, rimTop + 62);
                        ball.style.transform = `translate(${d.dx}px, ${d.dy}px) scale(0.45) rotate(620deg)`;
                        $('net').classList.add('shake');
                        haptic('heavy');
                        flash('ПОПАЛ!', '#6ee7a0');
                    }, 850);
                    setTimeout(resolve, 1700);
                } else {
                    // Мяч бьёт по ободу и отскакивает
                    const o = ballOffset(rimCx + side * 38, rimTop - 16);
                    ball.style.transform = `translate(${o.dx}px, ${o.dy}px) scale(0.5) rotate(360deg)`;

                    setTimeout(() => {
                        ball.classList.remove('fly');
                        ball.classList.add('back');
                        $('rim').classList.add('shake');
                        haptic('light');
                        const b = ballOffset(rimCx + side * 120, rimTop + 230);
                        ball.style.transform = `translate(${b.dx}px, ${b.dy}px) scale(0.75) rotate(-220deg)`;
                        flash('ОТСКОК!', '#ff8a8a');
                    }, 850);
                    setTimeout(resolve, 1700);
                }
            });
        }

        function flash(text, color) {
            const f = $('flash');
            f.innerText = text;
            f.style.color = color;
            f.classList.add('show');
        }

        function showResult(isWin, bet, payout) {
            const box = $('modal-box');
            const title = $('modal-title');
            const amount = $('modal-amount');

            if (isWin) {
                box.style.border = '1px solid #6ee7a0';
                title.className = 'text-lg font-black italic uppercase tracking-tight';
                title.style.color = '#6ee7a0';
                title.innerText = 'Попадание! Победа';
                amount.className = 'text-2xl font-black';
                amount.style.color = '#6ee7a0';
                amount.innerText = `+${payout.toFixed(2)} ★`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                box.style.border = '1px solid rgba(255,255,255,0.35)';
                title.className = 'text-lg font-black italic uppercase tracking-tight';
                title.style.color = '#cfe0ff';
                title.innerText = 'Не повезло';
                amount.className = 'text-2xl font-black';
                amount.style.color = '#ff8a8a';
                amount.innerText = `-${bet.toFixed(2)} ★`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
            $('result-modal').style.display = 'flex';
        }

        function closeModal() {
            haptic();
            $('result-modal').style.display = 'none';

            // Сброс сцены
            const ball = $('ball');
            ball.classList.remove('fly', 'drop', 'back');
            ball.style.transform = '';
            $('net').classList.remove('shake');
            $('rim').classList.remove('shake');
            $('flash').classList.remove('show');

            busy = false;
            updatePotential();
        }

        loadUser();
    </script>
</body>
</html>
