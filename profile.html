<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile - FixStars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Creepster&display=swap');

        :root {
            --accent: #ffb347;
            --text-soft: #ffd9a0;
            --panel: rgba(30, 12, 3, 0.55);
            --line: rgba(255, 179, 71, 0.3);
        }

        body {
            background: linear-gradient(180deg, #3a1a08 0%, #6b2f0c 55%, #a04a12 100%);
            background-attachment: fixed;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Искры на фоне */
        #sparks { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
        .spark {
            position: absolute; bottom: -10px; border-radius: 50%;
            background: #ffb347; opacity: 0;
            animation: rise linear infinite;
        }
        @keyframes rise {
            0%   { transform: translateY(0) translateX(0); opacity: 0; }
            15%  { opacity: 0.9; }
            100% { transform: translateY(-105vh) translateX(var(--drift, 20px)); opacity: 0; }
        }

        /* Паутина и паук */
        .web {
            position: fixed; top: 0; right: 0; width: 150px; height: 150px;
            pointer-events: none; z-index: 1;
        }
        .spider-wrap {
            position: fixed; top: 0; right: 22px; z-index: 1; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            animation: hang 4s ease-in-out infinite;
            transform-origin: top center;
        }
        .spider-thread { width: 1px; height: 70px; background: #000; }
        @keyframes hang {
            0%, 100% { transform: rotate(-3deg); }
            50%      { transform: rotate(3deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .spark, .spider-wrap { animation: none; }
        }

        .main-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: calc(20px + var(--tg-safe-area-inset-top, 0px)) 20px 120px 20px;
        }

        .profile-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .avatar-main {
            width: 100px;
            height: 100px;
            border-radius: 35px;
            border: 3px solid var(--accent);
            margin: 0 auto 15px;
            object-fit: cover;
        }

        .promo-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 15px;
            margin-top: 15px;
        }

        .promo-input {
            flex: 1; min-width: 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 179, 71, 0.25);
            color: white; border-radius: 12px; padding: 0 12px;
            text-transform: uppercase; font-weight: 700; font-size: 14px;
        }
        .promo-input::placeholder { color: #8a6a4e; }
        .promo-input:focus { outline: none; border-color: var(--accent); }

        /* Оранжевая кнопка с бликом */
        .btn-orange {
            position: relative; overflow: hidden;
            background: linear-gradient(180deg, #ffa53a 0%, #f07a0a 55%, #d86200 100%);
            border: 1px solid #ffc878;
            color: #2a1000;
            font-weight: 900; text-transform: uppercase; font-size: 12px;
            padding: 10px 18px; border-radius: 12px;
            box-shadow: 0 3px 0 #8f3f00;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-orange::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 48%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0));
            pointer-events: none;
        }
        .btn-orange:active { transform: translateY(2px); box-shadow: 0 1px 0 #8f3f00; }
        .btn-orange:disabled {
            background: #2a1a10; border-color: #3d2a1c; color: #7a5a40;
            box-shadow: none; transform: none;
        }
        .btn-orange:disabled::before { display: none; }

        .gifts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .gift-card {
            background: var(--panel);
            border: 1px solid rgba(255, 179, 71, 0.2);
            border-radius: 24px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.15s, background 0.15s;
        }
        .gift-card:active { transform: scale(0.95); background: rgba(255, 179, 71, 0.15); }

        .gift-img {
            width: 60px;
            height: 60px;
            margin-bottom: 8px;
        }

        .gift-name { font-weight: 800; text-transform: uppercase; font-size: 13px; margin-bottom: 4px; }

        .price-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--accent);
            font-weight: 900;
            font-size: 14px;
        }
        .price-tag img { width: 14px; height: 14px; }

        /* Кнопка настроек (только для админа) */
        .admin-btn {
            display: none; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 13px; margin-bottom: 20px; border-radius: 18px;
            background: rgba(0, 0, 0, 0.45); border: 1px solid var(--line);
            color: var(--text-soft); font-weight: 900; font-size: 13px;
            text-transform: uppercase; font-style: italic;
            transition: transform 0.15s;
        }
        .admin-btn:active { transform: scale(0.97); }

        /* Модалки промокода */
        .pm-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
            z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 24px;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .pm-overlay.open { opacity: 1; pointer-events: auto; }
        .pm-card {
            width: 100%; max-width: 320px; border-radius: 28px;
            padding: 28px 22px 22px; text-align: center;
            transform: translateY(16px); transition: transform 0.2s;
        }
        .pm-overlay.open .pm-card { transform: translateY(0); }
        .pm-card.ok {
            background: linear-gradient(180deg, #ffa53a 0%, #e8700a 100%);
            border: 1px solid #ffd08a; color: #2a1000;
        }
        .pm-card.fail {
            background: #000; border: 2px solid #c0392b; color: white;
        }
        .pm-title { font-family: 'Creepster', cursive; font-size: 30px; letter-spacing: 0.04em; line-height: 1.1; }
        .pm-text { font-size: 14px; font-weight: 600; margin-top: 8px; line-height: 1.4; }
        .pm-card.fail .pm-text { color: #d6c3b0; }
        .pm-amount {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 44px; font-weight: 900; font-style: italic; margin-top: 14px;
        }
        .pm-amount img { width: 32px; height: 32px; }
        .pm-skull { width: 84px; height: 84px; margin: 0 auto 10px; object-fit: contain; }
        .pm-btn {
            width: 100%; margin-top: 20px; padding: 13px; border-radius: 16px;
            font-weight: 900; font-size: 14px; text-transform: uppercase; font-style: italic;
            transition: transform 0.15s;
        }
        .pm-btn:active { transform: scale(0.96); }
        .pm-card.ok .pm-btn { background: #2a1000; color: #ffd9a0; }
        .pm-card.fail .pm-btn {
            position: relative; overflow: hidden;
            background: linear-gradient(180deg, #ffa53a 0%, #f07a0a 55%, #d86200 100%);
            border: 1px solid #ffc878; color: #2a1000; box-shadow: 0 3px 0 #8f3f00;
        }

        .dock-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(26, 11, 3, 0.96); border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 12px 10px 34px 10px; z-index: 1000; height: 95px; }
        .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8a6a4e; flex: 1; }
        .dock-btn.active { color: var(--accent); }
        .dock-center { color: var(--text-soft); }
        .dock-center .ico {
            width: 54px; height: 54px; margin: -13px 0; transform: translateY(-16px); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(180deg, #ffa53a 0%, #d86200 100%); color: #2a1000;
            border: 1px solid #ffc878;
            box-shadow: 0 3px 0 #8f3f00, inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div id="sparks"></div>

    <!-- Паутина в правом верхнем углу -->
    <svg class="web" viewBox="0 0 150 150" fill="none" stroke="#000" stroke-width="1.2" stroke-linecap="round">
        <path d="M150 0 L0 0 M150 0 L150 150 M150 0 L20 100 M150 0 L60 140 M150 0 L105 150 M150 0 L5 45"/>
        <path d="M150 28 Q122 30 118 0"/>
        <path d="M150 58 Q104 62 92 0"/>
        <path d="M150 92 Q86 96 62 0"/>

    <!-- Паук на нитке -->
    <div class="spider-wrap">
        <div class="spider-thread"></div>
        <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round">
            <path d="M8 10 L1 5 M8 12 L0 12 M8 14 L1 19 M9 16 L4 23"/>
            <path d="M18 10 L25 5 M18 12 L26 12 M18 14 L25 19 M17 16 L22 23"/>

    <div class="main-wrapper">
        <div class="scrollable-content">

            <div class="profile-card">
                <img id="p-avatar" src="" class="avatar-main">
                <h2 id="p-name" class="text-2xl font-black italic uppercase tracking-tight">Загрузка...</h2>
                <p id="p-id" class="font-bold text-sm" style="color:#d9b98c">ID: 00000000</p>

                <div class="promo-box">
                    <p class="text-[10px] font-black uppercase mb-2 text-left" style="color:#d9b98c">Активация промокода</p>
                    <div class="flex gap-2">
                        <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" class="promo-input">
                        <button id="promo-btn" onclick="claimPromo()" class="btn-orange">ОК</button>
                    </div>
                </div>

            </div>

            <button id="admin-btn" class="admin-btn" onclick="location.href='event.html'">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h.01a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h.01a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v.01a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"></path></svg>
                Настройки
            </button>

            <div class="flex flex-col items-center justify-center mb-6 px-2 text-center">
                <p class="text-[10px] font-black uppercase tracking-widest mb-1" style="color:var(--text-soft)">Доступно к выводу</p>
                <div class="flex items-center gap-3">
                    <span id="p-balance" class="text-5xl font-black italic tracking-tighter">0.00</span>
                    <img src="img/star.png" class="w-8 h-8" alt="S">
                </div>
            </div>

            <div class="h-[1px] w-full mb-8" style="background:rgba(255,179,71,0.2)"></div>

            <div class="gifts-grid">
                <div class="gift-card" onclick="buyGift('Сердечко', 15)">
                    <img src="img/cccccerce.png" class="gift-img" alt="G">
                    <div class="gift-name">Сердечко</div>
                    <div class="price-tag">15 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Мишка', 15)">
                    <img src="img/mixail.png" class="gift-img" alt="G">
                    <div class="gift-name">Мишка</div>
                    <div class="price-tag">15 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Роза', 25)">
                    <img src="img/rozka.png" class="gift-img" alt="G">
                    <div class="gift-name">Роза</div>
                    <div class="price-tag">25 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Подарок', 25)">
                    <img src="img/pidarynok.png" class="gift-img" alt="G">
                    <div class="gift-name">Подарок</div>
                    <div class="price-tag">25 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Торт', 50)">
                    <img src="img/totik.png" class="gift-img" alt="G">
                    <div class="gift-name">Торт</div>
                    <div class="price-tag">50 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Букет', 50)">
                    <img src="img/buket.png" class="gift-img" alt="G">
                    <div class="gift-name">Букет</div>
                    <div class="price-tag">50 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Ракета', 50)">
                    <img src="img/raketa.png" class="gift-img" alt="G">
                    <div class="gift-name">Ракета</div>
                    <div class="price-tag">50 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Кубок', 100)">
                    <img src="img/kypok.png" class="gift-img" alt="G">
                    <div class="gift-name">Кубок</div>
                    <div class="price-tag">100 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Кольцо', 100)">
                    <img src="img/kolechko.png" class="gift-img" alt="G">
                    <div class="gift-name">Кольцо</div>
                    <div class="price-tag">100 <img src="img/star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Бриллиант', 100)">
                    <img src="img/alik.png" class="gift-img" alt="G">
                    <div class="gift-name">Бриллиант</div>
                    <div class="price-tag">100 <img src="img/star.png"></div>
                </div>
            </div>

        </div>

        <div class="dock-bar">
            <div onclick="location.href='index.html'" class="dock-btn ">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-black uppercase italic">Главная</span>
            </div>
            <div onclick="location.href='ref.html'" class="dock-btn dock-center">
                <div class="ico">
                    <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"></path><circle cx="4.5" cy="9.5" r="2.2"></circle><circle cx="19.5" cy="9.5" r="2.2"></circle><path d="M1 18c0-2 1.3-3.5 3.5-3.7"></path><path d="M23 18c0-2-1.3-3.5-3.5-3.7"></path></svg>
                </div>
                <span class="text-[10px] font-black uppercase italic">Рефералы</span>
            </div>

    <!-- Модалка результата промокода -->
    <div id="pm-overlay" class="pm-overlay" onclick="if(event.target.id==='pm-overlay') closePromoModal()">
        <div id="pm-card" class="pm-card ok">
            <img id="pm-skull" src="img/cher.png" class="pm-skull" alt="" style="display:none">
            <div id="pm-title" class="pm-title"></div>
            <div id="pm-text" class="pm-text"></div>
            <div id="pm-amount" class="pm-amount" style="display:none">
                <span id="pm-amount-val"></span>
                <img src="img/star.png" alt="">
            </div>
            <button id="pm-btn" onclick="closePromoModal()" class="pm-btn">Отлично</button>
        </div>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    const user = tg.initDataUnsafe?.user;
    const BACKEND_URL = 'https://sdjsdjsd.vercel.app';
    const ADMIN_TG_ID = '7140366080';

    // Звуки промокода: earn.mp3 — зачислен, skip.mp3 — неверный
    const earnSound = new Audio('earn.mp3');
    const failSound = new Audio('skip.mp3');
    earnSound.preload = 'auto';
    failSound.preload = 'auto';
    function playSound(a) {
        try {
            a.currentTime = 0;
            const p = a.play();
            if (p && p.catch) p.catch(() => {});
        } catch (_) {}
    }

    function fmt(v) { return Number(v || 0).toFixed(2); }

    // Модалка результата промокода: kind = 'ok' | 'fail'
    function showPromoModal(kind, title, text, amount) {
        const ok = kind === 'ok';
        document.getElementById('pm-card').className = 'pm-card ' + kind;
        document.getElementById('pm-skull').style.display = ok ? 'none' : 'block';
        document.getElementById('pm-title').innerText = title;
        document.getElementById('pm-text').innerText = text || '';
        const am = document.getElementById('pm-amount');
        am.style.display = ok && amount !== undefined ? 'flex' : 'none';
        if (ok && amount !== undefined) document.getElementById('pm-amount-val').innerText = '+' + fmt(amount);
        document.getElementById('pm-btn').innerText = ok ? 'Отлично' : 'Понятно';
        document.getElementById('pm-overlay').classList.add('open');
    }
    function closePromoModal() {
        document.getElementById('pm-overlay').classList.remove('open');
    }

    async function api(path, body) {
        const res = await fetch(BACKEND_URL + path, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ init_data: tg.initData, ...(body || {}) })
        });
        let data = {};
        try { data = await res.json(); } catch (_) {}
        return { ok: res.ok, data };
    }

    async function initProfile() {
        if (!user) return;
        document.getElementById('p-name').innerText = (user.username || user.first_name || "PLAYER").toUpperCase();
        document.getElementById('p-id').innerText = `ID: ${user.id}`;
        // Кнопка только для админа. Это лишь скрытие кнопки, настоящая проверка на сервере
        if (String(user.id) === ADMIN_TG_ID) document.getElementById('admin-btn').style.display = 'flex';
        document.getElementById('p-avatar').src = user.photo_url || `https://ui-avatars.com/api/?background=8f3f00&color=fff&name=${user.first_name}`;
        fetchBalance();
    }

    async function fetchBalance() {
        if (!user) return 0;
        try {
            const url = `${BACKEND_URL}/get_balance/${user.id}?username=${encodeURIComponent(user.username || user.first_name || 'Unknown')}&t=${Date.now()}`;
            const res = await fetch(url);
            const data = await res.json();
            const bal = Number(data.balance) || 0;
            document.getElementById('p-balance').innerText = fmt(bal);
            return bal;
        } catch (e) {
            console.error("Ошибка баланса:", e);
            return 0;
        }
    }

    let promoBusy = false;
    async function claimPromo() {
        if (promoBusy) return;
        const input = document.getElementById('promo-input');
        const btn = document.getElementById('promo-btn');
        const code = input.value.trim();
        if (!code) { showPromoModal('fail', 'Введите код', 'Поле пустое. Впишите промокод и нажмите ОК.'); return; }
        if (!user || !user.id || !tg.initData) { tg.showAlert("Ошибка: открой приложение через Telegram"); return; }

        promoBusy = true;
        btn.disabled = true;
        try {
            const { ok, data } = await api('/activate_promo', { code });
            if (ok && data.success) {
                playSound(earnSound);
                showPromoModal('ok', 'Промокод активирован', 'Звёзды уже на балансе', data.reward);
                document.getElementById('p-balance').innerText = fmt(data.new_balance);
                input.value = '';
            } else {
                playSound(failSound);
                showPromoModal('fail', 'Не получилось', data.detail || "Не удалось активировать");
            }
        } catch (e) {
            showPromoModal('fail', 'Нет связи', "Ошибка соединения с сервером.");
        }
        promoBusy = false;
        btn.disabled = false;
    }

    async function buyGift(name, price) {
        // 1. Проверка условий (друзья и задания)
        try {
            const res = await fetch(`${BACKEND_URL}/get_ref_stats/${user.id}`);
            const data = await res.json();
            const taskRes = await fetch(`${BACKEND_URL}/get_completed_tasks/${user.id}`);
            const taskData = await taskRes.json();

            const taskCount = taskData.completed ? taskData.completed.length : 0;
            const qualifiedRefs = data.ref_count || 0;

            if (qualifiedRefs < 3 || taskCount < 10) {
                let message = "⚠️ Недостаточно активности для заказа:\n\n";
                message += qualifiedRefs < 3 ? `• Пригласить 3 друзей (сейчас: ${qualifiedRefs}/3)\n` : "✅ 3 друга приглашено!\n";
                message += taskCount < 10 ? `• Выполнить 10 заданий (сейчас: ${taskCount}/10)` : "✅ 10 заданий выполнено!";
                tg.showAlert(message);
                return;
            }
        } catch (e) {
            tg.showAlert("Ошибка проверки условий. Попробуйте позже.");
            return;
        }

        // 2. Баланс
        const currentBalance = await fetchBalance();
        if (currentBalance < price) {
            tg.showAlert(`❌ Недостаточно звёзд!\nНужно: ${price}\nУ вас: ${fmt(currentBalance)}`);
            return;
        }

        // 3. Подтверждение и покупка (цену сервер берёт сам)
        tg.showConfirm(`Вы хотите купить "${name}" за ${price} ⭐?`, async (confirmed) => {
            if (!confirmed) return;
            try {
                const { ok, data } = await api('/buy_gift', { gift_name: name });
                if (ok && data.success) {
                    tg.showAlert(`✅ Покупка "${name}" успешна!\nАдмин скоро свяжется.`);
                    document.getElementById('p-balance').innerText = fmt(data.new_balance);
                } else if (data.error === 'balance') {
                    tg.showAlert("❌ Недостаточно звёзд!");
                } else if (data.error === 'conditions') {
                    tg.showAlert(`⚠️ Нужно 3 друга и 10 заданий.\nСейчас: ${data.refs}/3 друзей, ${data.tasks}/10 заданий`);
                } else {
                    tg.showAlert(`Ошибка: ${data.detail || "не удалось оформить заказ"}`);
                }
            } catch (e) {
                tg.showAlert("Ошибка сети или сервера.");
            }
        });
    }

    // Поднимающиеся искры (только оформление)
    (function makeSparks() {
        const box = document.getElementById('sparks');
        for (let i = 0; i < 22; i++) {
            const s = document.createElement('div');
            const size = 2 + Math.random() * 3;
            s.className = 'spark';
            s.style.width = s.style.height = size + 'px';
            s.style.left = Math.random() * 100 + '%';
            s.style.animationDuration = (6 + Math.random() * 8) + 's';
            s.style.animationDelay = (-Math.random() * 12) + 's';
            s.style.setProperty('--drift', (Math.random() * 60 - 30) + 'px');
            box.appendChild(s);
        }
    })();

    function initPage() {
        try { tg.expand(); tg.ready(); } catch (_) {}
        initProfile();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initPage);
    else initPage();
</script>
</body>
</html>
