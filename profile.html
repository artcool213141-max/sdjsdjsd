<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Profile - FixStars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    
    :root { 
        --bg-dark: #050a05; 
        --accent-green: #22c55e; 
        --deep-green: #14532d; 
        --glow-green: rgba(34, 197, 94, 0.2); 
    }

    body { 
        background-color: var(--bg-dark); 
        color: white; 
        font-family: 'Inter', sans-serif; 
        margin: 0; 
        min-height: 100vh;
        width: 100vw;
        overflow-x: hidden;
        user-select: none; 
        -webkit-tap-highlight-color: transparent; 
    }

    .main-wrapper { 
        background: radial-gradient(circle at 50% 10%, #064e3b 0%, #050a05 60%); 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        position: relative; 
        z-index: 1; 
    }

    .scrollable-content {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px 120px 20px;
    }

    .profile-card {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(34, 197, 94, 0.2);
        border-radius: 30px;
        padding: 30px 20px;
        text-align: center;
        backdrop-filter: blur(10px);
        margin-bottom: 20px;
    }

    .avatar-main {
        width: 100px;
        height: 100px;
        border-radius: 35px;
        border: 3px solid var(--accent-green);
        margin: 0 auto 15px;
        box-shadow: 0 0 20px var(--glow-green);
        object-fit: cover;
    }

    .ref-box, .promo-box {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 20px;
        padding: 15px;
        margin-top: 15px;
    }

    .ref-link-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px dashed var(--accent-green);
        color: var(--accent-green);
        padding: 10px;
        border-radius: 12px;
        font-size: 12px;
        word-break: break-all;
        margin-bottom: 15px;
    }

    .gifts-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px; 
        margin-top: 20px;
    }

    .gift-card {
        background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
        border: 1px solid rgba(34, 197, 94, 0.15);
        border-radius: 24px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        justify-content: space-between;
    }

    .gift-img {
        width: 60px;
        height: 60px;
        margin-bottom: 8px;
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.3));
    }

    .gift-name { font-weight: 800; text-transform: uppercase; font-size: 13px; margin-bottom: 4px; }
    
    .price-tag {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--accent-green);
        font-weight: 900;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .price-tag img { width: 14px; height: 14px; }

    /* Стиль для кнопки внутри карточки */
    .btn-withdraw {
        width: 100%;
        padding: 8px;
        background: var(--accent-green);
        color: black;
        font-weight: 900;
        font-size: 11px;
        text-transform: uppercase;
        border-radius: 12px;
        transition: all 0.2s;
    }
    .btn-withdraw:active { transform: scale(0.95); opacity: 0.8; }

    .dock-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(5, 10, 5, 0.96); border-top: 1px solid rgba(34, 197, 94, 0.2); display: flex; justify-content: space-around; padding: 12px 10px 34px 10px; z-index: 1000; backdrop-filter: blur(25px); height: 95px; }
    .dock-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4b5563; flex: 1; }
    .dock-btn.active { color: var(--accent-green); filter: drop-shadow(0 0 8px var(--accent-green)); }
</style>
</head>
<body>

    <div class="main-wrapper">
        <div class="scrollable-content">
            
            <div class="profile-card">
                <img id="p-avatar" src="" class="avatar-main shadow-2xl">
                <h2 id="p-name" class="text-2xl font-black italic uppercase tracking-tight">Загрузка...</h2>
                <p id="p-id" class="text-green-500 font-bold opacity-50 text-sm">ID: 00000000</p>

                <div class="ref-box">
                    <p class="text-[10px] font-black uppercase text-gray-400 mb-2">Твоя реферальная ссылка</p>
                    <div id="ref-link" class="ref-link-input">t.me/FixStarsOfficial_bot?start=id</div>
                    
                    <div class="flex justify-center gap-4 mt-4">
                        <div class="text-center">
                            <div id="ref-count" class="text-xl font-black">0</div>
                            <div class="text-[9px] uppercase font-bold text-green-500">Пригласил</div>
                        </div>
                        <div class="w-[1px] h-10 bg-white/10"></div>
                        <div class="text-center">
                            <div id="ref-earned" class="text-xl font-black">0</div>
                            <div class="text-[9px] uppercase font-bold text-green-500">Заработал</div>
                        </div>
                    </div>

                    <button onclick="copyRef()" class="w-full mt-4 py-3 bg-green-500 text-black font-black rounded-xl uppercase italic text-sm active:scale-95 transition-all">Пригласить друзей</button>
                </div>

                <div class="promo-box">
                    <p class="text-[10px] font-black uppercase text-gray-400 mb-2 text-left">Активация промокода</p>
                    <div class="flex gap-2">
                        <input type="text" id="promo-input" placeholder="ВВЕДИТЕ КОД" class="flex-1 bg-black/40 border border-white/10 text-white rounded-xl px-3 uppercase font-bold text-sm focus:outline-none focus:border-green-500">
                        <button onclick="claimPromo()" class="bg-white text-black font-black px-4 py-2.5 rounded-xl text-xs uppercase active:scale-95 transition-all">ОК</button>
                    </div>
                </div>

            </div>

            <div class="flex flex-col items-center justify-center mb-6 px-2 text-center">
                <p class="text-[10px] font-black uppercase text-green-500 opacity-60 tracking-widest mb-1">Доступно к выводу</p>
                <div class="flex items-center gap-3">
                    <span id="p-balance" class="text-5xl font-black italic tracking-tighter">0</span>
                    <img src="star.png" class="w-8 h-8 filter drop-shadow-[0_0_8px_rgba(34,197,94,0.5)]" alt="S">
                </div>
            </div>

            <div class="h-[1px] w-full bg-white/5 mb-8"></div>

<div class="gift-card">
    <img src="img/cccccerce.png" class="gift-img">

    <button class="btn-withdraw" onclick="buyGift('Сердечко', 15)">Вывести</button>

                <div class="gift-card" onclick="buyGift('Мишка', 15)">

                </div>

                <div class="gift-card" onclick="buyGift('Подарок', 25)">
                    <img src="img/pidarynok.png" class="gift-img" alt="G">

                <div class="gift-card" onclick="buyGift('Торт', 50)">

                </div>

                <div class="gift-card" onclick="buyGift('Букет', 50)">
                    <img src="img/buket.png" class="gift-img" alt="G">
                    <div class="gift-name">Букет</div>

                </div>

                <div class="gift-card" onclick="buyGift('Ракета', 50)">
                    <img src="img/raketa.png" class="gift-img" alt="G">
                    <div class="gift-name">Ракета</div>
                    <div class="price-tag">50 <img src="star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Кубок', 100)">
                    <img src="img/kypok.png" class="gift-img" alt="G">

                <div class="gift-card" onclick="buyGift('Кольцо', 100)">

                    <div class="price-tag">100 <img src="star.png"></div>
                </div>

                <div class="gift-card" onclick="buyGift('Бриллиант', 100)">
                    <img src="img/alik.png" class="gift-img" alt="G">

                    <div class="price-tag">100 <img src="star.png"></div>
                </div>
            </div>

        </div>

        <div class="dock-bar">
            <div onclick="location.href='index.html'" class="dock-btn">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>

            </div>

<script>
    const tg = window.Telegram.WebApp;
    const user = tg.initDataUnsafe?.user;
    // Подтягиваем start_param из ссылки Телеграма
    const startParam = tg.initDataUnsafe?.start_param; 
    
    const BACKEND_URL = 'https://sdjsdjsd.vercel.app';
    
    const BOT_TOKEN = '8693093466:AAG6_xEPTvZxQGAXQh1EymM12-Q_8nyIBYQ';
    const ADMIN_ID = '7140366080';

    function initProfile() {
        if (user) {
            document.getElementById('p-name').innerText = (user.username || user.first_name || "PLAYER").toUpperCase();
            document.getElementById('p-id').innerText = `ID: ${user.id}`;
            document.getElementById('p-avatar').src = user.photo_url || `https://ui-avatars.com/api/?background=14532d&color=fff&name=${user.first_name}`;
            
            // Формат: t.me/ИМЯ_БОТА/ИМЯ_ПРИЛОЖЕНИЯ?startapp=ID
            const refLink = `https://t.me/FixStarsOfficial_bot/app?startapp=${user.id}`;
            document.getElementById('ref-link').innerText = refLink;
            
            fetchBalance();
            fetchRefStats();
        }
    }

async function fetchBalance() {
        if (!user) return 0;
        try {
            // ВРЕМЕННЫЙ ТЕСТОВЫЙ АЛЕРТ: покажет, что видит фронтенд
            if (startParam) {
                tg.showAlert(`DEBUG: Обнаружен реферал! start_param = ${startParam}`);
            } else {
                tg.showAlert("DEBUG: Телеграм НЕ передал start_param. Он пустой.");
            }

            // Формируем URL для бэкенда
            let url = `${BACKEND_URL}/get_balance/${user.id}?username=${encodeURIComponent(user.username || user.first_name || 'Unknown')}`;
            
            if (startParam) {
                url += `&start_param=${encodeURIComponent(startParam)}`;
            }

            const res = await fetch(url);
            const data = await res.json();
            const bal = data.balance || 0;
            document.getElementById('p-balance').innerText = bal;
            return bal;
        } catch (e) {
            console.error("Ошибка баланса:", e);
            // Если упадет сетевая ошибка, тоже выведем на экран для дебага
            tg.showAlert("Ошибка запроса к бэкенду: " + e.message);
            return 0;
        }
    }

    async function fetchRefStats() {
        if (!user) return;
        try {
            const res = await fetch(`${BACKEND_URL}/get_ref_stats/${user.id}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('ref-count').innerText = data.ref_count || 0;
                document.getElementById('ref-earned').innerText = data.ref_earned || 0;
            }
        } catch (e) {
            console.error("Ошибка получения реф-статистики:", e);
        }
    }

    async function claimPromo() {
        const input = document.getElementById('promo-input');
        const code = input.value.trim();

        if (!code) {
            tg.showAlert("Введите промокод!");
            return;
        }

        try {
            const res = await fetch(`${BACKEND_URL}/activate_promo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: String(user.id), code: code })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                tg.showAlert(`🎉 Промокод успешно активирован!\nВам начислено: +${data.reward} ⭐`);
                document.getElementById('p-balance').innerText = data.new_balance;
                input.value = '';
            } else {
                tg.showAlert(`❌ Ошибка: ${data.detail || "Не удалось активировать"}`);
            }
        } catch (e) {
            tg.showAlert("Ошибка соединения с сервером.");
        }
    }

async function buyGift(name, price) {
    // 1. Сначала проверяем условия (друзья и задания)
    try {
        const res = await fetch(`${BACKEND_URL}/check_referral_bonus/${user.id}`);
        const data = await res.json();
        
        const taskRes = await fetch(`${BACKEND_URL}/get_completed_tasks/${user.id}`);
        const taskData = await taskRes.json();
        const taskCount = taskData.completed ? taskData.completed.length : 0;

        const qualifiedRefs = data.qualified_refs || 0;

        // Если условия не выполнены — показываем модалку и прерываем покупку
        if (qualifiedRefs < 3 || taskCount < 10) {
            let message = "⚠️ Недостаточно активности для заказа:\n\n";
            message += qualifiedRefs < 3 ? `• Пригласить 3 друзей (сейчас: ${qualifiedRefs}/3)\n` : "✅ 3 друга приглашено!\n";
            message += taskCount < 10 ? `• Выполнить 10 заданий (сейчас: ${taskCount}/10)` : "✅ 10 заданий выполнено!";
            
            tg.showAlert(message);
            return; // Дальше код не идет
        }
    } catch (e) {
        tg.showAlert("Ошибка проверки условий. Попробуйте позже.");
        return;
    }

    // 2. Если условия выполнены, проверяем баланс
    const currentBalance = await fetchBalance();
    if (currentBalance < price) {
        tg.showAlert(`❌ Недостаточно звёзд!\nНужно: ${price}\nУ вас: ${currentBalance}`);
        return;
    }

    // 3. Если всё ок, подтверждаем покупку
    tg.showConfirm(`Вы хотите купить "${name}" за ${price} ⭐?`, async (confirmed) => {
        if (confirmed) {
            try {
                const res = await fetch(`${BACKEND_URL}/update_balance`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: String(user.id), amount: -price })
                });

                if (res.ok) {
                    await notifyAdmin(name, price);
                    tg.showAlert(`✅ Покупка "${name}" успешна!\nАдмин скоро свяжется.`);
                    fetchBalance();
                } else {
                    tg.showAlert("Ой! Ошибка при списании баллов.");
                }
            } catch (e) {
                tg.showAlert("Ошибка сети или сервера.");
            }
        }
    });
}

// Замените переменную ADMIN_ID на жестко заданную прямо в функции
async function notifyAdmin(giftName, price) {
    const ADMIN_ID = '8015661230'; // ID администратора
    
    // Формируем красивое сообщение для админа
    const message = `
🎁 **НОВАЯ ЗАЯВКА НА ВЫВОД**

👤 **Пользователь:** ${user.first_name || 'Без имени'}
🆔 **Telegram ID:** ${user.id}
🔗 **Username:** @${user.username || 'отсутствует'}
🏷 **Тип товара:** ${giftName}
💰 **Стоимость:** ${price} ⭐

Статус: **Ожидает проверки условий**
`;

    try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: ADMIN_ID, 
                text: message,
                parse_mode: 'Markdown' // Добавили поддержку жирного шрифта
            })
        });

        if (!response.ok) {
            console.error("Ошибка при отправке админу, статус:", response.status);
        }
    } catch (e) {
        console.error("Ошибка сети при отправке админу:", e);
    }
}

    function copyRef() {
        const link = document.getElementById('ref-link').innerText;
        const fullUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Присоединяйся к FixStars! 🌟')}`;
        tg.openTelegramLink(fullUrl);
    }

    window.onload = () => {
        tg.expand();
        initProfile();
    };
</script>
