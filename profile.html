<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PandaGift - Профиль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{--bg-dark:#07173f;--blue:#2f6bff;--blue-light:#8fc2ff;--glass:rgba(255,255,255,.12);--glass-line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
body{background:var(--bg-dark);color:#fff;font-family:'Inter',sans-serif;margin:0;height:100vh;width:100vw;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#stars-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.main-wrapper{background:radial-gradient(circle at 50% 10%,#4a86ff 0%,rgba(47,107,255,.35) 26%,transparent 60%),linear-gradient(180deg,#1f55d6 0%,#133ea6 42%,#08205f 100%);height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
.scrollable-content{flex:1;overflow-y:auto;padding:24px 24px 120px;scrollbar-width:none}
.scrollable-content::-webkit-scrollbar{display:none}
.italic-title{font-weight:900;font-style:italic;text-transform:uppercase}

.profile-head{text-align:center;margin:10px 0 22px}
.avatar-wrap{position:relative;width:96px;margin:0 auto}
.avatar-wrap::before{content:'';position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,rgba(190,220,255,.5) 0%,rgba(120,170,255,.15) 45%,transparent 70%);animation:glow 4s ease-in-out infinite}
.avatar-wrap img{position:relative;width:96px;height:96px;border-radius:28px;object-fit:cover;background:#0a2468;border:2px solid rgba(255,255,255,.6);box-shadow:0 10px 24px rgba(0,20,90,.45)}
.online{position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--blue-light);border:3px solid #0a2468}
@keyframes glow{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:.9;transform:scale(1.05)}}
#u-name{font-size:22px;margin:16px 0 0;letter-spacing:-.3px;text-shadow:0 4px 18px rgba(0,20,100,.55)}
#u-id{font-size:11px;font-weight:700;color:#cfe0ff;margin-top:4px;opacity:.85}

.card{background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,.06) 100%);border:1px solid var(--glass-line);border-radius:24px;padding:18px;margin-bottom:12px;backdrop-filter:blur(10px)}
.card-title{font-size:16px;line-height:1;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
.card-title img{width:32px;height:32px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,20,90,.4))}
.card-desc{font-size:10px;font-weight:700;color:#cfe0ff;text-transform:uppercase;margin-top:8px}

.bal-row{display:flex;gap:8px;margin-top:14px}
.bal-pill{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 12px 8px 10px;border-radius:999px;background:var(--glass);border:1px solid #000;backdrop-filter:blur(10px)}
.bal-pill img{width:20px;height:20px;object-fit:contain}
.bal-pill span{font-weight:900;font-size:15px}
.btn{border:none;border-radius:999px;padding:14px 20px;background:linear-gradient(180deg,#4f8cff,#1d4ed8);color:#fff;font:italic 900 12px 'Inter',sans-serif;text-transform:uppercase;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--glass);border:1px solid var(--glass-line);box-shadow:none}
.btn.link{background:none;box-shadow:none;color:#8fb0f0;padding:8px}
.inv-head{display:flex;align-items:center;justify-content:space-between}
.inv-badge{min-width:26px;height:26px;padding:0 8px;border-radius:999px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.inv-total{display:flex;gap:8px;margin-top:12px}
.inv-chip{display:flex;align-items:center;gap:6px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(3,14,60,.4);border:1px solid var(--glass-line);font-weight:900;font-size:13px}
.inv-chip img{width:18px;height:18px;object-fit:contain}
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.inv-slot{padding:6px;border-radius:22px;background:rgba(3,14,60,.38);border:1px solid var(--glass-line);cursor:pointer;transition:transform .15s,border-color .15s}
.inv-slot:active{transform:scale(.95);border-color:#fff}
.nft-img{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.08)}
.nft-img img{width:100%;height:100%;object-fit:cover;display:block}
.nft-img::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);pointer-events:none}
.nft-img.big{width:150px;margin:0 auto;border-radius:26px;box-shadow:0 12px 26px rgba(0,20,90,.5)}
.price-stack{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.price-pill{display:flex;align-items:center;justify-content:center;gap:4px;height:22px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:900;font-size:10px;white-space:nowrap}
.price-pill img{width:12px;height:12px;object-fit:contain;flex-shrink:0}
.price-row{display:flex;justify-content:center;gap:8px;margin-bottom:18px}
.price-row .price-pill{height:30px;padding:0 14px;gap:6px;font-size:14px}
.price-row .price-pill img{width:18px;height:18px}
.inv-empty{margin-top:14px;padding:22px 12px;text-align:center;border:1px dashed var(--glass-line);border-radius:20px;font-size:12px;font-weight:700;color:#cfe0ff;line-height:1.5}
.inv-empty a{color:#fff;font-weight:900;text-decoration:underline}
#item-modal{position:fixed;inset:0;z-index:100002;display:none;align-items:center;justify-content:center;background:rgba(2,10,40,.8);backdrop-filter:blur(6px)}
#item-modal.show{display:flex}
.item-box{width:84%;max-width:340px;padding:26px 22px 18px;text-align:center;border-radius:28px;background:linear-gradient(180deg,#1c4bc4 0%,#0a2468 100%);border:1px solid var(--glass-line)}
.item-name{font-size:20px;margin:16px 0 12px}
.item-actions{display:flex;flex-direction:column;gap:10px}
.btn.wide{width:100%;display:block;text-align:center;text-decoration:none;padding:16px;font-size:14px}

.promo-row{display:flex;gap:8px;margin-top:14px}
.promo-row input{flex:1;min-width:0;padding:14px;border-radius:16px;border:1px solid var(--glass-line);background:rgba(3,14,60,.45);color:#fff;font:800 14px 'Inter',sans-serif;text-transform:uppercase;outline:none;user-select:text}
.promo-row input:focus{border-color:var(--blue-light)}
.promo-row input::placeholder{color:#8fb0f0}

.dock-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(8,28,92,.92);border-top:1px solid var(--glass-line);display:flex;justify-content:space-around;padding:12px 10px 34px;z-index:1000;backdrop-filter:blur(25px);height:95px}
.dock-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#8fb0f0;flex:1;cursor:pointer}
.dock-btn.active{color:#fff}
.dock-btn svg{width:28px;height:28px}
.dock-btn span{font-size:10px;font-weight:900;font-style:italic;text-transform:uppercase}
.dock-center{color:#e3eeff}
.dock-center .ico{width:54px;height:54px;margin:-13px 0;transform:translateY(-16px);border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#5b94ff,#1d4ed8);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:0 6px 16px rgba(5,25,100,.6),inset 0 1px 0 rgba(255,255,255,.35)}

#loader{position:fixed;inset:0;background:var(--bg-dark);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .25s}
#loader.hidden{opacity:0;pointer-events:none}
.ring{width:50px;height:50px;border:3px solid #12308a;border-left-color:var(--blue-light);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.avatar-wrap::before,.ring{animation:none}}
</style>
</head>
<body>

<div id="loader">
    <div class="ring"></div>
    <div class="italic-title" style="margin-top:16px;color:#8fc2ff;letter-spacing:3px;font-size:14px">PandaGift</div>
</div>

<canvas id="stars-canvas"></canvas>

<div class="main-wrapper">
<div class="scrollable-content">

    <div class="profile-head">
        <div class="avatar-wrap">
            <img id="u-avatar" src="" alt="">
            <div class="online"></div>
        </div>
        <h1 id="u-name" class="italic-title">Загрузка...</h1>
        <div id="u-id">ID: ...</div>
    </div>

    <section class="card">
        <div class="card-title italic-title">Ваш баланс</div>
        <div class="bal-row">
            <div class="bal-pill"><img src="img/star.png" alt="Stars"><span id="bal-stars">0.00</span></div>
            <div class="bal-pill"><img src="img/ton.png" alt="TON"><span id="bal-ton">0.00</span></div>
        </div>
    </section>

    <section class="card">
        <div class="card-title italic-title">Промокод</div>
        <div class="card-desc">Введите код и получите бонус</div>
        <div class="promo-row">
            <input id="promo-input" type="text" maxlength="64" placeholder="Введите промокод" autocomplete="off">
            <button class="btn" id="promo-btn" onclick="handlePromo()">Ок</button>
        </div>
    </section>

    <section class="card">
        <div class="inv-head">
            <div class="card-title italic-title">Инвентарь</div>
            <div class="inv-badge" id="inv-badge">0</div>
        </div>
        <div class="card-desc">NFT из кейсов можно продать или вывести</div>
        <div class="inv-total">
            <div class="inv-chip"><img src="img/star.png" alt="Stars"><span id="inv-sum-stars">0</span></div>
            <div class="inv-chip"><img src="img/ton.png" alt="TON"><span id="inv-sum-ton">0</span></div>
        </div>
        <div id="inv-grid" class="inv-grid"></div>
        <div id="inv-empty" class="inv-empty">Пока пусто. Открывайте <a href="case.html">кейсы</a>, и NFT появятся здесь.</div>
    </section>

</div>

<nav class="dock-bar">
    <div onclick="location.href='index.html'" class="dock-btn">
        <svg fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
        <span>Главная</span>
    </div>
    <div onclick="location.href='ref.html'" class="dock-btn dock-center">
        <div class="ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="4.5" cy="9.5" r="2.2"/><circle cx="19.5" cy="9.5" r="2.2"/><path d="M1 18c0-2 1.3-3.5 3.5-3.7"/><path d="M23 18c0-2-1.3-3.5-3.5-3.7"/></svg>
        </div>
        <span>Рефералы</span>
    </div>
    <div class="dock-btn active">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span>Профиль</span>
    </div>
</nav>
</div>

<div id="item-modal" onclick="closeItem()">
    <div class="item-box" onclick="event.stopPropagation()">
        <div class="nft-img big"><img id="item-img" src="" alt=""></div>
        <div id="item-name" class="item-name italic-title"></div>
        <div class="price-row">
            <div class="price-pill"><img src="img/star.png" alt="Stars"><span id="item-p-stars">0</span></div>
            <div class="price-pill"><img src="img/ton.png" alt="TON"><span id="item-p-ton">0</span></div>
        </div>
        <div class="item-actions">
            <button class="btn wide" id="item-withdraw" onclick="withdrawItem()">Вывести</button>
            <button class="btn wide ghost" id="item-sell" onclick="sellItem()">Продать</button>
            <button class="btn wide ghost" id="item-sell-ton" onclick="sellItemTon()">Продать за TON</button>
            <button class="btn wide" id="item-upgrade" onclick="upgradeItem()">Улучшить</button>
            <button class="btn link" onclick="closeItem()">Закрыть</button>
        </div>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
const BACKEND_URL = 'https://sdjsdjsd.vercel.app';

const tgUser = tg.initDataUnsafe?.user;
const user = (tgUser && tgUser.id) ? tgUser : { id: '12345', first_name: 'Тестер' };

function notify(msg) { if (tg.showAlert) tg.showAlert(msg); else alert(msg); }
function haptic(kind, type) { try { tg.HapticFeedback[kind](type); } catch (e) {} }

async function api(path, body) {
    const res = await fetch(`${BACKEND_URL}${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tg.initData, ...body })
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error(data.error || data.detail || ('HTTP ' + res.status));
    return data;
}

async function syncData() {
    try {
        const username = user.username || `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Player';
        const res = await fetch(`${BACKEND_URL}/get_balance/${user.id}?username=${encodeURIComponent(username)}&t=${Date.now()}`);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const stars = Number(data.balance) || 0;
        document.getElementById('bal-stars').innerText = stars.toFixed(2);
        document.getElementById('bal-ton').innerText = (Number(data.ton_balance) || 0).toFixed(2);
        return stars;
    } catch (e) {
        console.warn('Не удалось обновить баланс:', e);
        return null;
    }
}

async function handlePromo() {
    const input = document.getElementById('promo-input');
    const btn = document.getElementById('promo-btn');
    const code = input.value.trim();
    if (!code) { notify('Введите промокод'); return; }
    btn.disabled = true;
    try {
        const r = await api('/activate_promo', { code });
        haptic('notificationOccurred', 'success');
        notify(`Промокод активирован: +${r.reward} Stars`);
        input.value = '';
        syncData();
    } catch (e) {
        haptic('notificationOccurred', 'error');
        notify(e.message);
    } finally {
        btn.disabled = false;
    }
}

let inventory = [];
let withdrawFee = 0;
let selectedItem = null;
let invBusy = false;

function previewUrl(it) { return `${BACKEND_URL}/inventory/preview/${it.nft_id}`; }

async function loadInventory() {
    try {
        const r = await api('/inventory/list', {});
        inventory = Array.isArray(r.items) ? r.items : [];
        withdrawFee = Number(r.withdraw_fee) || 0;
        renderInventory();
    } catch (e) { console.warn('Инвентарь не загружен:', e); }
}

function fmt(n) { return Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 }); }

function imgFallback(img) {
    img.onerror = () => {
        img.onerror = null;
        img.src = 'img/star.png';
        img.style.objectFit = 'contain';
        img.style.padding = '22%';
        img.style.boxSizing = 'border-box';
    };
}

function renderInventory() {
    const grid = document.getElementById('inv-grid');
    grid.innerHTML = '';
    document.getElementById('inv-badge').innerText = inventory.length;
    document.getElementById('inv-empty').style.display = inventory.length ? 'none' : 'block';

    let sumStars = 0, sumTon = 0;
    inventory.forEach(it => {
        sumStars += Number(it.price_stars) || 0;
        sumTon += Number(it.price_ton) || 0;

        const slot = document.createElement('div');
        slot.className = 'inv-slot';
        slot.innerHTML =
            '<div class="nft-img"><img alt=""></div>' +
            '<div class="price-stack">' +
            '<div class="price-pill"><img src="img/star.png" alt=""><span></span></div>' +
            '<div class="price-pill"><img src="img/ton.png" alt=""><span></span></div>' +
            '</div>';
        const img = slot.querySelector('.nft-img img');
        img.alt = it.name;
        img.loading = 'lazy';
        imgFallback(img);
        img.src = previewUrl(it);
        const spans = slot.querySelectorAll('.price-pill span');
        spans[0].textContent = fmt(it.price_stars);
        spans[1].textContent = fmt(it.price_ton);
        slot.onclick = () => openItem(it);
        grid.appendChild(slot);
    });

    document.getElementById('inv-sum-stars').textContent = fmt(Math.round(sumStars * 1000) / 1000);
    document.getElementById('inv-sum-ton').textContent = fmt(Math.round(sumTon * 1000) / 1000);
}

function openItem(it) {
    selectedItem = it;
    const img = document.getElementById('item-img');
    img.style.objectFit = '';
    img.style.padding = '';
    imgFallback(img);
    img.src = previewUrl(it);
    document.getElementById('item-name').innerText = it.name;
    document.getElementById('item-p-stars').innerText = fmt(it.price_stars);
    document.getElementById('item-p-ton').innerText = fmt(it.price_ton);
    document.getElementById('item-sell').innerHTML = 'Продать за <img src="img/star.png" alt="" style="width:16px;height:16px;vertical-align:middle;margin-left:4px;">';
    document.getElementById('item-sell-ton').innerHTML = 'Продать за <img src="img/ton.png" alt="" style="width:16px;height:16px;vertical-align:middle;margin-left:4px;">';
    document.getElementById('item-withdraw').innerText = withdrawFee > 0 ? `Вывести (${withdrawFee} Stars)` : 'Вывести';
    document.getElementById('item-modal').classList.add('show');
}
function closeItem() {
    document.getElementById('item-modal').classList.remove('show');
}

function confirmAction(text, onOk) {
    if (tg.showConfirm) tg.showConfirm(text, ok => { if (ok) onOk(); });
    else if (confirm(text)) onOk();
}

async function sellItem() {
    if (!selectedItem || invBusy) return;
    const it = selectedItem;
    confirmAction(`Продать «${it.name}» за ${Number(it.price_stars)} Stars?`, async () => {
        invBusy = true;
        closeItem();
        try {
            await api('/inventory/sell', { nft_id: it.nft_id });
            haptic('notificationOccurred', 'success');
            notify(`Предмет продан: +${Number(it.price_stars)} Stars`);
        } catch (e) {
            haptic('notificationOccurred', 'error');
            notify(e.message);
        } finally {
            invBusy = false;
            syncData();
            loadInventory();
        }
    });
}

async function sellItemTon() {
    if (!selectedItem || invBusy) return;
    const it = selectedItem;
    const priceTon = Number(it.price_ton) || 0;
    if (priceTon <= 0) { notify('У предмета нет цены в TON'); return; }
    confirmAction(`Продать «${it.name}» за ${priceTon} TON?`, async () => {
        invBusy = true;
        closeItem();
        try {
            await api('/inventory/sell_ton', { nft_id: it.nft_id });
            haptic('notificationOccurred', 'success');
            notify(`Предмет продан: +${priceTon} TON`);
        } catch (e) {
            haptic('notificationOccurred', 'error');
            notify(e.message);
        } finally {
            invBusy = false;
            syncData();
            loadInventory();
        }
    });
}

function upgradeItem() {
    if (!selectedItem) return;
    const id = selectedItem.nft_id;
    closeItem();
    tg.openLink(`${BACKEND_URL}/update.html?nft_id=${id}`);
}

async function withdrawItem() {
    if (!selectedItem || invBusy) return;
    const it = selectedItem;
    const feeText = withdrawFee > 0 ? ` С баланса спишется ${withdrawFee} Stars.` : '';
    confirmAction(`Вывести «${it.name}»?${feeText}`, async () => {
        invBusy = true;
        closeItem();
        try {
            await api('/inventory/withdraw', { nft_id: it.nft_id });
            haptic('notificationOccurred', 'success');
            notify('Заявка успешно создана! Ожидайте вывода.');
            
            await syncData();
            await loadInventory();
            
        } catch (e) {
            haptic('notificationOccurred', 'error');
            notify('Ошибка: ' + e.message);
        } finally {
            invBusy = false;
        }
    });
}

/* ---------- фон: пузырьки ---------- */
const canvas = document.getElementById('stars-canvas');
const ctx = canvas.getContext('2d');
let bubbles = [];
function initBubbles() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    bubbles = Array.from({ length: 30 }, () => ({
        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
        size: Math.random() * 2.2 + .6, speed: Math.random() * .35 + .1,
        drift: (Math.random() - .5) * .25, opacity: Math.random() * .45 + .15,
        bright: Math.random() < .4
    }));
}
function animateBubbles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles.forEach(s => {
        ctx.beginPath();
        ctx.globalAlpha = s.opacity;
        ctx.fillStyle = s.bright ? '#ffffff' : '#9cc4ff';
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
        s.y -= s.speed; s.x += s.drift;
        if (s.y < -5) { s.y = canvas.height + 5; s.x = Math.random() * canvas.width; }
    });
    requestAnimationFrame(animateBubbles);
}
initBubbles(); animateBubbles();
addEventListener('resize', initBubbles);

/* ---------- старт ---------- */
window.onload = async () => {
    try {
        tg.expand(); tg.ready();
        tg.headerColor = '#1f55d6';
        tg.backgroundColor = '#08205f';
    } catch (e) {}

    const name = user.username ? '@' + user.username : (user.first_name || 'Player');
    document.getElementById('u-name').innerText = name;
    document.getElementById('u-id').innerText = 'ID: ' + user.id;
    document.getElementById('u-avatar').src = user.photo_url ||
        `https://ui-avatars.com/api/?background=1d4ed8&color=fff&name=${encodeURIComponent(user.first_name || 'T')}`;

    await Promise.all([syncData(), loadInventory()]);
    document.getElementById('loader').classList.add('hidden');
};
setTimeout(() => document.getElementById('loader').classList.add('hidden'), 3500);
</script>
</body>
</html>
