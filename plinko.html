<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PandaGift - Plinko</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');
:root{--bg:#12306f;--blue:#3b78ff;--blue-light:#9fcfff;--soft:#dce9ff;--gold:#ffd24a;--danger:#ff6b6b;--success:#43d9a3;--muted:#a3b3dd;--panel:#1b3d8a;--line:rgba(255,255,255,.12);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:#fff;font-family:'Montserrat',sans-serif}
body{min-height:100dvh;background:linear-gradient(180deg,#1a3f8f 0%,#12306f 100%)}
.num{font-variant-numeric:tabular-nums}
.ic{width:14px;height:14px;object-fit:contain;vertical-align:-2px}
header{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + var(--safe-top)) 14px 10px;background:rgba(18,48,111,.88);border-bottom:1px solid var(--line);z-index:50;backdrop-filter:blur(10px)}
.left{display:flex;align-items:center;gap:10px}
.back-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.12);cursor:pointer}
.brand{font-weight:900;font-style:italic;letter-spacing:-.03em;font-size:1.1rem;text-transform:uppercase}
.brand span{color:var(--blue-light)}
.tag{margin-left:6px;font-size:.6rem;font-weight:900;padding:2px 7px;border-radius:6px;background:var(--blue);vertical-align:2px}
.balances{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-weight:800;font-size:.8rem}
.pill img{width:15px;height:15px;object-fit:contain}
.history{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none;background:rgba(10,28,70,.35);border-bottom:1px solid var(--line);min-height:38px;align-items:center}
.history::-webkit-scrollbar{display:none}
.hchip{flex:0 0 auto;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:900;background:rgba(255,255,255,.1);border:1px solid var(--line)}
.hchip.win{color:var(--success)}.hchip.big{color:var(--gold);border-color:rgba(255,210,74,.5)}.hchip.lose{color:var(--muted)}
.hempty{font-size:11px;font-weight:700;color:var(--muted)}
.stage{padding:12px 10px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;background:radial-gradient(ellipse at 50% 100%,rgba(59,120,255,.3),transparent 65%)}
canvas{width:100%;max-width:380px;aspect-ratio:360/400;display:block}
.status{font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);background:rgba(18,48,111,.8);border:1px solid var(--line);padding:5px 14px;border-radius:999px;min-height:26px;text-align:center}
.status.win{color:var(--success);border-color:rgba(67,217,163,.5)}.status.lose{color:var(--danger)}
.panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px calc(14px + var(--safe-bottom));display:flex;flex-direction:column;gap:8px}
.modes{display:flex;gap:8px}
.mode{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.08);border:1px solid var(--line);cursor:pointer}
.mode img{width:14px;height:14px}
.mode.active{background:var(--blue);color:#fff;border-color:var(--blue-light);box-shadow:0 0 12px rgba(59,120,255,.5)}
.row{display:flex;gap:8px}
.field{flex:1;background:rgba(10,28,70,.45);border:1px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.field label{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.field input{background:transparent;border:0;outline:0;color:var(--blue-light);font:900 1.1rem 'Montserrat',sans-serif;width:100%;padding:0}
.gift-btn{display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-size:11px;font-weight:800;color:var(--soft);cursor:pointer;max-width:44%}
.gift-btn svg{width:14px;height:14px;flex-shrink:0}
.gift-btn.sel{border-color:var(--gold);color:var(--gold)}
.gift-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.quick{display:flex;gap:6px}
.quick div{flex:1;text-align:center;padding:6px 0;border-radius:8px;font-size:11px;font-weight:700;color:var(--soft);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);cursor:pointer}
.quick div:active{background:rgba(255,255,255,.25)}
.worth{font-size:11px;font-weight:700;color:var(--muted);text-align:center;min-height:14px}
.worth b{color:var(--gold)}
.btn-main{width:100%;padding:13px 0;border:0;border-radius:12px;background:var(--blue);color:#fff;font:900 .95rem 'Montserrat',sans-serif;text-transform:uppercase;box-shadow:0 6px 18px rgba(59,120,255,.4);cursor:pointer}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{filter:grayscale(.6);opacity:.5;box-shadow:none}
.overlay{position:fixed;inset:0;background:rgba(6,16,45,.75);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:#193a84;border:1px solid rgba(255,255,255,.2);border-radius:20px;width:100%;max-width:360px;max-height:78vh;display:flex;flex-direction:column;padding:16px}
.modal-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:13px}
.modal-head button{background:none;border:0;color:var(--muted);font:700 12px 'Montserrat',sans-serif;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;padding:4px;margin-top:12px}
.inv{background:rgba(10,28,70,.4);border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;cursor:pointer;position:relative}
.inv img{width:48px;height:48px;object-fit:contain;border-radius:10px}
.inv .n{font-size:10px;font-weight:700;color:var(--soft);word-break:break-word}
.inv .p{font-size:10px;font-weight:800;color:var(--gold)}
.inv .c{position:absolute;top:4px;right:6px;font-size:10px;font-weight:900;color:var(--blue-light)}
.empty{grid-column:1/-1;text-align:center;font-size:12px;color:var(--muted);padding:18px 0}
#toast{position:fixed;left:50%;top:calc(65px + var(--safe-top));transform:translate(-50%,-20px);z-index:2000;opacity:0;pointer-events:none;background:#12306f;border:1px solid var(--blue-light);padding:9px 16px;border-radius:10px;font-weight:800;font-size:12px;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.win{border-color:var(--success);color:var(--success)}#toast.lose{border-color:var(--danger);color:var(--danger)}
</style>
</head>
<body>
<header>
  <div class="left">
    <div class="back-btn" onclick="location.href='games.html'"><svg fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" width="16" height="16"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg></div>
    <div class="brand">Panda<span>Gift</span><span class="tag">PLINKO</span></div>
  </div>
  <div class="balances">
    <div class="pill"><span id="val-stars" class="num">0</span><img src="img/star.png" alt=""></div>
    <div class="pill"><span id="val-ton" class="num">0.00</span><img src="img/ton.png" alt=""></div>
  </div>
</header>

<div id="history" class="history"><span class="hempty">Бросков пока нет</span></div>

<div class="stage">
  <canvas id="board"></canvas>
  <div id="status" class="status">Сделайте ставку</div>
</div>

<div class="panel">
  <div class="modes">
    <div id="mode-stars" class="mode active" onclick="switchMode('stars')"><img src="img/star.png" alt=""> STARS</div>
    <div id="mode-ton" class="mode" onclick="switchMode('ton')"><img src="img/ton.png" alt=""> TON</div>
  </div>
  <div class="row">
    <div class="field"><label>Размер ставки</label><input type="number" id="input-bet" class="num" value="10" min="0" step="any" inputmode="decimal"></div>
  </div>
  <div class="quick" id="quick"></div>
  <div class="worth" id="worth"></div>
  <button id="btn-main" class="btn-main" onclick="drop()">Сбросить шарик</button>
</div>

<div id="toast"></div>

<script>
const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); } catch(e){}
const tgUser = tg.initDataUnsafe?.user;
const UID = tgUser ? String(tgUser.id) : '12345';

let cur = 'stars', busy = false, ratio = 80;
let me = { balance: 0, ton: 0 };
let BUCKETS = [10, 2, 1, 0.5, 0.2, 0.5, 1.5, 2, 5];
const ROWS = 8, W = 360, H = 400, SP = 36, DY = 38, TOP = 40, CX = W / 2;

const $ = id => document.getElementById(id);
const STAR = '<img src="img/star.png" class="ic" alt="">', TON = '<img src="img/ton.png" class="ic" alt="">';
const round2 = n => Math.round(n * 100) / 100;
const haptic = (k, t) => { try { tg.HapticFeedback?.[k]?.(t); } catch(e){} };
function toast(msg, kind = ''){
  const t = $('toast'); t.className = kind; t.textContent = msg; void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function setStatus(txt, kind = ''){ const s = $('status'); s.className = 'status ' + kind; s.textContent = txt; }

const BASES = ['', '/api', 'https://sdjsdjsd.vercel.app']; let baseIdx = 0;
async function api(path, opts = {}){
  let lastErr = null;
  for (let k = 0; k < BASES.length; k++) {
    const i = (baseIdx + k) % BASES.length, url = BASES[i] + path;
    try {
      const res = await fetch(url, { method: opts.method || 'GET',
        headers: { 'Content-Type': 'application/json', 'x-init-data': tg.initData || '' },
        body: opts.body ? JSON.stringify(opts.body) : undefined });
      let data = null; try { data = await res.json(); } catch(e){}
      const nf = res.status === 404 && !(data && data.detail && data.detail !== 'Not Found');
      if (nf || (data === null && !res.ok)) { lastErr = new Error('HTTP ' + res.status); continue; }
      if (!res.ok) { let d = data && (data.detail ?? data.error); if (d && typeof d !== 'string') d = JSON.stringify(d);
        const err = new Error(d || 'HTTP ' + res.status); err.server = true; throw err; }
      baseIdx = i; return data;
    } catch(e){ if (e.server) throw e; lastErr = e; }
  }
  throw lastErr || new Error('нет ответа');
}

/* ---------- board ---------- */
const cv = $('board'), ctx = cv.getContext('2d'), dpr = Math.min(window.devicePixelRatio || 1, 3);
cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
let ball = null, hot = -1;
const slotX = k => CX + (k - ROWS / 2) * SP;
const pegX = (i, j) => CX + (j - i / 2) * SP;

function badgeColor(m){ return m >= 5 ? '#ffd24a' : m >= 1.5 ? '#43d9a3' : m >= 1 ? '#6fb1ff' : '#ff7b7b'; }
function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  for (let i = 0; i < ROWS; i++) for (let j = 0; j <= i; j++) {
    ctx.beginPath(); ctx.arc(pegX(i, j), TOP + i * DY, 3.6, 0, 7); ctx.fill();
  }
  const by = TOP + ROWS * DY + 6;
  BUCKETS.forEach((m, k) => {
    const x = slotX(k) - SP / 2 + 2, w = SP - 4;
    ctx.fillStyle = badgeColor(m); ctx.globalAlpha = hot === k ? 1 : .85;
    ctx.beginPath(); ctx.roundRect(x, by + (hot === k ? 4 : 0), w, 30, 6); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#0b1f52'; ctx.font = '900 10px Montserrat,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(m + 'x', x + w / 2, by + (hot === k ? 4 : 0) + 19);
  });
  if (ball) {
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 8, 0, 7);
    ctx.fillStyle = '#ffd24a'; ctx.shadowColor = 'rgba(255,210,74,.8)'; ctx.shadowBlur = 12; ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
}
draw();

function makePath(slot){
  const p = Array(ROWS).fill(false); for (let i = 0; i < slot; i++) p[i] = true;
  for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  return p;
}
function runBall(){
  const STEP = 140, t0 = performance.now(), Y0 = 6, Y1 = TOP - 12;
  let pts = null, tStart = 0, slotFinal = 0, stopped = false, resolveDone;
  const done = new Promise(r => resolveDone = r);
  hot = -1;
  function setSlot(slot){
    const path = makePath(slot); let k = 0;
    slotFinal = slot;
    pts = [{ x: CX, y: Y0 }, { x: CX, y: Y1 }];
    for (let i = 0; i < ROWS; i++) {
      if (i > 0) pts.push({ x: pegX(i, k), y: TOP + i * DY - 12 });
      if (path[i]) k++;
    }
    pts.push({ x: slotX(k), y: TOP + ROWS * DY + 20 });
    tStart = Math.max(performance.now(), t0 + STEP);
  }
  function stop(){ stopped = true; ball = null; draw(); }
  (function frame(now){
    if (stopped) return;
    if (!pts) {   // ждём ответ сервера: шарик уже летит к первому колышку
      const t = Math.min((now - t0) / STEP, 1);
      ball = { x: CX, y: Y0 + (Y1 - Y0) * t + (t >= 1 ? Math.sin(now / 110) * 2.5 : 0) };
      draw(); return requestAnimationFrame(frame);
    }
    const total = (pts.length - 2) * STEP, e = Math.min(Math.max(0, now - tStart), total);
    const s = Math.min(1 + Math.floor(e / STEP), pts.length - 2), t = (e - (s - 1) * STEP) / STEP;
    const a = pts[s], b = pts[s + 1];
    ball = { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t - Math.sin(Math.PI * t) * 9 };
    draw();
    if (e < total) requestAnimationFrame(frame);
    else { ball = null; hot = slotFinal; draw(); resolveDone(); }
  })(performance.now());
  return { setSlot, stop, done };
}

/* ---------- ui ---------- */
function paintBalances(){ $('val-stars').textContent = String(Math.floor(me.balance)); $('val-ton').textContent = Number(me.ton).toFixed(2); }
function renderQuick(){
  const vals = cur === 'ton' ? [0.1, 0.5, 1, 5] : [10, 50, 100, 500], q = $('quick'); q.innerHTML = '';
  vals.forEach(v => { const d = document.createElement('div'); d.textContent = '+' + v; d.onclick = () => addBet(v); q.appendChild(d); });
  [['½', halveBet], ['2×', doubleBet], ['MAX', maxBet]].forEach(([t, f]) => { const d = document.createElement('div'); d.textContent = t; d.onclick = f; q.appendChild(d); });
}
function updateWorth(){
  const a = Number($('input-bet').value || 0);
  const v = cur === 'ton' ? a * ratio : a;
  $('worth').innerHTML = a > 0 ? `Ваша ставка ≈ <b>${Math.round(v * 10) / 10}</b> ${STAR}` : '';
}
function refreshMode(){
  $('mode-stars').classList.toggle('active', cur === 'stars'); $('mode-ton').classList.toggle('active', cur === 'ton');
  renderQuick(); updateWorth();
}
function clearGift(){}
$('input-bet').addEventListener('input', updateWorth);
function switchMode(m){ if (busy) return; cur = m; clearGift(); $('input-bet').value = m === 'ton' ? 0.5 : 10; refreshMode(); }
function addBet(v){ if (busy) return; clearGift(); $('input-bet').value = round2(Number($('input-bet').value || 0) + v); updateWorth(); }
function doubleBet(){ if (busy) return; clearGift(); $('input-bet').value = round2(Number($('input-bet').value || 0) * 2) || 1; updateWorth(); }
function halveBet(){ if (busy) return; clearGift(); $('input-bet').value = Math.max(cur === 'ton' ? 0.01 : 1, round2(Number($('input-bet').value || 0) / 2)); updateWorth(); }
function maxBet(){ if (busy) return; clearGift(); $('input-bet').value = cur === 'ton' ? Number(me.ton).toFixed(2) : Math.floor(me.balance); updateWorth(); }

async function refreshMe(){
  try {
    const r = await api(`/plinko/me/${encodeURIComponent(UID)}`);
    me.balance = r.balance; me.ton = r.ton_balance; ratio = r.stars_per_ton || ratio;
    if (r.buckets && r.buckets.length === 9) BUCKETS = r.buckets;
    paintBalances(); draw(); return r;
  } catch(e){ console.error(e); toast('Сервис временно недоступен', 'lose'); }
}

function addHistory(r){
  const h = $('history'); if (h.querySelector('.hempty')) h.innerHTML = '';
  const c = document.createElement('div'); c.className = 'hchip ' + (r.mult >= 5 ? 'big' : r.mult >= 1 ? 'win' : 'lose'); c.textContent = r.mult + 'x';
  h.prepend(c); while (h.children.length > 30) h.lastChild.remove();
}
function prizeText(w){
  const p = [];
  if (w.stars > 0) p.push('+' + round2(w.stars) + ' ⭐');
  if (w.ton > 0) p.push('+' + Number(w.ton).toFixed(2) + ' TON');
  return p.join(' ') || '0';
}

async function drop(){
  if (busy) return;
  const amount = Number($('input-bet').value);
  if (!amount || amount <= 0) return toast('Укажите сумму ставки', 'lose');
  if (cur === 'stars' ? amount > me.balance : amount > me.ton) return toast('Недостаточно средств', 'lose');
  busy = true; $('btn-main').disabled = true; setStatus('Шарик летит…');
  // шарик стартует мгновенно, ставка списывается на экране сразу
  if (cur === 'ton') me.ton -= amount; else me.balance -= amount;
  paintBalances(); haptic('impactOccurred', 'medium');
  const ballCtl = runBall();
  try {
    const r = await api('/plinko/drop', { method: 'POST', body: { currency: cur, amount } });
    ballCtl.setSlot(r.slot);
    await ballCtl.done;
    me.balance = r.balance; me.ton = r.ton_balance; paintBalances();
    addHistory(r);
    const win = r.mult >= 1;
    setStatus(`${r.mult}x · ${prizeText(r.win)}`, win ? 'win' : 'lose');
    toast(`${r.mult}x: ${prizeText(r.win)}`, win ? 'win' : 'lose');
    haptic('notificationOccurred', win ? 'success' : 'warning');
  } catch(e){
    ballCtl.stop(); toast(e.message, 'lose'); setStatus('Сделайте ставку'); refreshMe();
  }
  busy = false; $('btn-main').disabled = false;
}

renderQuick(); updateWorth(); refreshMe();
</script>
</body>
</html>
